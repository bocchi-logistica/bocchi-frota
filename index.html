function TelaChecklist({st, setSt, user, toast, inicioAgendamento, onInicioConsumido, onConcluidoAgendamento}){
  /* ALTERAÇÃO V6: o envio agora passa por IndexedDB + ApiService (fila offline
     com idempotência por idLocal). O estado local (setSt) é mantido apenas
     para a demonstração do fluxo de aprovação do ADM. */
  const meus = st.checklists.filter(c=>c.motorista===user.nome).sort((a,b)=>b.data.localeCompare(a.data));
  const normalizarTexto = valor=>String(valor||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  const deHoje = meus.find(c=>c.data===HOJE && c.status!=='reprovado');
  const reprovadoHoje = meus.find(c=>c.data===HOJE && c.status==='reprovado');
  const [preenchendo,setPreenchendo]=useState(false);
  const [resps,setResps]=useState({});
  const [ver,setVer]=useState(null);
  const mesAtualFiltro = String(HOJE||'').slice(0,7);
  const [filtroMesHistorico,setFiltroMesHistorico]=useState(mesAtualFiltro);
  const [filtroStatusHistorico,setFiltroStatusHistorico]=useState('todos');
  const [extras,setExtras]=useState({km:'', combustivel:''});
  const [enviando,setEnviando]=useState(false);
  const [ultimoEnvio,setUltimoEnvio]=useState(null);   // confirmação real da API (protocolo)
  const [pendentes,setPendentes]=useState([]);          // fila local aguardando envio
  const [online,setOnline]=useState(navigator.onLine);
  const [temRascunho,setTemRascunho]=useState(false);
  const fileRefs = useRef({});
  const veiculosDemo = Object.values(st.frota).filter(f=>f.motorista===user.nome);
  const [veiculosPermitidos,setVeiculosPermitidos]=useState(CONFIG.MODO_DEMONSTRACAO?veiculosDemo:[]);
  const [carregandoVeiculos,setCarregandoVeiculos]=useState(!CONFIG.MODO_DEMONSTRACAO);
  const [erroVeiculos,setErroVeiculos]=useState('');
  const [veiculo,setVeiculo]=useState(veiculosDemo[0]?.placa||'');
  const vSel = veiculosPermitidos.find(v=>v.placa===veiculo);
  const frotaSel = normalizarTexto(vSel?.tipoFrota||vSel?.frota||'').includes('leve') ? 'leve' : 'pesada';

  const [perguntasAtivas,setPerguntasAtivas]=useState([]);
  const [carregandoPerguntas,setCarregandoPerguntas]=useState(false);
  const [erroPerguntas,setErroPerguntas]=useState('');
  const [modoOcorrenciaAgendamento,setModoOcorrenciaAgendamento]=useState(false);
  const [grupoOcorrencia,setGrupoOcorrencia]=useState('');
  const [ultimoChecklistValido,setUltimoChecklistValido]=useState(null);

  useEffect(()=>{
    if(CONFIG.MODO_DEMONSTRACAO) return;
    let ativo=true;
    setCarregandoVeiculos(true); setErroVeiculos('');
    ApiService.obterVeiculos().then(r=>{
      if(!ativo) return;
      const recebidos=r.veiculos||[];
      if(inicioAgendamento?.placa){
        const placaAlvo=String(inicioAgendamento.placa||'').trim().toUpperCase();
        const cadastrado=recebidos.find(v=>String(v.placa||'').trim().toUpperCase()===placaAlvo);
        const unico=cadastrado||{placa:placaAlvo,tipoFrota:'FROTA LEVE',frota:'FROTA LEVE',tipoModelo:'CARRO',tipo:'CARRO',usoCompartilhado:true,ativo:true};
        setVeiculosPermitidos([unico]);
        setVeiculo(unico.placa);
      }else{
        // No checklist aberto manualmente, veículos compartilhados de agendamento não podem ser escolhidos.
        // Permanecem somente veículos efetivamente vinculados ao usuário (ex.: Frota Pesada).
        const vinculados=recebidos.filter(v=>v.usoCompartilhado!==true);
        setVeiculosPermitidos(vinculados);
        setVeiculo(atual=>vinculados.some(v=>v.placa===atual)?atual:(vinculados[0]?.placa||''));
      }
    }).catch(e=>{if(ativo){setVeiculosPermitidos([]);setVeiculo('');setErroVeiculos(e.message||'Não foi possível carregar os veículos.');}})
      .finally(()=>{if(ativo)setCarregandoVeiculos(false);});
    return ()=>{ativo=false;};
  },[user.id,user.login,inicioAgendamento?.placa]);

  const normalizarStatusChecklist = valor=>{
    const s = String(valor||'pendente').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
    if(s.includes('aprov')) return 'aprovado';
    if(s.includes('reprov')) return 'reprovado';
    return 'pendente';
  };

  const carregarHistorico = async ()=>{
    if(CONFIG.MODO_DEMONSTRACAO) return;
    try{
      const r = await ApiService.consultarMeusChecklists();
      const vindos = (r.checklists||[]).map(x=>({
        id:x.protocolo || x.id,
        idLocal:x.idLocal || '',
        motorista:x.motoristaNome || user.nome,
        placa:x.placa || '',
        frota:String(x.tipoChecklist||'').toUpperCase().includes('LEVE') ? 'leve' : 'pesada',
        data:String(x.dataHoraLocal||'').slice(0,10),
        status:normalizarStatusChecklist(x.status),
        motivoReprova:x.motivoReprova || '',
        km:String(x.quilometragem||''),
        respostas:(x.respostas||[]).map(rr=>({
          pid:String(rr.idPergunta||''),
          pergunta:rr.pergunta||'',
          resp:rr.resposta||'NA',
          obs:rr.observacao||'',
          foto:rr.linkFoto||null
        }))
      }));
      setSt(s=>({...s, checklists:vindos}));
    }catch(e){
      toast('O checklist foi salvo, mas não foi possível atualizar o histórico: '+(e.message||e));
    }
  };

  useEffect(()=>{ carregarHistorico(); },[]);

  useEffect(()=>{
    let ativo = true;
    const carregar = async ()=>{
      setCarregandoPerguntas(true);
      setErroPerguntas('');
      setPerguntasAtivas([]);
      try{
        const tipo = frotaSel==='leve' ? 'LEVE' : 'PESADA';
        const r = await ApiService.obterPerguntas(tipo,{placa:veiculo,ignorarFrequencia:!!inicioAgendamento?.agendamentoId});
        if(!ativo) return;
        const lista = (r.perguntas || []).map(p=>({
          id:String(p.id),
          texto:p.texto || '',
          grupo:p.grupo || 'Outros',
          frota:(p.tipoFrota || tipo).toLowerCase(),
          frequencia:p.frequencia || 'Diária',
          obrigatoria:p.obrigatoria === true,
          fotoNC:p.fotoObrigatoriaNC === true,
          observacaoObrigatoriaNC:p.observacaoObrigatoriaNC === true,
          ativa:p.ativa !== false,
          ordem:Number(p.ordem || 999)
        })).sort((a,b)=>a.grupo.localeCompare(b.grupo,'pt-BR') || a.ordem-b.ordem);
        setPerguntasAtivas(lista);
      }catch(e){
        if(ativo) setErroPerguntas(e.message || 'Não foi possível carregar as perguntas.');
      }finally{
        if(ativo) setCarregandoPerguntas(false);
      }
    };
    carregar();
    return ()=>{ ativo=false; };
  },[frotaSel,veiculo]);

  useEffect(()=>{
    if(!inicioAgendamento?.placa||carregandoVeiculos) return;
    const placaAlvo=String(inicioAgendamento.placa).toUpperCase();
    const encontrado=veiculosPermitidos.find(v=>String(v.placa||'').toUpperCase()===placaAlvo);
    if(encontrado && veiculo!==encontrado.placa) setVeiculo(encontrado.placa);
  },[inicioAgendamento,carregandoVeiculos,veiculosPermitidos,veiculo]);

  useEffect(()=>{
    if(!inicioAgendamento?.placa||preenchendo||carregandoVeiculos||carregandoPerguntas||erroVeiculos||erroPerguntas) return;
    if(String(veiculo||'').toUpperCase()!==String(inicioAgendamento.placa).toUpperCase()) return;
    if(!perguntasAtivas.length) return;
    let ativo=true;
    const preparar=async()=>{
      try{
        let modo=String(inicioAgendamento.modoChecklist||'').toUpperCase();
        let ultimo=inicioAgendamento.ultimoChecklist||null;
        if(!modo){
          const contexto=await ApiService.contextoChecklistAgendamento(veiculo);
          modo=contexto?.modoChecklist||'COMPLETO';
          ultimo=contexto?.ultimoChecklist||null;
        }
        if(!ativo)return;
        setExtras(x=>({...x,km:String(inicioAgendamento.km||x.km||'')}));
        setResps({});
        setGrupoOcorrencia('');
        setUltimoChecklistValido(ultimo);
        setModoOcorrenciaAgendamento(modo==='OCORRENCIA');
        setPreenchendo(true);
        setUltimoEnvio(null);
      }catch(e){
        if(ativo)toast('Não foi possível preparar o checklist do agendamento: '+(e.message||e));
      }finally{}
    };
    preparar();
    return()=>{ativo=false};
  },[inicioAgendamento,veiculo,perguntasAtivas,carregandoVeiculos,carregandoPerguntas,erroVeiculos,erroPerguntas,preenchendo]);
  const grupos = [...new Set(perguntasAtivas.map(p=>p.grupo))];
  const perguntasExibidas=modoOcorrenciaAgendamento?(grupoOcorrencia?perguntasAtivas.filter(p=>p.grupo===grupoOcorrencia):[]):perguntasAtivas;
  const chaveRascunho = 'ck_'+user.login+'_'+HOJE;

  // Histórico e indicadores respeitam o mês/status escolhidos pelo motorista.
  const historicoFiltrado = meus.filter(c=>(!filtroMesHistorico || String(c.data||'').slice(0,7)===filtroMesHistorico) && (filtroStatusHistorico==='todos' || c.status===filtroStatusHistorico));
  const cont = lista => ({tot:lista.length, ap:lista.filter(c=>c.status==='aprovado').length, rep:lista.filter(c=>c.status==='reprovado').length, pen:lista.filter(c=>c.status==='pendente').length});
  const cM = cont(historicoFiltrado);
  const mesFiltroLabel = filtroMesHistorico ? mesLabel(filtroMesHistorico.slice(5,7)+'/'+filtroMesHistorico.slice(0,4)) : 'todos os meses';

  /* ALTERAÇÃO V6: monitorar fila local e estado da conexão */
  const atualizarFila = ()=>{ FilaEnvio.pendentes(user.login).then(setPendentes).catch(()=>{}); };
  useEffect(()=>{
    atualizarFila();
    const ouv = ()=>atualizarFila();
    FilaEnvio.ouvintes.add(ouv);
    const on = ()=>{ setOnline(true); FilaEnvio.processar(toast, user.login); };
    const off = ()=>setOnline(false);
    window.addEventListener('online', on); window.addEventListener('offline', off);
    // Remove automaticamente apenas registros locais impossíveis de recuperar.
    // Checklists válidos aguardando internet continuam preservados.
    FilaEnvio.sanear(user.login).then(()=>atualizarFila()).catch(()=>{});
    IDB.lerRascunho(chaveRascunho).then(r=>setTemRascunho(!!r));
    return ()=>{ FilaEnvio.ouvintes.delete(ouv); window.removeEventListener('online', on); window.removeEventListener('offline', off); };
  },[user.login]);

  /* ALTERAÇÃO V6: salvamento automático do rascunho + aviso ao sair da página */
  useEffect(()=>{
    if(!preenchendo) return;
    const t = setTimeout(()=>{ IDB.salvarRascunho(chaveRascunho, {resps, extras, veiculo}).catch(()=>{}); }, 800);
    return ()=>clearTimeout(t);
  },[resps, extras, veiculo, preenchendo]);
  useEffect(()=>{
    if(!preenchendo) return;
    const aviso = e=>{ e.preventDefault(); e.returnValue=''; };
    window.addEventListener('beforeunload', aviso);
    return ()=>window.removeEventListener('beforeunload', aviso);
  },[preenchendo]);

  const abrirFormulario = async ()=>{
    if(carregandoVeiculos){ toast('Aguarde: carregando o veículo vinculado.'); return; }
    if(erroVeiculos){ toast('Não foi possível abrir o checklist: '+erroVeiculos); return; }
    if(!veiculo){ toast('Nenhum veículo ativo está compartilhado ou vinculado ao seu usuário.'); return; }
    if(carregandoPerguntas){
      toast('Aguarde: carregando as perguntas do SharePoint.');
      return;
    }
    if(erroPerguntas){
      toast('Não foi possível abrir o checklist: '+erroPerguntas);
      return;
    }
    if(!perguntasAtivas.length){
      toast('Não há inspeções pendentes para este veículo neste período.');
      return;
    }
    const r = await IDB.lerRascunho(chaveRascunho).catch(()=>null);
    if (r && (Object.keys(r.resps||{}).length || r.extras && r.extras.km)){
      setResps(r.resps||{}); setExtras(r.extras||{km:'',combustivel:''});
      if (r.veiculo) setVeiculo(r.veiculo);
      toast('Rascunho recuperado — continue de onde parou.');
    }
    setPreenchendo(true); setUltimoEnvio(null);
  };
  const cancelar = ()=>{
    setPreenchendo(false); setResps({}); setExtras({km:'',combustivel:''}); setModoOcorrenciaAgendamento(false); setGrupoOcorrencia(''); setUltimoChecklistValido(null);
    IDB.apagarRascunho(chaveRascunho).catch(()=>{}); setTemRascunho(false);
    if(inicioAgendamento?.agendamentoId&&onInicioConsumido) onInicioConsumido();
  };

  const setResp=(pid, campo, v)=> setResps(r=>({...r, [pid]:{...(r[pid]||{}), [campo]:v}}));

  /* ALTERAÇÃO V6: foto é comprimida (máx. 1600px, JPEG q=0,7) antes de anexar */
  const anexar=(pid, e)=>{
    const f = e.target.files && e.target.files[0]; if(!f) return;
    e.target.value = '';
    comprimirImagem(f)
      .then(b64=>setResp(pid,'foto',b64))
      .catch(err=>toast(err.message));
  };
  const removerFoto=(pid)=> setResp(pid,'foto',null);

  const obterLocalizacao = ()=> new Promise(res=>{
    if(!navigator.geolocation) return res({latitude:null, longitude:null});
    navigator.geolocation.getCurrentPosition(
      p=>res({latitude:p.coords.latitude, longitude:p.coords.longitude}),
      ()=>res({latitude:null, longitude:null}),
      {timeout:4000, maximumAge:600000});
  });

  /* ALTERAÇÃO V6: validações, payload padronizado, fila IndexedDB e envio à API */
  const enviar = async ()=>{
    if (enviando) return; // prevenção contra clique duplo
    if(!String(user?.nome||'').trim() || !String(user?.login||'').trim()){
      toast('Sua sessão está incompleta. Saia, entre novamente e refaça o checklist.'); return;
    }
    if(!String(veiculo||'').trim()){
      toast('Selecione um veículo antes de enviar.'); return;
    }
    // Quilometragem obrigatória e válida para qualquer frota
    const km = parseInt(extras.km||localStorage.getItem('km_'+veiculo)||'0', 10);
    if ((!modoOcorrenciaAgendamento&&!extras.km) || isNaN(km) || km<=0){ toast('Informe a quilometragem atual do veículo (somente números).'); return; }
    if (km > 3000000){ toast('Quilometragem fora do limite razoável. Confira o valor.'); return; }
    const ultimoKm = parseInt(localStorage.getItem('km_'+veiculo)||'0',10);
    if (ultimoKm && km < ultimoKm && !window.confirm('Atenção: a quilometragem informada ('+km+') é MENOR que a última registrada para esta placa ('+ultimoKm+'). Deseja continuar mesmo assim?')) return;
    for(const p of perguntasExibidas){
      const r = resps[p.id];
      // No checklist periódico completo, mantém a obrigatoriedade normal.
      // No modo NC do agendamento, o motorista responde somente o(s) item(ns) com problema.
      if(!modoOcorrenciaAgendamento && p.obrigatoria && (!r || !r.resp)){ toast('Responda: "'+p.texto.slice(0,40)+'..."'); return; }
      if(r && r.resp==='NC' && !r.obs){ toast('Descreva o problema do item não conforme: '+p.texto.slice(0,35)+'...'); return; }
      if(r && r.resp==='NC' && p.fotoNC && !r.foto){ toast('Anexe a foto da não conformidade: '+p.texto.slice(0,35)+'...'); return; }
    }
    if(modoOcorrenciaAgendamento){
      if(!grupoOcorrencia){toast('Selecione o grupo onde foi identificada a não conformidade.');return;}
      const respostasNC=perguntasExibidas.filter(p=>resps[p.id]?.resp==='NC');
      if(!respostasNC.length){toast('Marque ao menos uma pergunta como Não conforme no grupo selecionado.');return;}
    }
    if(!window.confirm('Confirma o envio do checklist da placa '+veiculo+'?')) return;

    setEnviando(true);
    try{
      const loc = await obterLocalizacao();
      const idLocal = gerarUUID(); // mesmo id em todas as tentativas -> sem duplicidade no SharePoint
      const registro = {
        idLocal,
        dataHoraLocal: agoraISO(),
        motorista: {nome:user.nome, login:user.login},
        veiculo: {placa:veiculo, tipo: vSel ? vSel.tipo : ''},
        quilometragem: km,
        combustivel: frotaSel==='leve' ? (extras.combustivel||'') : '',
        tipoChecklist: modoOcorrenciaAgendamento ? 'LEVE_NC_AGENDAMENTO' : (frotaSel==='leve' ? 'LEVE' : 'PESADA'),
        versaoFormulario: CONFIG.VERSAO,
        localizacao: loc,
        respostas: (modoOcorrenciaAgendamento?perguntasExibidas.filter(p=>resps[p.id]?.resp):perguntasExibidas).map(p=>{
          const r = resps[p.id]||{};
          return {idPergunta:p.id, grupo:p.grupo, pergunta:p.texto,
                  resposta:r.resp||'NA', observacao:r.obs||'', possuiFoto:!!r.foto,
                  fotos: r.foto ? [{nome:p.id+'-01.jpg', tipo:'image/jpeg', conteudoBase64:r.foto}] : []};
        }),
        quantidadeNC: perguntasExibidas.filter(p=>resps[p.id] && resps[p.id].resp==='NC').length,
        statusChecklist: 'PENDENTE',
        agendamentoId: inicioAgendamento?.agendamentoId || '',
        etapaAgendamento: inicioAgendamento?.etapa || '',
        origemChecklist: inicioAgendamento?.agendamentoId ? (modoOcorrenciaAgendamento?'AGENDAMENTO_NC':'AGENDAMENTO_RETIRADA') : 'CHECKLIST_NORMAL',
        regularizacaoTerceiro: inicioAgendamento?.regularizacaoTerceiro===true
      };

      // 1) grava na fila local ANTES de tentar enviar (não se perde sem internet)
      await FilaEnvio.adicionar(registro);
      localStorage.setItem('km_'+veiculo, String(km));

      // Somente no modo demonstração o registro entra diretamente no painel local.
      // Em produção, o painel administrativo deve carregar exclusivamente os dados da API/SharePoint.
      if (CONFIG.MODO_DEMONSTRACAO){
        const registroLocal = {id:'demo'+Date.now(), idLocal, motorista:user.nome, placa:veiculo, frota:frotaSel, data:HOJE, status:'pendente', motivoReprova:'',
          km: String(km), combustivel: extras.combustivel||'',
          respostas: perguntasExibidas.map(p=>({pid:p.id, resp:(resps[p.id]&&resps[p.id].resp)||'NA', obs:(resps[p.id]&&resps[p.id].obs)||'', foto:(resps[p.id]&&resps[p.id].foto)||null}))};
        setSt(s=>({...s, checklists:[...s.checklists, registroLocal]}));
      }

      // 2) tenta enviar agora; só marca ENVIADO com confirmação real da API
      await FilaEnvio.processar(toast, user.login);
      const fila = await IDB.listarFila();
      const meu = fila.find(x=>x.idLocal===idLocal);
      if (meu && meu.statusEnvio==='ENVIADO'){
        setUltimoEnvio({protocolo:meu.protocolo, placa:veiculo, quando:meu.dataHoraRecebimento||agoraISO()});
        await carregarHistorico();
        if(inicioAgendamento?.agendamentoId && onConcluidoAgendamento){
          setTimeout(()=>onConcluidoAgendamento(),350);
        }
      } else if (!navigator.onLine){
        toast('Sem conexão com a internet. O checklist foi salvo neste aparelho e será enviado quando a conexão retornar.');
      } else {
        toast('Não foi possível concluir o envio agora. Seus dados continuam salvos neste aparelho.');
      }
      await IDB.apagarRascunho(chaveRascunho); setTemRascunho(false);
      setPreenchendo(false); setResps({}); setExtras({km:'',combustivel:''}); setModoOcorrenciaAgendamento(false); setGrupoOcorrencia(''); setUltimoChecklistValido(null);
      atualizarFila();
    } finally {
      setEnviando(false);
    }
  };

  const reenviarPendentes = ()=>{ toast('Tentando enviar novamente...'); FilaEnvio.processar(toast, user.login); };
  const excluirRegistroInvalido = async idLocal=>{
    if(!window.confirm('Excluir este envio incompleto deste aparelho? Depois será necessário refazer o checklist.')) return;
    await IDB.removerFila(idLocal); atualizarFila();
    toast('Registro incompleto removido. Refaça o checklist.');
  };
  const rotuloStatusEnvio = {RASCUNHO:'Rascunho', PENDENTE:'Aguardando envio', ENVIANDO:'Enviando...', ENVIADO:'Enviado', ERRO:'Falha no envio', DADOS_INCOMPLETOS:'Precisa ser refeito'};

  return (
    <React.Fragment>
      {/* ALTERAÇÃO V6: barra de conexão + fila pendente */}
      {!online &&
        <div className="erro-box">Sem conexão com a internet. Você pode preencher normalmente — o checklist ficará salvo neste aparelho e será enviado quando a conexão retornar.</div>}
      {pendentes.length>0 &&
        <div className="card" style={{borderLeft:'4px solid var(--colheita)'}}>
          <div className="row">
            <div className="grow"><b>{pendentes.length} checklist(s) aguardando envio</b>
              <div className="muted">{pendentes.map(p=>dataBR(String(p.dataHoraLocal||'').slice(0,10))+' · '+(p.veiculo?.placa||'placa não informada')+' · '+(rotuloStatusEnvio[p.statusEnvio]||p.statusEnvio)+(p.ultimoErro?' ('+p.ultimoErro+')':'')).join(' — ')}</div>
            </div>
            {pendentes.some(p=>p.statusEnvio==='DADOS_INCOMPLETOS')
              ? <button className="btn btn-d btn-sm" onClick={()=>excluirRegistroInvalido(pendentes.find(p=>p.statusEnvio==='DADOS_INCOMPLETOS').idLocal)}>Excluir e refazer</button>
              : <button className="btn btn-s btn-sm" onClick={reenviarPendentes}>Tentar enviar novamente</button>}
          </div>
        </div>}
      {ultimoEnvio &&
        <div className="card" style={{borderLeft:'4px solid var(--ok)'}}>
          <b>Checklist enviado com sucesso.</b>
          <div className="muted" style={{marginTop:4}}>
            Protocolo: <b className="num">{ultimoEnvio.protocolo}</b><br/>
            Placa: <b>{ultimoEnvio.placa}</b> · Data: {dataBR(ultimoEnvio.quando.slice(0,10))} às {ultimoEnvio.quando.slice(11,16)}
          </div>
        </div>}

      {!preenchendo && <React.Fragment>
        <div className="totais">
          <div className="card"><div className="v num">{cM.tot}</div><div className="l">Checklists em {mesFiltroLabel}</div></div>
          <div className="card"><div className="v num" style={{color:'var(--mata)'}}>{cM.ap}</div><div className="l">Aprovados</div></div>
          <div className="card"><div className="v num" style={{color:cM.rep?'var(--erro)':'var(--mata)'}}>{cM.rep}</div><div className="l">Reprovados</div></div>
        </div>
        {cM.pen>0 && <div className="muted" style={{textAlign:'center', marginTop:-4}}>{cM.pen} checklist(s) aguardando análise nos filtros selecionados.</div>}
      </React.Fragment>}

      {!preenchendo && carregandoPerguntas &&
        <div className="aviso-box">Carregando perguntas ativas do SharePoint...</div>}
      {!preenchendo && erroPerguntas &&
        <div className="erro-box">Falha ao carregar as perguntas: {erroPerguntas}</div>}
      {!preenchendo && !carregandoPerguntas && !erroPerguntas && perguntasAtivas.length===0 &&
        <div className="aviso-box">Não há inspeções pendentes para este veículo neste período.</div>}
      {!preenchendo && carregandoVeiculos && <div className="aviso-box">Carregando veículo vinculado...</div>}
      {!preenchendo && erroVeiculos && <div className="erro-box">Falha ao carregar veículos: {erroVeiculos}</div>}
      {!preenchendo && !carregandoVeiculos && !erroVeiculos && veiculosPermitidos.length===0 && !inicioAgendamento?.placa && <div className="card muted" style={{textAlign:'center',padding:'24px 16px'}}>Nenhum checklist pendente no momento.</div>}

      {!preenchendo && veiculosPermitidos.length>0 && !deHoje &&
        <div className="card" style={{textAlign:'center', padding:'26px 16px'}}>
          <div style={{fontSize:34}}>📋</div>
          <h3 style={{margin:'6px 0 2px'}}>{reprovadoHoje ? 'Check list reprovado — refazer' : 'Check list de hoje pendente'}</h3>
          {reprovadoHoje && <div className="erro-box" style={{margin:'8px 0'}}>Motivo: {reprovadoHoje.motivoReprova}</div>}
          <div className="muted" style={{marginBottom:14}}>Inspeção pendente — {dataBR(HOJE)}</div>
          <button className="btn btn-p" disabled={carregandoVeiculos||!!erroVeiculos||!veiculo} onClick={abrirFormulario}>{reprovadoHoje?'Refazer check list':(temRascunho?'Continuar rascunho':'Preencher agora')}</button>
        </div>}
      {veiculosPermitidos.length>0 && deHoje &&
        <div className="card row">
          <div className="grow"><b>Check list de hoje enviado</b><div className="muted">{dataBR(HOJE)} · {deHoje.placa}</div></div>
          <StatusTag s={deHoje.status}/>
        </div>}

      {preenchendo && <React.Fragment>
        {modoOcorrenciaAgendamento&&<div className="card" style={{borderLeft:'4px solid var(--colheita)'}}>
          <h3>Registrar não conformidade do agendamento</h3>
          <div className="muted" style={{margin:'4px 0 10px'}}>O checklist periódico desta placa já foi realizado. Registre somente o grupo e o item com problema.</div>
          {ultimoChecklistValido&&<button className="btn btn-g btn-sm" onClick={()=>setVer(ultimoChecklistValido)}>Visualizar último checklist realizado</button>}
          <div style={{marginTop:12}}><label>Grupo com problema</label><select value={grupoOcorrencia} onChange={e=>{setGrupoOcorrencia(e.target.value);setResps({});}}><option value="">Selecionar...</option>{grupos.map(g=><option key={g} value={g}>{g}</option>)}</select></div>
        </div>}
        <div className="card">
          <label>Veículo</label>
          {inicioAgendamento?.placa ? <><input value={veiculo} readOnly/><div className="muted" style={{marginTop:6}}>Placa definida automaticamente pelo agendamento.</div></> : <select value={veiculo} onChange={e=>{setVeiculo(e.target.value); setResps({});}}>
            {veiculosPermitidos.map(f=><option key={f.placa} value={f.placa}>{f.placa} — {f.tipoModelo||f.tipo} ({normalizarTexto(f.tipoFrota||f.frota).includes('leve')?'frota leve':'frota pesada'})</option>)}
          </select>}
          <div className="form-grid" style={{marginTop:12}}>
            <div><label>KM atual *</label><input type="number" inputMode="numeric" value={extras.km} onChange={e=>setExtras({...extras, km:e.target.value})} placeholder="Ex.: 158420"/></div>
            {frotaSel==='leve' && !modoOcorrenciaAgendamento &&
              <div><label>Nível de combustível</label>
                <select value={extras.combustivel} onChange={e=>setExtras({...extras, combustivel:e.target.value})}>
                  <option value="">Selecionar...</option>
                  <option>Reserva</option><option>1/4</option><option>Meio tanque</option><option>3/4</option><option>Tanque cheio</option>
                </select></div>}
          </div>
        </div>
        <div className="aviso-box">Marque cada item. Em <b>não conforme (NC)</b>, descreva o problema e anexe foto quando o item pedir. Seu preenchimento é salvo automaticamente neste aparelho.</div>
        {(modoOcorrenciaAgendamento?(grupoOcorrencia?[grupoOcorrencia]:[]):grupos).map(g=>
          <React.Fragment key={g}>
            <h3 style={{margin:'6px 2px 0'}}>{g}</h3>
            {perguntasExibidas.filter(p=>p.grupo===g).map(p=>{
              const r = resps[p.id]||{};
              return (
                <div className="card perg" key={p.id}>
                  <div className="txt">{p.texto} {!modoOcorrenciaAgendamento && p.obrigatoria && <span style={{color:'var(--erro)'}}>*</span>}</div>
                  <div className="resp-btns">
                    <button className={'resp-btn c'+(r.resp==='C'?' on':'')} onClick={()=>setResp(p.id,'resp','C')}>Conforme</button>
                    <button className={'resp-btn nc'+(r.resp==='NC'?' on':'')} onClick={()=>setResp(p.id,'resp','NC')}>Não conforme</button>
                    <button className={'resp-btn na'+(r.resp==='NA'?' on':'')} onClick={()=>setResp(p.id,'resp','NA')}>N/A</button>
                  </div>
                  {r.resp==='NC' && <div style={{marginTop:10}}>
                    <textarea rows="2" placeholder="Descreva o problema..." value={r.obs||''} onChange={e=>setResp(p.id,'obs',e.target.value)}/>
                    <div className="row" style={{marginTop:8}}>
                      {r.foto && <React.Fragment>
                        <img className="foto-thumb" src={r.foto} alt="Foto da não conformidade"/>
                        <button className="btn btn-g btn-sm" onClick={()=>removerFoto(p.id)} aria-label="Remover foto">✕ Remover</button>
                      </React.Fragment>}
                      <button className="foto-add" onClick={()=>fileRefs.current[p.id] && fileRefs.current[p.id].click()} aria-label="Anexar foto">📷</button>
                      <input type="file" accept="image/*" capture="environment" style={{display:'none'}}
                        ref={el=>fileRefs.current[p.id]=el} onChange={e=>anexar(p.id,e)}/>
                      <span className="muted">{p.fotoNC ? 'Foto obrigatória' : 'Foto opcional'}</span>
                    </div>
                  </div>}
                </div>
              );
            })}
          </React.Fragment>)}
        {enviando && <div className="aviso-box"><b>Enviando checklist...</b> Não feche esta página.</div>}
        <div className="row">
          <button className="btn btn-g grow" disabled={enviando} onClick={cancelar}>Cancelar</button>
          <button className="btn btn-p grow" disabled={enviando} style={enviando?{opacity:.6}:{}} onClick={enviar}>{enviando?'Enviando...':'Enviar check list'}</button>
        </div>
      </React.Fragment>}

      {!preenchendo && meus.length>0 && <React.Fragment>
        <div className="row" style={{marginTop:4,flexWrap:'wrap'}}>
          <h3 className="grow" style={{margin:0}}>Histórico</h3>
          <input type="month" aria-label="Filtrar histórico por mês" style={{width:'auto'}} value={filtroMesHistorico} onChange={e=>setFiltroMesHistorico(e.target.value)}/>
          <select aria-label="Filtrar histórico por status" style={{width:'auto'}} value={filtroStatusHistorico} onChange={e=>setFiltroStatusHistorico(e.target.value)}>
            <option value="todos">Todos os status</option><option value="pendente">Aguardando análise</option><option value="aprovado">Aprovados</option><option value="reprovado">Reprovados</option>
          </select>
          <button className="btn btn-g btn-sm" onClick={()=>{setFiltroMesHistorico(mesAtualFiltro);setFiltroStatusHistorico('todos')}}>Limpar filtros</button>
        </div>
        {historicoFiltrado.length===0 && <div className="card muted">Nenhum checklist encontrado nos filtros selecionados.</div>}
        {historicoFiltrado.map(c=>
          <div className="card row" key={c.id}>
            <div className="grow"><b>{dataBR(c.data)}</b><div className="muted">{c.placa} · {c.respostas.filter(r=>r.resp==='NC').length} NC</div></div>
            <StatusTag s={c.status}/>
            <button className="btn btn-g btn-sm" onClick={()=>setVer(c)}>Ver</button>
          </div>)}
      </React.Fragment>}
      {ver && <ChecklistDetalhe ck={ver} perguntas={perguntasAtivas} permitirImpressao={false} onClose={()=>setVer(null)}/>}
    </React.Fragment>
  );
}
function ChecklistDetalhe({ck, perguntas, onClose, acoes, permitirImpressao=true}){
  const [fotoAberta,setFotoAberta]=useState(null);
  const escHtml=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const escAttr=escHtml;
  const imprimir=()=>{
    const statusTexto = ck.status==='aprovado'?'Aprovado':ck.status==='reprovado'?'Reprovado':'Aguardando análise';
    const linhas = ck.respostas.map(r=>{
      const p=perguntas.find(x=>x.id===r.pid);
      const textoPergunta=p?.texto||r.pergunta||'Pergunta sem descrição';
      const resposta=r.resp==='C'?'Conforme':r.resp==='NC'?'Não conforme':'N/A';
      return `<section class="item"><div class="item-top"><strong>${escHtml(textoPergunta)}</strong><span class="resp ${r.resp}">${resposta}</span></div>${r.obs?`<div class="obs"><b>Observação:</b> ${escHtml(r.obs)}</div>`:''}${r.foto?`<img src="${escAttr(r.foto)}" alt="Foto da não conformidade">`:''}</section>`;
    }).join('');
    const w=window.open('','_blank','width=900,height=700');
    if(!w){ alert('O navegador bloqueou a janela de impressão. Permita pop-ups para este site.'); return; }
    w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Checklist ${escHtml(ck.placa||'')}</title><style>
      @page{size:A4;margin:14mm}*{box-sizing:border-box}body{font-family:Arial,sans-serif;color:#20231f;margin:0;font-size:11px}.cab{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #234b3b;padding-bottom:10px;margin-bottom:12px}.marca{color:#234b3b;font-size:18px;font-weight:700}.titulo{font-size:20px;margin:0 0 4px}.status{display:inline-block;border:1px solid #bbb;border-radius:5px;padding:4px 8px;font-weight:bold}.dados{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border:1px solid #d8dcd8;border-radius:7px;padding:10px;margin-bottom:12px}.dados div span{display:block;color:#68716b;font-size:9px;text-transform:uppercase;margin-bottom:2px}.item{border:1px solid #d8dcd8;border-radius:6px;padding:9px;margin-bottom:7px;break-inside:avoid;page-break-inside:avoid}.item-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.resp{white-space:nowrap;border-radius:10px;padding:3px 7px;font-size:9px;font-weight:bold}.resp.C{background:#dff1e7;color:#215a40}.resp.NC{background:#fde5dc;color:#9b3b20}.resp.NA{background:#eee;color:#555}.obs{margin-top:6px;color:#4d554f}.item img{display:block;max-width:100%;max-height:95mm;object-fit:contain;margin-top:8px;border:1px solid #ddd;border-radius:5px}.motivo{border:1px solid #e7a08c;background:#fff4ef;padding:9px;border-radius:6px;margin-bottom:12px}.assinaturas{display:grid;grid-template-columns:1fr 1fr;gap:35px;margin-top:24px;break-inside:avoid}.linha{border-top:1px solid #333;padding-top:5px;color:#555}.rodape{border-top:1px solid #ddd;margin-top:18px;padding-top:6px;color:#777;font-size:9px}@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
    </style></head><body><header class="cab"><div><h1 class="titulo">Registro de Checklist</h1><div>Inspeção veicular</div></div><div class="marca">Bocchi Agrobios</div></header><div class="dados"><div><span>Motorista</span><b>${escHtml(ck.motorista||'—')}</b></div><div><span>Placa</span><b>${escHtml(ck.placa||'—')}</b></div><div><span>Data</span><b>${dataBR(ck.data)}</b></div><div><span>Tipo de frota</span><b>${ck.frota==='leve'?'Frota leve':'Frota pesada'}</b></div><div><span>Status</span><b>${statusTexto}</b></div><div><span>Protocolo</span><b>${escHtml(ck.id||'—')}</b></div>${ck.frota==='leve'?`<div><span>Quilometragem</span><b>${escHtml(ck.km||'—')}</b></div>`:''}</div>${ck.status==='reprovado'&&ck.motivoReprova?`<div class="motivo"><b>Motivo da reprovação:</b> ${escHtml(ck.motivoReprova)}</div>`:''}${linhas}<div class="assinaturas"><div class="linha">Motorista — nome/data</div><div class="linha">Responsável pela análise — nome/data</div></div><footer class="rodape">Documento gerado pelo Sistema de Gestão de Frota · ${new Date().toLocaleString('pt-BR')}</footer><script>window.onload=()=>setTimeout(()=>window.print(),350)<\/script></body></html>`);
    w.document.close();
  };
  return (
    <Modal titulo={'Check list — '+dataBR(ck.data)} onClose={onClose}>
      {permitirImpressao && <div className="row" style={{justifyContent:'flex-end',marginBottom:10}}><button className="btn btn-s btn-sm" onClick={imprimir}>🖨 Imprimir</button></div>}
      <div className="muted" style={{marginBottom:10}}>{primeiroNome(ck.motorista)} · {ck.placa} · {ck.frota==='leve'?'Frota leve':'Frota pesada'} · <StatusTag s={ck.status}/></div>
      {ck.frota==='leve' && (ck.km || ck.combustivel) &&
        <div className="muted" style={{marginBottom:10}}>KM: <b className="num">{ck.km||'—'}</b> · Combustível: <b>{ck.combustivel||'—'}</b></div>}
      {ck.status==='reprovado' && ck.motivoReprova && <div className="erro-box" style={{marginBottom:10}}>Motivo da reprovação: {ck.motivoReprova}</div>}
      {ck.respostas.map(r=>{
        const p = perguntas.find(x=>x.id===r.pid);
        const textoPergunta=p?.texto||r.pergunta||'Pergunta sem descrição';
        return (
          <div key={r.pid} style={{padding:'8px 0', borderBottom:'1px solid var(--linha)'}}>
            <div className="row">
              <span className="grow" style={{fontSize:13.5}}>{textoPergunta}</span>
              <span className={'tag '+(r.resp==='C'?'tag-ok':r.resp==='NC'?'tag-neg':'tag-neutro')}>{r.resp==='C'?'Conforme':r.resp==='NC'?'NC':'N/A'}</span>
            </div>
            {r.obs && <div className="muted" style={{marginTop:4}}>{r.obs}</div>}
            {r.foto && <img className="foto-thumb foto-clicavel" style={{marginTop:6, width:110, height:110}} src={r.foto} alt="Foto anexada — clique para ampliar" title="Clique para ampliar" onClick={()=>setFotoAberta(r.foto)}/>} 
          </div>
        );
      })}
      {acoes && <div style={{marginTop:14}}>{acoes}</div>}
      {fotoAberta && <div className="visualizador-foto" onClick={e=>{if(e.target===e.currentTarget)setFotoAberta(null)}}>
        <img src={fotoAberta} alt="Foto ampliada do checklist"/>
        <div className="visualizador-foto-acoes">
          <a className="btn btn-p" href={fotoAberta} download={'checklist-'+(ck.placa||'foto')+'.jpg'} target="_blank" rel="noopener">⬇ Baixar foto</a>
          <a className="btn btn-s" href={fotoAberta} target="_blank" rel="noopener">Abrir original</a>
          <button className="btn btn-g" onClick={()=>setFotoAberta(null)}>Fechar</button>
        </div>
      </div>}
    </Modal>
  );
}


/* ================= MOTORISTA: SINISTRO ================= */
function TelaSinistro({user,toast}){
  const [veiculos,setVeiculos]=useState([]);
  const [agendamentoAtual,setAgendamentoAtual]=useState(null);
  const [historico,setHistorico]=useState([]);
  const [carregando,setCarregando]=useState(true);
  const [enviando,setEnviando]=useState(false);
  const [contatoEmergencia,setContatoEmergencia]=useState({nome:'Logística',telefone:''});
  const [registroAberto,setRegistroAberto]=useState(null);
  const [carregandoRegistro,setCarregandoRegistro]=useState(false);
  const [complementos,setComplementos]=useState({});
  const [enviandoDocumentoId,setEnviandoDocumentoId]=useState('');
  const [form,setForm]=useState({
    placa:'',motoristaNome:user.nome||'',motoristaTelefone:'',dataHoraOcorrido:'',
    localOcorrido:'',municipio:'',uf:'RS',tipoOcorrencia:'',tipoSinistro:'',descricaoOcorrido:'',
    possuiVitima:false,possuiTerceiro:false,veiculoImobilizado:false,necessitaGuincho:false,
    autoridadeAcionada:false,numeroBoletim:'',responsabilidadeInicial:'Ainda não definida'
  });
  const [arquivos,setArquivos]=useState([]);

  const carregar=async()=>{
    setCarregando(true);
    try{
      const [rv,rh,rc]=await Promise.allSettled([ApiService.obterVeiculos(),ApiService.obterMeusSinistros(),ApiService.obterContatoSinistros()]);
      let lista=rv.status==='fulfilled'?(rv.value.veiculos||[]).filter(v=>v.placa):[];
      let ag=null;
      const precisaAgendamento=Boolean(user?.perms?.agendamentos&&lista.some(v=>v.usoCompartilhado===true&&!normalizar(v.tipoFrota).includes('pesada')));
      if(precisaAgendamento){
        try{const ra=await ApiService.contextoAgendamentoAtual();const bruto=ra?.agendamento||null;const st=String(bruto?.status||'').trim().toUpperCase();if(['EM_USO','DEVOLUCAO_ATRASADA','PENDENTE_FINALIZACAO'].includes(st))ag=bruto;}catch{}
      }
      setAgendamentoAtual(ag);
      lista=lista.filter(v=>v.usoCompartilhado!==true||Boolean(ag?.placa&&normalizar(v.placa)===normalizar(ag.placa)));
      if(ag?.placa&&!lista.some(v=>normalizar(v.placa)===normalizar(ag.placa)))lista=[...lista,{itemId:ag.veiculoId||'',placa:ag.placa,tipoFrota:'FROTA LEVE',tipoModelo:ag.tipoModelo||'',modelo:ag.modelo||'',usoCompartilhado:true,principal:false}];
      setVeiculos(lista);
      const principal=lista.find(v=>v.principal&&v.usoCompartilhado!==true),agendado=ag?.placa?lista.find(v=>normalizar(v.placa)===normalizar(ag.placa)):null,preferido=agendado||principal||lista[0]||null;
      setForm(f=>({...f,placa:lista.some(v=>v.placa===f.placa)?f.placa:(preferido?.placa||'')}));
      if(rh.status==='fulfilled')setHistorico(rh.value.sinistros||[]);
      if(rc.status==='fulfilled'&&rc.value?.contato)setContatoEmergencia({nome:rc.value.contato.nome||'Logística',telefone:rc.value.contato.telefone||''});
    }finally{setCarregando(false);}
  };
  useEffect(()=>{carregar();},[]);

  const veiculoSelecionado=veiculos.find(v=>normalizar(v.placa)===normalizar(form.placa))||null;
  const ehFrotaPesada=Boolean(veiculoSelecionado&&normalizar(veiculoSelecionado.tipoFrota).includes('pesada'));
  const exigeAgendamento=Boolean(veiculoSelecionado&&!ehFrotaPesada&&veiculoSelecionado.usoCompartilhado===true);
  const agendamentoDaPlaca=Boolean(agendamentoAtual&&normalizar(agendamentoAtual.placa)===normalizar(form.placa));
  const bloqueioAgendamento=Boolean(exigeAgendamento&&(!user?.perms?.agendamentos||!agendamentoDaPlaca));

  const converterArquivos=async(lista,limiteQtd=12)=>{
    const permitidos=[...lista].slice(0,limiteQtd);
    const convertidos=[];
    let totalConvertido=0;
    for(const f of permitidos){
      let nome=f.name,tipo=f.type||'application/octet-stream',conteudoBase64='',tamanhoFinal=f.size;
      if(String(f.type||'').toLowerCase().startsWith('image/')){
        try{
          conteudoBase64=await comprimirImagem(f);
          tipo='image/jpeg';
          nome=String(f.name||'foto').replace(/\.[^.]+$/,'')+'.jpg';
          tamanhoFinal=Math.round((conteudoBase64.split(',')[1]||'').length*0.75);
        }catch(e){
          if(f.size>4*1024*1024){toast('A foto '+f.name+' é maior que 4 MB e não pôde ser otimizada automaticamente. Tente outra foto.');continue;}
        }
      }
      if(!conteudoBase64){
        if(f.size>4*1024*1024){toast('O arquivo '+f.name+' ultrapassa 4 MB. Para fotos, a Plataforma reduz automaticamente; outros arquivos precisam estar abaixo desse limite.');continue;}
        conteudoBase64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result||''));r.onerror=()=>rej(new Error('Falha ao ler '+f.name));r.readAsDataURL(f);});
        tamanhoFinal=f.size;
      }
      if(tamanhoFinal>4*1024*1024){toast('O arquivo '+nome+' ainda ultrapassa 4 MB após a otimização.');continue;}
      if(totalConvertido+tamanhoFinal>18*1024*1024){toast('Os anexos ultrapassam 18 MB após a otimização. Envie em menos arquivos.');break;}
      totalConvertido+=tamanhoFinal;
      convertidos.push({nome,tipo,conteudoBase64,tamanho:tamanhoFinal});
    }
    return convertidos;
  };
  const lerArquivos=async lista=>setArquivos(await converterArquivos(lista,12));

  const enviar=async()=>{
    const obrigatorios=[[form.tipoOcorrencia,'Selecione o tipo de ocorrência.'],[form.tipoSinistro,'Informe o detalhe da ocorrência.'],[form.placa,'Selecione a placa.'],[form.motoristaNome,'Informe o nome do motorista.'],[form.dataHoraOcorrido,'Informe a data e hora do ocorrido.'],[form.localOcorrido,'Informe o local.'],[form.descricaoOcorrido,'Descreva o ocorrido.']];
    const falta=obrigatorios.find(([v])=>!String(v||'').trim());
    if(falta){toast(falta[1]);return;}
    if(bloqueioAgendamento){toast('Esta placa é Frota Leve compartilhada e precisa estar no seu agendamento atual.');return;}
    if(form.possuiVitima&&!window.confirm('Você informou que há vítima. Confirma o envio imediato deste registro?'))return;
    if(!window.confirm('Confirma o envio da ocorrência da placa '+form.placa+'? A Logística será notificada.'))return;
    setEnviando(true);
    try{
      const r=await ApiService.criarSinistro({...form,arquivos});
      const avisoEmail=r.emailEnviado?' · E-mail disparado.':' · Atenção: e-mail não confirmado.';
      const avisoCampo=Array.isArray(r.avisosCampos)&&r.avisosCampos.length?' · Registro salvo com aviso técnico.':'';
      toast('Ocorrência enviada. Protocolo: '+r.numeroSinistro+avisoEmail+avisoCampo);
      setArquivos([]);
      setForm(f=>({...f,dataHoraOcorrido:'',localOcorrido:'',municipio:'',tipoOcorrencia:'',tipoSinistro:'',descricaoOcorrido:'',possuiVitima:false,possuiTerceiro:false,veiculoImobilizado:false,necessitaGuincho:false,autoridadeAcionada:false,numeroBoletim:'',responsabilidadeInicial:'Ainda não definida'}));
      try{const resumo=await ApiService.obterMeusSinistros();setHistorico(resumo.sinistros||[]);}catch{}
    }catch(e){toast('Não foi possível enviar a ocorrência: '+e.message);}
    finally{setEnviando(false);}
  };

  const abrirRegistro=async s=>{
    setCarregandoRegistro(true);
    try{
      const r=await ApiService.obterSinistro(s.id);
      setRegistroAberto(r.sinistro||null);setComplementos({});
    }catch(e){toast('Não foi possível abrir o sinistro: '+e.message);}
    finally{setCarregandoRegistro(false);}
  };
  const selecionarComplemento=async(docId,files)=>{
    const atuais=Array.isArray(complementos?.[docId]?.arquivos)?complementos[docId].arquivos:[];
    const restantes=Math.max(0,8-atuais.length);
    if(!restantes){toast('Limite de 8 arquivos por solicitação.');return;}
    const selecionados=[...files].slice(0,restantes),conv=[];
    let total=atuais.reduce((s,a)=>s+Number(a?.tamanho||a?.blob?.size||0),0);
    for(const f of selecionados){
      try{
        const item=await otimizarArquivoBinario(f);
        const duplicado=atuais.some(a=>String(a?.chave||'')===String(item?.chave||'')&&item?.chave);
        if(duplicado)continue;
        if(total+item.tamanho>18*1024*1024){toast('Os arquivos ultrapassam 18 MB após a otimização. Envie em menos arquivos.');break;}
        total+=item.tamanho;conv.push(item);
      }catch(e){toast(e.message||('Não foi possível preparar '+f.name));}
    }
    if(!conv.length)return;
    setComplementos(prev=>{
      const base=Array.isArray(prev?.[docId]?.arquivos)?prev[docId].arquivos:[];
      const combinados=[...base];
      for(const item of conv){
        if(combinados.length>=8)break;
        if(item?.chave&&combinados.some(a=>String(a?.chave||'')===String(item.chave)))continue;
        combinados.push(item);
      }
      return {...prev,[docId]:{...(prev[docId]||{}),arquivos:combinados}};
    });
  };
  const removerComplementoArquivo=(docId,indice)=>setComplementos(prev=>{
    const atual=prev?.[docId]||{};
    return {...prev,[docId]:{...atual,arquivos:(atual.arquivos||[]).filter((_,i)=>i!==indice)}};
  });
  const enviarComplemento=async doc=>{
    const dados=complementos[doc.id]||{};
    if(!Array.isArray(dados.arquivos)||!dados.arquivos.length){toast('Selecione o arquivo solicitado.');return;}
    setEnviandoDocumentoId(doc.id);
    try{
      const enviados=[];
      for(let i=0;i<dados.arquivos.length;i++){
        const retorno=await ApiService.enviarArquivoDocumentoSinistro(registroAberto.id,doc.id,dados.arquivos[i]);
        if(retorno?.arquivo)enviados.push(retorno.arquivo);
      }
      const fim=await ApiService.finalizarDocumentoSinistro(registroAberto.id,doc.id,{arquivos:enviados,observacaoMotorista:String(dados.observacao||'').trim()});
      const atualizado=fim.solicitacao||{...doc,statusDocumento:'Enviado',arquivos:enviados};
      setRegistroAberto(atual=>({...atual,solicitacoesDocumentos:(atual?.solicitacoesDocumentos||[]).map(x=>String(x.id)===String(doc.id)?atualizado:x)}));
      setHistorico(lista=>lista.map(s=>String(s.id)===String(registroAberto.id)?{...s,documentosResumo:(()=>{const docs=(registroAberto.solicitacoesDocumentos||[]).map(x=>String(x.id)===String(doc.id)?atualizado:x);return {totalAtivos:docs.filter(x=>x.ativo!==false).length,pendentesEnvio:docs.filter(x=>normalizarPerfil(x.statusDocumento)==='PENDENTE_DE_ENVIO').length,enviados:docs.filter(x=>normalizarPerfil(x.statusDocumento)==='ENVIADO').length,aceitos:docs.filter(x=>normalizarPerfil(x.statusDocumento)==='ACEITO').length,rejeitados:docs.filter(x=>normalizarPerfil(x.statusDocumento)==='REJEITADO').length,dispensados:docs.filter(x=>normalizarPerfil(x.statusDocumento)==='DISPENSADO').length};})()}:s));
      setComplementos(prev=>({...prev,[doc.id]:{arquivos:[],observacao:''}}));
      toast('Documento enviado para conferência da Logística.');
    }catch(e){toast('Não foi possível enviar o documento: '+e.message);}
    finally{setEnviandoDocumentoId('');}
  };

  const configuracaoOcorrencias={
    'Acidente':{
      detalhes:['Colisão','Abalroamento','Saída de pista','Tombamento','Capotamento','Incêndio','Fenômeno da natureza','Outro'],

  return <React.Fragment>
    <div className="card sinistro-hero sinistro-bloco-compacto"><div className="row"><div style={{fontSize:30}}>🚨</div><div className="grow"><h2 style={{marginBottom:2}}>Comunicar ocorrência</h2><div className="muted">Escolha o que aconteceu para visualizar somente as orientações e perguntas necessárias.</div></div></div></div>
    <div className="card sinistro-bloco-compacto">

        {form.necessitaGuincho&&<div className="sinistro-guincho"><b>🚨 Guincho necessário</b><div style={{marginTop:3}}>A Logística receberá esta informação e fará o acionamento. Não acione o guincho diretamente.</div></div>}
        {form.tipoOcorrencia==='Acidente'&&!form.autoridadeAcionada&&<div className="aviso-box" style={{marginTop:10}}>Sem atendimento policial no local: envie a ocorrência e as evidências. A Logística avaliará o B.O. online quando aplicável.</div>}

        <div style={{marginTop:10}}><label>Descrição do ocorrido *</label><textarea rows="4" value={form.descricaoOcorrido} onChange={e=>setForm({...form,descricaoOcorrido:e.target.value})} placeholder={form.tipoOcorrencia==='Pane'?'Informe sintomas, ruídos, luzes do painel e o que o veículo apresentou.':form.tipoOcorrencia==='Avaria'?'Informe o que foi avariado e em que condição o veículo ficou.':'Relate de forma objetiva o que ocorreu.'}/></div>
        <div style={{marginTop:10}}><label>Fotos e documentos</label><input type="file" multiple accept="image/*,.pdf,.doc,.docx,video/*" onChange={e=>lerArquivos(e.target.files||[])}/><div className="muted">Fotos são otimizadas automaticamente. Outros arquivos: até 4 MB por arquivo; máximo de 18 MB por envio.</div>{arquivos.map((a,i)=><div className="sinistro-arquivo" key={a.nome+i}><span>📎</span><span className="grow">{a.nome}</span></div>)}</div>
        <button className="btn btn-d" style={{width:'100%',marginTop:12}} disabled={enviando||carregando||bloqueioAgendamento||!form.placa||!form.tipoOcorrencia} onClick={enviar}>{enviando?'Enviando e notificando...':'Enviar ocorrência'}</button>
      </div>
    </React.Fragment>}

    <div className="card"><div className="row" style={{marginBottom:5}}><h3 className="grow">Meus registros</h3>{carregandoRegistro&&<span className="muted">Abrindo...</span>}</div>{historico.length?historico.map(s=>{const sit=situacaoMotoristaSinistro(s);return <button className={'sinistro-registro-card'+(sit.chave==='ACAO_NECESSARIA'?' acao':'')} key={s.id} onClick={()=>abrirRegistro(s)}><span className="grow"><b>{s.numeroSinistro}</b><span className="muted" style={{display:'block'}}>{dataBR(String(s.dataHoraOcorrido||'').slice(0,10))} · {s.placa}</span><span style={{display:'block',fontSize:12,marginTop:2}}>{s.tipoOcorrencia||'Ocorrência'} · {s.tipoSinistro}</span><span className="muted" style={{display:'block',marginTop:5}}>{sit.descricao}</span></span><SituacaoMotoristaSinistroTag sinistro={s}/><span style={{fontSize:20}}>→</span></button>}):<div className="muted">Nenhum registro encontrado.</div>}</div>

    {registroAberto&&<Modal large titulo={registroAberto.numeroSinistro+' — '+registroAberto.placa} onClose={()=>setRegistroAberto(null)}>
      <div className="cards4">
        <div className="card"><label>Situação</label><SituacaoMotoristaSinistroTag sinistro={registroAberto}/><div className="muted" style={{marginTop:6}}>{situacaoMotoristaSinistro(registroAberto).descricao}</div></div>
        <div className="card"><label>Ocorrido</label><b>{dataHoraBRSinistro(registroAberto.dataHoraOcorrido)}</b></div>
        <div className="card"><label>Ocorrência</label><b>{registroAberto.tipoOcorrencia||'—'}</b><div className="muted">{registroAberto.tipoSinistro}</div>{registroAberto.necessitaGuincho&&<div style={{marginTop:6,fontWeight:800,color:'var(--erro)'}}>🚨 Guincho necessário</div>}</div>
        <div className="card"><label>Local</label><b>{registroAberto.localOcorrido}</b><div className="muted">{registroAberto.municipio} / {registroAberto.uf}</div></div>
      </div>
      <div className="card" style={{marginTop:10}}><label>Descrição do ocorrido</label><div style={{whiteSpace:'pre-wrap'}}>{registroAberto.descricaoOcorrido}</div></div>
      {(registroAberto.solicitacoesDocumentos||[]).length>0&&<div className="card" style={{marginTop:10}}><h3>Solicitações da Logística</h3><div className="muted" style={{marginTop:3}}>Envie somente os documentos solicitados abaixo. Cada item possui acompanhamento próprio.</div>{registroAberto.solicitacoesDocumentos.map(doc=>{const chave=normalizarPerfil(doc.statusDocumento);const podeEnviar=normalizarPerfil(registroAberto.statusSinistro)==='AGUARDANDO_DOCUMENTOS'&&['PENDENTE_DE_ENVIO','REJEITADO'].includes(chave);const dados=complementos[doc.id]||{};return <div className={'sinistro-documento-item '+(chave==='REJEITADO'?'rejeitado':chave==='PENDENTE_DE_ENVIO'?'pendente':chave==='ENVIADO'?'enviado':chave==='ACEITO'?'aceito':'dispensado')} key={doc.id}><div className="row"><div className="grow"><b>{doc.tipoDocumento}</b>{doc.obrigatorio&&<span className="muted"> · obrigatório</span>}</div><DocumentoStatusTag s={doc.statusDocumento}/></div>{doc.descricaoSolicitacao&&<div style={{marginTop:7,whiteSpace:'pre-wrap'}}>{doc.descricaoSolicitacao}</div>}{doc.motivoRejeicao&&<div className="erro-box" style={{marginTop:8}}><b>Motivo para reenviar:</b> {doc.motivoRejeicao}</div>}{(doc.arquivos||[]).length>0&&<GaleriaArquivosSinistro arquivos={doc.arquivos}/>}{podeEnviar&&<div style={{marginTop:10}}><label>{chave==='REJEITADO'?'Reenviar arquivo(s)':'Adicionar arquivo(s)'}</label><input type="file" multiple accept="image/*,.pdf,.doc,.docx,video/*" onChange={e=>{selecionarComplemento(doc.id,e.target.files||[]);e.target.value='';}}/><div className="muted" style={{marginTop:5}}>Até 8 arquivos. No celular, você pode selecionar vários de uma vez ou voltar em “Escolher arquivos” para adicionar outros sem perder os já escolhidos.</div>{(dados.arquivos||[]).map((a,i)=><div className="sinistro-arquivo" key={(a.chave||a.nome)+i}><span>📎</span><span className="grow">{a.nome}</span><button type="button" className="btn btn-g btn-sm" onClick={()=>removerComplementoArquivo(doc.id,i)}>Remover</button></div>)}<div style={{marginTop:8}}><label>Observação (opcional)</label><textarea rows="2" value={dados.observacao||''} onChange={e=>setComplementos(prev=>({...prev,[doc.id]:{...(prev[doc.id]||{}),observacao:e.target.value}}))}/></div><button className="btn btn-p" style={{width:'100%',marginTop:8}} disabled={enviandoDocumentoId===doc.id} onClick={()=>enviarComplemento(doc)}>{enviandoDocumentoId===doc.id?'Enviando...':(chave==='REJEITADO'?'Reenviar documento':'Enviar documento')}</button></div>}{chave==='ENVIADO'&&<div className="aviso-box" style={{marginTop:8}}>Documento recebido e aguardando conferência da Logística.</div>}</div>})}</div>}
      <div className="card" style={{marginTop:10}}><h3>Documentos e evidências do registro inicial</h3>{(registroAberto.documentos||[]).length?<GaleriaArquivosSinistro arquivos={registroAberto.documentos}/>:<div className="muted" style={{marginTop:8}}>Nenhum arquivo no envio inicial.</div>}</div>
      <div className="card" style={{marginTop:10}}><h3>Histórico</h3>{(registroAberto.historico||[]).length?(registroAberto.historico||[]).map(h=>{const p=historicoSinistroApresentacao(h);return <div className="linha-item" key={h.id}><span><b>{p.acao}</b><span className="muted" style={{display:'block'}}>{dataHoraBRSinistro(h.dataHora)} · {h.usuario||h.perfil}</span>{p.observacao&&<span style={{display:'block',marginTop:3,whiteSpace:'pre-wrap'}}>{p.observacao}</span>}</span></div>}):<div className="muted" style={{marginTop:8}}>Sem movimentações adicionais.</div>}</div>
    </Modal>}
  </React.Fragment>;
}


/* ================= AGENDAMENTOS: COMPONENTES ================= */
const AG_STATUS_LABEL={AGENDADO:'Agendado',AGUARDANDO_RETIRADA:'Aguardando retirada',EM_USO:'Em uso',PENDENTE_FINALIZACAO:'Pendente finalização',DEVOLUCAO_ATRASADA:'Devolução atrasada',BLOQUEADO_NC:'Bloqueado por NC',PENDENTE_ANALISE:'Pendente análise',FINALIZADO:'Finalizado',CANCELADO:'Cancelado'};
const fmtDataHora=v=>v?new Date(v).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):'—';
function AgendaStatus({status}){return <span className={'agenda-status '+status}>{AG_STATUS_LABEL[status]||status}</span>}
const AGENDA_CORES=[
  {b:'#1F7A55',f:'#E7F4ED',t:'#154C38'},
  {b:'#376FA6',f:'#EAF2FA',t:'#244E78'},
  {b:'#7A56A1',f:'#F1EBF7',t:'#51386E'},
  {b:'#C06A2B',f:'#FAEEE5',t:'#7D421A'},
  {b:'#A54657',f:'#F8E9EC',t:'#6F2D3A'},
  {b:'#547A27',f:'#EEF5E6',t:'#38521B'},
  {b:'#287C83',f:'#E7F4F5',t:'#1C555A'},
  {b:'#9B7622',f:'#F7F0DE',t:'#684F16'}
];
function corAgendaVeiculo(placa){
  const chave=String(placa||'SEM_PLACA').toUpperCase();
  let hash=0;for(let i=0;i<chave.length;i++)hash=((hash*31)+chave.charCodeAt(i))>>>0;
  return AGENDA_CORES[hash%AGENDA_CORES.length];
}
function CalendarioAgenda({mes,eventos,onAbrir,onSelecionarDia,diaSelecionado=null}){
  const ano=mes.getFullYear(),m=mes.getMonth(),primeiro=new Date(ano,m,1),offset=(primeiro.getDay()+6)%7,inicio=new Date(ano,m,1-offset);
  const isoLocal=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const isoSelecionado=diaSelecionado?isoLocal(diaSelecionado):'';
  const dias=[];for(let i=0;i<42;i++){const d=new Date(inicio);d.setDate(inicio.getDate()+i);const iso=isoLocal(d);dias.push({d,iso,eventos:eventos.filter(e=>String(e.saidaPrevista).slice(0,10)===iso)});}
  return <div className="agenda-cal">{['SEG','TER','QUA','QUI','SEX','SÁB','DOM'].map(x=><div className="agenda-semana" key={x}>{x}</div>)}{dias.map(({d,iso,eventos:ev})=><div className={'agenda-dia'+(d.getMonth()!==m?' off':'')+(iso===isoSelecionado?' selecionado':'')} key={iso} role={onSelecionarDia?'button':undefined} onClick={()=>onSelecionarDia&&onSelecionarDia(new Date(d))}><b>{d.getDate()}</b>{ev.slice(0,3).map(e=>{const c=corAgendaVeiculo(e.placa);return <button className="agenda-evento" style={{borderLeftColor:c.b,background:c.f,color:c.t}} key={e.id} onClick={clique=>{clique.stopPropagation();onAbrir(e)}}><b>{fmtDataHora(e.saidaPrevista).slice(-5)} · {e.placa||'Veículo'}</b><br/>{e.destino}</button>})}{ev.length>3&&<div className="muted">+{ev.length-3}</div>}</div>)}</div>
}
function FormAgendamento({base,item,onClose,onSalvo,toast,admin=false,dataInicial=null}){
  const agora=new Date(),pad=n=>String(n).padStart(2,'0'),local=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const dataSelecionada=(!item&&dataInicial instanceof Date&&Number.isFinite(dataInicial.getTime()))?new Date(dataInicial.getFullYear(),dataInicial.getMonth(),dataInicial.getDate(),agora.getHours(),agora.getMinutes()):agora;
  const dataBase=dataSelecionada<agora?agora:dataSelecionada;
  const retorno=new Date(dataBase.getTime()+2*3600000);

      </div>}
  </React.Fragment>;
  const monitorStatus=['AGUARDANDO_RETIRADA','EM_USO','DEVOLUCAO_ATRASADA','PENDENTE_FINALIZACAO','FINALIZADO'];
  const monitorMatch=(a,s)=>s==='AGUARDANDO_RETIRADA'?['AGENDADO','AGUARDANDO_RETIRADA'].includes(a.status):a.status===s;
  const monitorLista=base.agendamentos.filter(a=>monitorMatch(a,monitorFiltro));
  return <>
    <div className="subtabs">{podeAgenda&&<button className={'subtab'+(sub==='agenda'?' on':'')} onClick={()=>setSub('agenda')}>Agenda geral</button>}{podeMonitor&&<button className={'subtab'+(sub==='monitor'?' on':'')} onClick={()=>setSub('monitor')}>Monitoramento e gestão</button>}{podeRel&&<button className={'subtab'+(sub==='relatorio'?' on':'')} onClick={()=>setSub('relatorio')}>Relatório</button>}{podeParam&&<button className={'subtab'+(sub==='parametros'?' on':'')} onClick={()=>setSub('parametros')}>Parâmetros</button>}</div>
    {carregando?<div className="card muted">Carregando agendamentos...</div>:sub==='agenda'?<ConteudoAgendaGeral/>:sub==='monitor'?<><div className="agenda-kpis">{monitorStatus.map(s=>{const total=base.agendamentos.filter(a=>monitorMatch(a,s)).length;return <button type="button" className="agenda-kpi" key={s} onClick={()=>setMonitorFiltro(s)} style={{textAlign:'left',outline:monitorFiltro===s?'2px solid var(--folha)':'none',cursor:'pointer'}}><b>{total}</b><span>{AG_STATUS_LABEL[s]}</span></button>})}</div><div className="card">{monitorLista.length===0?<div className="muted">Nenhum agendamento neste status.</div>:monitorLista.map(a=><div className="agenda-lista-item row" key={a.id}><div className="grow"><b>{a.placa} · {a.origem} → {a.destino}</b><div className="muted">{a.motorista} · Saída prevista: {fmtDataHora(a.saidaPrevista)}</div><div className="muted">Devolução prevista: {fmtDataHora(a.retornoPrevisto)}{a.retornoReal?<> · Devolução real: {fmtDataHora(a.retornoReal)}</>:a.status==='DEVOLUCAO_ATRASADA'?<span style={{color:'var(--erro)',fontWeight:700}}> · Atrasada</span>:null}</div></div><AgendaStatus status={a.status}/><button className="btn btn-g btn-sm" onClick={()=>setDetalhe(a)}>Abrir</button></div>)}</div></>:sub==='relatorio'?<><div className="row"><div className="grow"><h2>Relatório de agendamentos</h2></div><button className="btn btn-p" onClick={exportar}>Exportar Excel</button></div><div className="card"><div className="form-grid"><div><label>Período de</label><input type="date" value={fDataIniRel} onChange={e=>setFDataIniRel(e.target.value)}/></div><div><label>Até</label><input type="date" value={fDataFimRel} onChange={e=>setFDataFimRel(e.target.value)}/></div><div><label>Veículo</label><select value={fPlacaRel} onChange={e=>setFPlacaRel(e.target.value)}><option value="TODAS">Todas as placas</option>{placasRel.map(p=><option key={p} value={p}>{p}</option>)}</select></div><div><label>Status</label><select value={fStatus} onChange={e=>setFStatus(e.target.value)}><option value="TODOS">Todos os status</option>{Object.keys(AG_STATUS_LABEL).map(s=><option key={s} value={s}>{AG_STATUS_LABEL[s]}</option>)}</select></div></div><div style={{overflowX:'auto',marginTop:12}}><table><thead><tr><th>Código</th><th>Veículo</th><th>Usuário que agendou</th><th>Motorista</th><th>Trajeto</th><th>Previsto</th><th>Real</th><th>KM</th><th>Status</th></tr></thead><tbody>{filtrados.map(a=><tr key={a.id}><td>{a.codigo}</td><td>{a.placa}</td><td>{a.solicitante||'—'}</td><td>{a.motorista}</td><td>{a.origem} → {a.destino}</td><td>{fmtDataHora(a.saidaPrevista)}<br/>{fmtDataHora(a.retornoPrevisto)}</td><td>{fmtDataHora(a.saidaReal)}<br/>{fmtDataHora(a.retornoReal)}</td><td>{a.kmInicial||'—'} → {a.kmFinal||'—'}</td><td><AgendaStatus status={a.status}/></td></tr>)}</tbody></table></div></div></>:<><div className="row"><div className="grow"><h2>Parâmetros de agendamentos</h2><div className="muted">Configurações lidas da lista Agendamentos_Parametros.</div></div><button className="btn btn-p" disabled={salvandoParam} onClick={salvarParametros}>{salvandoParam?'Salvando...':'Salvar parâmetros'}</button></div><div className="card"><div className="form-grid"><div><label>Dias permitidos para frente</label><input type="number" value={paramForm.diasPermitidosFrente??''} onChange={e=>alterarParam('diasPermitidosFrente',Number(e.target.value))}/></div><div><label>Antecedência mínima para criar/agendar (horas)</label><input type="number" value={paramForm.antecedenciaMinimaHoras??''} onChange={e=>alterarParam('antecedenciaMinimaHoras',Number(e.target.value))}/></div><div><label>Duração máxima (horas)</label><input type="number" value={paramForm.duracaoMaximaHoras??''} onChange={e=>alterarParam('duracaoMaximaHoras',Number(e.target.value))}/></div><div><label>Intervalo entre reservas (minutos)</label><input type="number" value={paramForm.intervaloReservasMinutos??''} onChange={e=>alterarParam('intervaloReservasMinutos',Number(e.target.value))}/></div><div><label>Hora inicial permitida</label><input type="time" value={paramForm.horaInicialPermitida||'00:00'} onChange={e=>alterarParam('horaInicialPermitida',e.target.value)}/></div><div><label>Hora final permitida</label><input type="time" value={paramForm.horaFinalPermitida||'23:59'} onChange={e=>alterarParam('horaFinalPermitida',e.target.value)}/></div><div><label>Permite sábado</label><SimNao campo="permiteSabado"/></div><div><label>Permite domingo</label><SimNao campo="permiteDomingo"/></div><div><label>Permite feriado</label><SimNao campo="permiteFeriado"/></div><div><label>Confirmação automática</label><SimNao campo="confirmacaoAutomatica"/></div><div><label>Periodicidade do checklist</label><select value={paramForm.checklistPeriodicidade||'SEMANAL'} onChange={e=>alterarParam('checklistPeriodicidade',e.target.value)}><option>DIARIO</option><option>SEMANAL</option><option>A_CADA_RETIRADA</option></select></div><div><label>Abre checklist na NC</label><SimNao campo="abreChecklistNaNC"/></div><div><label>Resposta impeditiva bloqueia</label><SimNao campo="respostaImpeditivaBloqueia"/></div><div><label>Código checklist Frota Leve</label><input value={paramForm.codigoChecklistFrotaLeve||''} onChange={e=>alterarParam('codigoChecklistFrotaLeve',e.target.value)}/></div><div><label>Libera retirada antes da saída (minutos)</label><input type="number" value={paramForm.janelaRetiradaMinutos??''} onChange={e=>alterarParam('janelaRetiradaMinutos',Number(e.target.value))}/></div><div><label>Tolerância devolução (minutos)</label><input type="number" value={paramForm.toleranciaDevolucaoMinutos??''} onChange={e=>alterarParam('toleranciaDevolucaoMinutos',Number(e.target.value))}/></div><div><label>Permite finalizar antes</label><SimNao campo="permiteFinalizarAnterior"/></div><div><label>Libera no retorno real</label><SimNao campo="liberaNoRetornoReal"/></div></div></div></>}

/* ================= SHELL MOTORISTA ================= */
function MotoristaApp({st, setSt, user, onSair, toast}){
  const dados = usarDadosMensais(st);
  const [carregandoCargas,setCarregandoCargas]=useState(!CONFIG.MODO_DEMONSTRACAO);
  const [carregandoPremiacao,setCarregandoPremiacao]=useState(!CONFIG.MODO_DEMONSTRACAO);
  useEffect(()=>{
    if(CONFIG.MODO_DEMONSTRACAO) return;
    let ativo=true;
    Promise.allSettled([
      ApiService.obterCargas(),
      ApiService.obterPremiacao(),
      ApiService.obterMinhasContestacoes()
    ]).then(([cargasResult,premiacaoResult,contestacoesResult])=>{
      if(!ativo) return;
      setSt(s=>{
        const proximo={...s};
        if(cargasResult.status==='fulfilled'){
          const r=cargasResult.value;
          proximo.cargas=Array.isArray(r.cargas)?r.cargas:[];
        }
        if(premiacaoResult.status==='fulfilled'){
          const p=premiacaoResult.value;
          proximo.metas=Array.isArray(p.metas)?p.metas:s.metas;
          proximo.descontos=Array.isArray(p.descontos)?p.descontos:s.descontos;
          proximo.apuracoes=Array.isArray(p.apuracoes)?p.apuracoes:[];
        }
        if(contestacoesResult.status==='fulfilled'){
          const ct=contestacoesResult.value;
          proximo.contestacoes=Array.isArray(ct.contestacoes)?ct.contestacoes:[];
        }
        return proximo;
      });
      const falhasEssenciais=[];
      if(cargasResult.status==='rejected') falhasEssenciais.push('cargas');
      if(premiacaoResult.status==='rejected') falhasEssenciais.push('premiação');
      if(falhasEssenciais.length){
        toast('Não foi possível carregar: '+falhasEssenciais.join(' e ')+'. Tente novamente.');
      }
      if(contestacoesResult.status==='rejected'){
        console.warn('Contestações temporariamente indisponíveis:',contestacoesResult.reason);
      }
    }).finally(()=>{
      if(ativo){setCarregandoCargas(false);setCarregandoPremiacao(false);}
    });
    return()=>{ativo=false};
  },[user.id]);
  const abas = [
    user.perms.cargas && {id:'cargas', ic:'🚛', nome:'Cargas'},
    user.perms.premiacao && {id:'prem', ic:'🏆', nome:'Premiação'},
    user.perms.checklist && {id:'check', ic:'📋', nome:'Check list'},
    user.perms.sinistros && {id:'sinistro', ic:'🚨', nome:'Sinistro'},
    user.perms.agendamentos && {id:'agendamento', ic:'📅', nome:'Agendamento'},
  ].filter(Boolean);
  const [aba,setAba]=useState(abas.length?abas[0].id:'');
  const [inicioChecklistAgendamento,setInicioChecklistAgendamento]=useState(null);
  const abrirChecklistDoAgendamento=dados=>{setInicioChecklistAgendamento(dados);setAba('check');};
  const placa = Object.values(st.frota).find(f=>f.motorista===user.nome && f.frota!=='leve');
  const recuperarAplicativo = async ()=>{
    const ok = window.confirm(
      'Usar a recuperação deste aparelho?\n\n'+
      'Rascunhos e registros incompletos serão apagados. Checklists válidos aguardando internet serão preservados.'
    );
    if(!ok) return;
    try{
      await FilaEnvio.sanear(user.login);
      await IDB.apagarRascunho('ck_'+String(user.login||'').toLowerCase()+'_'+HOJE).catch(()=>{});
      ApiService.sair();
      const url = new URL(window.location.href);
      url.searchParams.set('atualizar', CONFIG.VERSAO+'-'+Date.now());
      window.location.replace(url.toString());
    }catch(e){
      toast('Não foi possível recuperar automaticamente. Avise a logística.');
    }
  };
  return (
    <div className={'mshell'+(aba==='agendamento'?' mshell-agendamento':'')}>
      <div className="mtop row">
        <div className="grow">
          <div className="nome">{primeiroNome(user.nome)}</div>
          <div className="sub">{placa ? placa.tipo : 'Motorista'}</div>
        </div>
        {placa && <span className="chip-placa">{placa.placa}</span>}
        <button className="btn btn-sm" style={{color:'rgba(255,255,255,.8)'}} onClick={onSair}>Sair</button>
      </div>
      <div className="mbody">
        {abas.length===0 && <div className="card muted">Seu usuário está sem módulos liberados. Fale com a logística.</div>}
        {aba==='cargas' && carregandoCargas && <div className="card muted">Carregando cargas do SharePoint...</div>}
        {aba==='cargas' && !carregandoCargas && <TelaCargas st={st} setSt={setSt} user={user} dados={dados} toast={toast}/>}
        {aba==='prem' && carregandoPremiacao && <div className="card muted">Carregando metas, apuração e descontos do SharePoint...</div>}
        {aba==='prem' && !carregandoPremiacao && <TelaPremiacao st={st} user={user} dados={dados}/>}
        {aba==='check' && <TelaChecklist st={st} setSt={setSt} user={user} toast={toast} inicioAgendamento={inicioChecklistAgendamento} onInicioConsumido={()=>{setInicioChecklistAgendamento(null);setAba('agendamento')}} onConcluidoAgendamento={()=>{setInicioChecklistAgendamento(null);setAba('agendamento')}}/>}
        {aba==='sinistro' && <TelaSinistro user={user} toast={toast}/>}
        {aba==='agendamento' && <TelaAgendamento user={user} toast={toast} onAbrirChecklist={abrirChecklistDoAgendamento}/>}
        <div className="card" style={{padding:12, marginTop:2}}>
          <div className="row">
            <div className="grow">
              <div style={{fontWeight:700, fontSize:13}}>Problema neste aparelho?</div>
              <div className="muted">Versão {CONFIG.VERSAO}</div>
            </div>
            <button className="btn btn-g btn-sm" onClick={recuperarAplicativo}>Limpar dados deste aparelho</button>
          </div>
        </div>
      </div>
      <nav className="mtabs">
        {abas.map(a=>
          <button key={a.id} className={'mtab'+(aba===a.id?' on':'')} onClick={()=>setAba(a.id)}>
            <span className="ic">{a.ic}</span>{a.nome}
          </button>)}
      </nav>
    </div>
  );
}

/* Fila mantida fora da tela: continua enquanto o usuário navega dentro do aplicativo. */
const FilaApuracaoRH=(()=>{
  let estado={rodando:false,total:0,atual:0,motorista:'',falhas:[],concluidos:0,finalizadaEm:''};
  const ouvintes=new Set();
  const publicar=()=>ouvintes.forEach(fn=>fn({...estado}));
  const confirmarGravacao=async(motoristaId,competencias)=>{
    const r=await ApiService.obterApuracoesSalvas('',motoristaId,{somenteSalvas:true});
    const existentes=new Set((r.apuracoes||[]).map(a=>String(a.competencia||'')));
    return competencias.every(c=>existentes.has(c));
  };
  const iniciar=async({motoristas,meses})=>{
    if(estado.rodando||!motoristas.length)return false;
    estado={rodando:true,total:motoristas.length,atual:0,motorista:'',falhas:[],concluidos:0,finalizadaEm:''};
    publicar();
    const competencias=meses.map(m=>m.slice(3)+'-'+m.slice(0,2));
    for(let i=0;i<motoristas.length;i++){
      const u=motoristas[i];
      estado={...estado,atual:i+1,motorista:u.nome};publicar();
      try{
        await executarComRetentativaGraph(async()=>{
          const r=await ApiService.obterPremiacaoMotorista(u.nome,competencias);
          const conjunto=new Set(competencias);
          const apuracoes=(r.apuracoes||[]).filter(a=>conjunto.has(String(a.competencia||'')));
          if(apuracoes.length!==competencias.length){
            const recebidas=new Set(apuracoes.map(a=>String(a.competencia||'')));
            const faltantes=competencias.filter(c=>!recebidas.has(c));
            throw new Error('A API não calculou as competências: '+faltantes.join(', '));
          }
          await ApiService.salvarApuracoes(idUsuario(u),apuracoes,'RH_QUADRIMESTRE');
        });
        estado={...estado,concluidos:estado.concluidos+1};publicar();
      }catch(e){
        let gravado=false;
        if(/failed to fetch|network|fetch/i.test(String(e?.message||e))){
          try{gravado=await confirmarGravacao(idUsuario(u),competencias)}catch(_){}
        }
        if(gravado)estado={...estado,concluidos:estado.concluidos+1};
        else estado={...estado,falhas:[...estado.falhas,`${u.nome}: ${e.message}`]};
        publicar();
      }
      if(i<motoristas.length-1)await aguardar(1800);
    }
    estado={...estado,rodando:false,motorista:'',finalizadaEm:agoraISO()};publicar();
    return true;
  };
  return{
    iniciar,
    obter:()=>({...estado}),
    assinar(fn){ouvintes.add(fn);fn({...estado});return()=>ouvintes.delete(fn)}
  };
})();

/* ================= ADM: PAINEL ================= */
function PainelRH({st,dados,user}){
  const anoAtual=String(new Date().getFullYear());
  const [ano,setAno]=useState(anoAtual);
  const [quadrimestre,setQuadrimestre]=useState('2');
  const [nome,setNome]=useState('');
  const [aberto,setAberto]=useState('');
  const [usuariosRH,setUsuariosRH]=useState([]);
  const [vinculosRH,setVinculosRH]=useState([]);
  const [apuracoesRH,setApuracoesRH]=useState({});
  const [carregandoRH,setCarregandoRH]=useState(false);
  const [erroRH,setErroRH]=useState('');
  const [progressoRH,setProgressoRH]=useState('');
  const [sucessoRH,setSucessoRH]=useState('');
  const [modoAtualizacao,setModoAtualizacao]=useState('PENDENTES');
  const [selecionados,setSelecionados]=useState([]);
  const [filaRH,setFilaRH]=useState(FilaApuracaoRH.obter());
  const [auditoriasRH,setAuditoriasRH]=useState({});
  const mesesPorQuad={'1':['01','02','03','04'],'2':['05','06','07','08'],'3':['09','10','11','12']};
  const meses=(mesesPorQuad[quadrimestre]||mesesPorQuad['1']).map(m=>m+'/'+ano);
  const competenciaAtual=new Date().toISOString().slice(0,7);
  const mesesProcessaveis=meses.filter(m=>(m.slice(3)+'-'+m.slice(0,2))<=competenciaAtual);
  const periodoAindaNaoIniciado=mesesProcessaveis.length===0;
  const inicioPeriodo=`${ano}-${mesesPorQuad[quadrimestre][0]}-01`;
  const ultimoMes=mesesPorQuad[quadrimestre][3];
  const fimPeriodo=new Date(Number(ano),Number(ultimoMes),0).toISOString().slice(0,10);
  const motoristasPeriodo=usuariosRH
    .filter(u=>usuarioValidoPremiacaoPeriodo(u,vinculosRH,inicioPeriodo,fimPeriodo))
    .sort((a,b)=>String(a.nome).localeCompare(String(b.nome),'pt-BR'));
  const motoristas=motoristasPeriodo
    .filter(u=>String(u.nome||'').toLocaleLowerCase('pt-BR').includes(nome.toLocaleLowerCase('pt-BR')))
    ;
  useEffect(()=>{
    if(CONFIG.MODO_DEMONSTRACAO){
      setUsuariosRH(st.usuarios||[]);
      setVinculosRH(st.vinculos||[]);
      return;
    }
    let ativo=true;
    setCarregandoRH(true);
    setErroRH('');
    ApiService.admCadastros()
      .then(r=>{
        if(!ativo) return;
        setUsuariosRH(Array.isArray(r.usuarios)?r.usuarios:[]);
        setVinculosRH(Array.isArray(r.vinculos)?r.vinculos:[]);
      })
      .catch(e=>{
        if(!ativo) return;
        setUsuariosRH([]);
        setErroRH('Não foi possível carregar os motoristas: '+e.message);
      })
      .finally(()=>{if(ativo)setCarregandoRH(false)});
    return()=>{ativo=false};
  },[]);
  useEffect(()=>{
    if(CONFIG.MODO_DEMONSTRACAO) return;
    let ativo=true;
    setCarregandoRH(true); setErroRH('');
    // Ao entrar ou trocar de quadrimestre, carrega somente o que já foi salvo.
    // A conferência completa das cargas fica restrita à atualização solicitada
    // pelo usuário, evitando consultas pesadas e repetidas ao Graph.
    ApiService.obterApuracoesSalvas('','',{somenteSalvas:true})
      .then(r=>{
        if(!ativo)return;
        const porMotorista={};
        (r.apuracoes||[]).forEach(item=>{
          const chave=String(item.motoristaId||'');
          porMotorista[chave]=porMotorista[chave]||[];
          porMotorista[chave].push(apuracaoSalvaParaTela(item));
        });
        setApuracoesRH(porMotorista);
      })
      .catch(e=>{if(ativo)setErroRH('Não foi possível carregar as apurações salvas: '+e.message)})
      .finally(()=>{if(ativo)setCarregandoRH(false)});
    return()=>{ativo=false};
  },[ano,quadrimestre]);
  useEffect(()=>FilaApuracaoRH.assinar(setFilaRH),[]);
  useEffect(()=>{
    if(!filaRH.rodando&&filaRH.finalizadaEm){
      setCarregandoRH(true);
      ApiService.obterApuracoesSalvas('','',{somenteSalvas:true}).then(atualizadas=>{
        const porMotorista={};
        (atualizadas.apuracoes||[]).forEach(item=>{
          const chave=String(item.motoristaId||'');
          const u=usuariosRH.find(x=>idUsuario(x)===chave);
          porMotorista[chave]=porMotorista[chave]||[];
          porMotorista[chave].push(apuracaoSalvaParaTela(item,u?.nome||''));
        });
        setApuracoesRH(porMotorista);
        if(filaRH.falhas.length)setErroRH(`${filaRH.falhas.length} motorista(s) não puderam ser atualizados: ${filaRH.falhas.join(' | ')}`);
        else setErroRH('');
      }).catch(e=>setErroRH('A atualização terminou, mas não foi possível recarregar a tabela: '+e.message))
        .finally(()=>setCarregandoRH(false));
    }
  },[filaRH.finalizadaEm]);
  const recalcularQuadrimestre=async()=>{
    if(filaRH.rodando||periodoBloqueado)return;
    if(periodoAindaNaoIniciado){
      setErroRH(`O ${quadrimestre}º quadrimestre de ${ano} ainda não começou. Não há competências disponíveis para atualizar.`);
      return;
    }
    const competencias=mesesProcessaveis.map(m=>m.slice(3)+'-'+m.slice(0,2));
    const pendentes=motoristas.filter(u=>{
      const itens=(apuracoesRH[idUsuario(u)]||[]).filter(a=>competencias.includes(String(a.competencia||'')));
      return itens.length<competencias.length||itens.some(a=>
        a.desatualizada===true ||
        ['PENDENTE','ERRO'].includes(String(a.status||'').toUpperCase())
      );
    });
    const escolhidos=modoAtualizacao==='TODOS'?motoristas:
      modoAtualizacao==='PENDENTES'?pendentes:
      motoristas.filter(u=>selecionados.includes(idUsuario(u)));
    if(!escolhidos.length){
      setErroRH(modoAtualizacao==='SELECIONADOS'?'Selecione pelo menos um motorista.':'Não há motoristas pendentes ou com erro neste quadrimestre.');
      return;
    }
    setErroRH('');
    await FilaApuracaoRH.iniciar({motoristas:escolhidos,meses:mesesProcessaveis});
  };
  /*
   * A conferência é mensal. Um motorista só gera uma competência esperada
   * quando está configurado para a premiação e possui vínculo sobreposto ao mês.
   * Na ausência total de histórico de vínculo para o usuário, preserva-se a
   * compatibilidade atual: usuário ativo é aplicável aos quatro meses.
   */
  const competenciasEsperadas=motoristasPeriodo.flatMap(u=>mesesProcessaveis
    .map(m=>{
      const competencia=m.slice(3)+'-'+m.slice(0,2);
      const [anoMes,mesNumero]=competencia.split('-').map(Number);
      const inicioMes=`${anoMes}-${String(mesNumero).padStart(2,'0')}-01`;
