const ROTULOS_AREAS={PAINEL:'Painel',IMPORTACAO:'Importação',CONTESTACOES:'Contestações',RH_FECHAMENTO:'RH / Fechamento',PREMIACAO:'Premiação',CHECKLIST:'Check list',SINISTROS:'Sinistros',AGENDAMENTOS:'Agendamentos',CADASTROS:'Cadastros'};
const normalizarCodigoAcesso=codigo=>String(codigo||'')
  .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .trim().toUpperCase().replace(/[^A-Z0-9]+/g,'_')
  .replace(/^_+|_+$/g,'');
const canonCodigoAcesso=(codigo)=>{
  const alvo=normalizarCodigoAcesso(codigo);
  return [...Object.keys(AREAS_E_SUBTELAS),...Object.values(AREAS_E_SUBTELAS).flat().map(([c])=>c)]
    .find(c=>normalizarCodigoAcesso(c)===alvo)||String(codigo||'').trim().toUpperCase();
};
const canonListaAcesso=(lista)=>[...new Set((lista||[]).map(canonCodigoAcesso).filter(Boolean))];

/* ================= ADM: CADASTROS (usuários + frota + perfis) ================= */
function AdmCadastros({st, setSt, toast, user}){
  const [sub,setSub]=useState(pode(user,'cadastro.usuarios')?'usuarios':pode(user,'cadastro.tipos_veiculo')?'tipos':pode(user,'cadastro.veiculos')?'frota':pode(user,'cadastro.vinculos')?'vinculos':'perfis');
  const [edit,setEdit]=useState(null);
  const [editTipo,setEditTipo]=useState(null);
  const [editPlaca,setEditPlaca]=useState(null);
  const [editVinculo,setEditVinculo]=useState(null);
  const [editPerfil,setEditPerfil]=useState(null);
  const [salvandoPerfil,setSalvandoPerfil]=useState(false);
  const [salvandoUsuario,setSalvandoUsuario]=useState(false);
  const [senhaVisivel,setSenhaVisivel]=useState(false);
  const [cad,setCad]=useState({usuarios:[],tiposVeiculo:[],veiculos:[],vinculos:[],perfis:[]});
  const [carregandoCad,setCarregandoCad]=useState(true);
  const [erroCad,setErroCad]=useState('');
  const [fUsuario,setFUsuario]=useState({nome:'',perfil:'',ordem:'nome-asc'});
  const [fVeiculo,setFVeiculo]=useState({placa:'',frota:'',tipo:'',ordem:'placa-asc'});
  const [fVinculo,setFVinculo]=useState({placa:'',usuario:'',status:'',ordem:'usuario-asc'});
  const perfilSelecionado=edit?cad.perfis.find(p=>String(p.itemId)===String(edit.perfilAcessoId||'')):null;
  const permiteModulosUsuario=perfilSelecionado?.permiteModulosApp===true;
  const proximoUsuarioId=()=>{const maior=cad.usuarios.reduce((m,u)=>{const x=String(u.usuarioId||'').match(/^USU-(\d+)$/i);return x?Math.max(m,Number(x[1])):m;},0);return 'USU-'+String(maior+1).padStart(3,'0');};
  const carregar=async()=>{
    setCarregandoCad(true);setErroCad('');
    try{
      const r=await ApiService.admCadastros();
      setCad({usuarios:r.usuarios||[],tiposVeiculo:r.tiposVeiculo||[],veiculos:r.veiculos||[],vinculos:r.vinculos||[],perfis:r.perfis||[]});
    }catch(e){
      const msg='Erro ao carregar cadastros: '+e.message;
      setErroCad(msg);toast(msg);
    }finally{setCarregandoCad(false);}
  };
  useEffect(()=>{carregar();},[]);
  const salvarUser=async()=>{
    if(salvandoUsuario||!edit)return;
    const login=String(edit.login||'').trim().toLowerCase(), usuarioId=String(edit.usuarioId||'').trim().toUpperCase();
    if(!String(edit.nome||'').trim()||!login||!usuarioId){ toast('Nome, UsuarioID e usuário são obrigatórios.'); return; }
    if(!edit.perfilAcessoId){toast('Selecione um perfil de acesso cadastrado.');return;}
    const perfilDoUsuario=cad.perfis.find(p=>String(p.itemId)===String(edit.perfilAcessoId));
    const modulosPermitidos=perfilDoUsuario?.permiteModulosApp===true;
    if(cad.usuarios.some(u=>u.itemId!==edit.itemId&&String(u.login||'').trim().toLowerCase()===login)){toast('O usuário '+login+' já está cadastrado.');return;}
    if(cad.usuarios.some(u=>u.itemId!==edit.itemId&&String(u.usuarioId||'').trim().toUpperCase()===usuarioId)){toast('O UsuarioID '+usuarioId+' já está cadastrado.');return;}
    const novaSenha=String(edit.novaSenha||'');
    if(!edit.itemId&&!novaSenha){toast('Digite ou gere a senha inicial.');return;}
    if(novaSenha&&edit.perfil==='MOTORISTA'&&!/^\d{6}$/.test(novaSenha)){toast('Motorista deve usar PIN com exatamente 6 números.');return;}
    if(novaSenha&&edit.perfil!=='MOTORISTA'&&novaSenha.length<8){toast('Administrador e visualizador devem usar ao menos 8 caracteres.');return;}
    const dadosUsuario={...edit,login,usuarioId,
      acessoCargas:modulosPermitidos&&edit.acessoCargas===true,
      acessoPremiacao:modulosPermitidos&&edit.acessoPremiacao===true,
      acessoChecklist:modulosPermitidos&&edit.acessoChecklist===true,
      acessoSinistros:modulosPermitidos&&edit.acessoSinistros===true,
      acessoAgendamentos:modulosPermitidos&&edit.acessoAgendamentos===true,
      acessoHistorico:modulosPermitidos&&edit.acessoChecklist===true
    };
    setSalvandoUsuario(true);
    try{
      const resposta=await ApiService.salvarUsuario(dadosUsuario);
      if(!resposta?.ok&&!resposta?.sucesso)throw new Error(resposta?.erro||'O SharePoint não confirmou o salvamento do usuário.');
      setEdit(null);
      await carregar();
      if(novaSenha)window.alert('Acesso salvo com sucesso.\n\nUsuário: '+login+'\nSenha temporária: '+novaSenha+'\n\nCopie agora: ela não poderá ser visualizada novamente.');
      else toast('Usuário salvo no SharePoint.');
    }catch(e){
      toast('Erro ao salvar usuário: '+(e?.message||String(e)));
    }finally{
      setSalvandoUsuario(false);
    }
  };
  const gerarSenha=()=>{
    if(edit.perfil==='MOTORISTA'){
      const n=crypto.getRandomValues(new Uint32Array(1))[0]%1000000;
      setEdit({...edit,novaSenha:String(n).padStart(6,'0')});
    }else{
      const chars='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#';
      const rnd=crypto.getRandomValues(new Uint8Array(12));
      setEdit({...edit,novaSenha:Array.from(rnd,b=>chars[b%chars.length]).join('')});
    }
    setSenhaVisivel(true);
  };
  const alterarStatusUsuario=async(u)=>{
    if(!window.confirm((u.ativo?'Inativar':'Reativar')+' o usuário '+u.nome+'?')) return;
    try{
      await ApiService.salvarUsuario({...u,ativo:!u.ativo});
      await carregar();
      toast('Usuário '+u.nome+' '+(u.ativo?'inativado':'reativado')+' com sucesso.');
    }catch(e){toast('Erro ao alterar status do usuário: '+e.message);}
  };
  const salvarPlaca=async()=>{
    const placa=String(editPlaca.placa||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
    if(!placa){toast('Informe a placa do veículo.');return;}
    if(!String(editPlaca.tipoModelo||'').trim()){toast('Selecione o tipo do veículo.');return;}
    const repetida=cad.veiculos.some(v=>v.itemId!==editPlaca.itemId&&String(v.placa||'').toUpperCase().replace(/[^A-Z0-9]/g,'')===placa);
    if(repetida){toast('A placa '+placa+' já está cadastrada.');return;}
    try{await ApiService.salvarVeiculo({...editPlaca,placa});setEditPlaca(null);await carregar();toast('Veículo salvo no SharePoint.');}catch(e){toast('Erro ao salvar veículo: '+e.message);}
  };
  const salvarTipo=async()=>{
    if(!String(editTipo.nome||'').trim()){toast('Informe o nome do tipo de veículo.');return;}
    try{await ApiService.salvarTipoVeiculo(editTipo);setEditTipo(null);await carregar();toast('Tipo de veículo salvo no SharePoint.');}
    catch(e){toast('Erro ao salvar tipo de veículo: '+e.message);}
  };
  const alterarStatusTipo=async(t)=>{
    if(!window.confirm((t.ativo?'Inativar':'Reativar')+' o tipo '+t.nome+'?'))return;
    try{await ApiService.salvarTipoVeiculo({...t,ativo:!t.ativo});await carregar();toast('Tipo de veículo atualizado.');}
    catch(e){toast('Erro ao alterar tipo de veículo: '+e.message);}
  };
  const alterarStatusPlaca=async(f)=>{
    const acao=f.ativo?'inativar':'reativar';
    if(!window.confirm((f.ativo?'Inativar':'Reativar')+' a placa '+f.placa+'?')) return;
    try{
      await ApiService.salvarVeiculo({...f,ativo:!f.ativo});
      await carregar();
      toast('Placa '+f.placa+' '+(f.ativo?'inativada':'reativada')+' com sucesso.');
    }catch(e){toast('Erro ao '+acao+' placa: '+e.message);}
  };
  const salvarVinculo=async()=>{const u=cad.usuarios.find(x=>x.itemId===editVinculo.usuarioItemId),v=cad.veiculos.find(x=>x.itemId===editVinculo.veiculoItemId);if(!u||!v){toast('Selecione usuário e veículo.');return;}try{await ApiService.salvarVinculo({...editVinculo,usuarioId:u.usuarioId,titulo:u.usuarioId+' - '+v.placa});setEditVinculo(null);await carregar();toast('Vínculo salvo no SharePoint.');}catch(e){toast('Erro ao salvar vínculo: '+e.message);}};
  const salvarPerfil=async(event)=>{
    event?.preventDefault?.();
    event?.stopPropagation?.();
    if(salvandoPerfil||!editPerfil)return;
    setSalvandoPerfil(true);
    try{
      if(!String(editPerfil.titulo||'').trim())throw new Error('Informe o nome do perfil.');
      const areasCanon=canonListaAcesso(editPerfil.areasAcesso);
      const subtelasCanon=canonListaAcesso(editPerfil.subtelasAcesso);
      const subtelasValidas=subtelasCanon.filter(c=>areasCanon.some(a=>(AREAS_E_SUBTELAS[a]||[]).some(([codigo])=>codigo===c)));
      const resposta=await ApiService.salvarPerfil({...editPerfil,titulo:String(editPerfil.titulo).toUpperCase(),areasAcesso:areasCanon,subtelasAcesso:subtelasValidas});
      if(!resposta?.ok&&!resposta?.sucesso)throw new Error(resposta?.erro||'O SharePoint não confirmou o salvamento do perfil.');
      await carregar();
      setEditPerfil(null);
      toast('Perfil salvo no SharePoint.');
    }catch(e){
      toast('Erro ao salvar perfil: '+(e?.message||String(e)));
    }finally{
      setSalvandoPerfil(false);
    }
  };
  const alternarArea=(area)=>{
    const marcada=(editPerfil.areasAcesso||[]).includes(area);
    const areas=marcada?(editPerfil.areasAcesso||[]).filter(a=>a!==area):[...(editPerfil.areasAcesso||[]),area];
    const codigos=(AREAS_E_SUBTELAS[area]||[]).map(([c])=>c);
    const subtelas=marcada?(editPerfil.subtelasAcesso||[]).filter(c=>!codigos.includes(c)):(editPerfil.subtelasAcesso||[]);
    setEditPerfil({...editPerfil,areasAcesso:areas,subtelasAcesso:subtelas});
  };
  const alternarSubtela=(codigo)=>setEditPerfil({...editPerfil,subtelasAcesso:(editPerfil.subtelasAcesso||[]).includes(codigo)?(editPerfil.subtelasAcesso||[]).filter(c=>c!==codigo):[...(editPerfil.subtelasAcesso||[]),codigo]});
  const podeSub=(codigo)=>pode(user,codigo);
  /* A edição da placa deve sempre exibir o cadastro central. O status ou a
     classificação da frota não podem apagar as opções do seletor; o valor
     antigo continua identificado separadamente como histórico. */
  const tiposAtivos=[...new Map(cad.tiposVeiculo
    .filter(t=>String(t.nome||'').trim())
    .map(t=>[chaveTipo(t.nome),t])
  ).values()]
    .sort((a,b)=>String(a.nome).localeCompare(String(b.nome),'pt-BR'));
  const compararTexto=(a,b)=>String(a||'').localeCompare(String(b||''),'pt-BR',{numeric:true,sensitivity:'base'});
  const usuariosFiltrados=cad.usuarios
    .filter(u=>String(u.nome||'').toLocaleLowerCase('pt-BR').includes(fUsuario.nome.toLocaleLowerCase('pt-BR')) && (!fUsuario.perfil||u.perfil===fUsuario.perfil))
    .sort((a,b)=>(fUsuario.ordem.endsWith('desc')?-1:1)*compararTexto(fUsuario.ordem.startsWith('perfil')?a.perfil:a.nome,fUsuario.ordem.startsWith('perfil')?b.perfil:b.nome));
  const veiculosFiltrados=cad.veiculos
    .filter(v=>String(v.placa||'').toUpperCase().includes(fVeiculo.placa.toUpperCase()) &&
      (!fVeiculo.frota||v.tipoFrota===fVeiculo.frota) &&
      (!fVeiculo.tipo||chaveTipo(v.tipoModelo)===chaveTipo(fVeiculo.tipo)))
    .sort((a,b)=>{
      const campo=fVeiculo.ordem.split('-')[0], dir=fVeiculo.ordem.endsWith('desc')?-1:1;
      const va=campo==='frota'?a.tipoFrota:campo==='tipo'?a.tipoModelo:a.placa;
      const vb=campo==='frota'?b.tipoFrota:campo==='tipo'?b.tipoModelo:b.placa;
      return dir*compararTexto(va,vb);
    });
  const statusVinculo=v=>v.dataFim?'Finalizado':v.ativo?'Ativo':'Inativo';
  const vinculosFiltrados=cad.vinculos
    .filter(v=>String(v.placa||'').toUpperCase().includes(fVinculo.placa.toUpperCase()) &&
      String(v.usuarioNome||'').toLocaleLowerCase('pt-BR').includes(fVinculo.usuario.toLocaleLowerCase('pt-BR')) &&
      (!fVinculo.status||statusVinculo(v)===fVinculo.status))
    .sort((a,b)=>{
      const campo=fVinculo.ordem.split('-')[0], dir=fVinculo.ordem.endsWith('desc')?-1:1;
      const va=campo==='placa'?a.placa:campo==='status'?statusVinculo(a):a.usuarioNome;
      const vb=campo==='placa'?b.placa:campo==='status'?statusVinculo(b):b.usuarioNome;
      return dir*compararTexto(va,vb);
    });
  return (
    <React.Fragment>
      <div className="row" style={{flexWrap:'wrap'}}>
        <h2 className="grow">Cadastros</h2>
        <div className="subtabs">
          {podeSub('cadastro.usuarios')&&<button className={'subtab'+(sub==='usuarios'?' on':'')} onClick={()=>setSub('usuarios')}>Usuários e acessos</button>}
          {podeSub('cadastro.tipos_veiculo')&&<button className={'subtab'+(sub==='tipos'?' on':'')} onClick={()=>setSub('tipos')}>Tipos de veículo</button>}
          {podeSub('cadastro.veiculos')&&<button className={'subtab'+(sub==='frota'?' on':'')} onClick={()=>setSub('frota')}>Veículos</button>}
          {podeSub('cadastro.vinculos')&&<button className={'subtab'+(sub==='vinculos'?' on':'')} onClick={()=>setSub('vinculos')}>Vínculos</button>}
          {podeSub('cadastro.perfis')&&<button className={'subtab'+(sub==='perfis'?' on':'')} onClick={()=>setSub('perfis')}>Perfis</button>}
        </div>
      </div>

      {erroCad&&<div className="aviso-box" style={{borderColor:'#b42318',color:'#b42318'}}>{erroCad}<div style={{marginTop:8}}><button className="btn btn-s btn-sm" onClick={carregar}>Tentar novamente</button></div></div>}
      {carregandoCad&&<div className="card"><div className="muted">Carregando cadastros do SharePoint...</div></div>}

      {sub==='usuarios' && podeSub('cadastro.usuarios') && !carregandoCad && !erroCad && <React.Fragment>
        <div><button className="btn btn-p" onClick={()=>{setSenhaVisivel(false);const p=cad.perfis.find(x=>x.titulo==='MOTORISTA');setEdit({nome:'',usuarioId:proximoUsuarioId(),login:'',telefone:'',perfil:p?.titulo||'',perfilAcessoId:p?.itemId||'',tipoFrotaAcesso:'FROTA PESADA',ativo:true,novaSenha:'',acessoCargas:false,acessoPremiacao:false,acessoChecklist:false,acessoSinistros:false,acessoAgendamentos:false,acessoHistorico:false})}}>+ Novo usuário</button></div>
        <div className="filtros-cadastro">
          <div><label>Filtrar por nome</label><input value={fUsuario.nome} onChange={e=>setFUsuario({...fUsuario,nome:e.target.value})} placeholder="Digite o nome"/></div>
          <div><label>Perfil</label><select value={fUsuario.perfil} onChange={e=>setFUsuario({...fUsuario,perfil:e.target.value})}><option value="">Todos os perfis</option>{[...new Set(cad.usuarios.map(u=>u.perfil).filter(Boolean))].sort(compararTexto).map(p=><option key={p}>{p}</option>)}</select></div>
          <div><label>Ordenar</label><select value={fUsuario.ordem} onChange={e=>setFUsuario({...fUsuario,ordem:e.target.value})}><option value="nome-asc">Nome A–Z</option><option value="nome-desc">Nome Z–A</option><option value="perfil-asc">Perfil A–Z</option><option value="perfil-desc">Perfil Z–A</option></select></div>
        </div>
        <div className="card" style={{overflowX:'auto'}}>
          <table>
            <thead><tr><th>Nome</th><th>UsuarioID</th><th>Usuário</th><th>Perfil</th><th>Senha</th><th>Status</th><th>Ações</th></tr></thead>
            <tbody>{usuariosFiltrados.map(u=>
              <tr key={u.itemId}>
                <td><b>{u.nome}</b></td>
                <td className="muted">{u.usuarioId}</td>
                <td className="muted">{u.login}</td>
                <td><span className="tag tag-ok">{u.perfil}</span></td>
                <td>{u.senhaCadastrada?'Cadastrada':'Pendente'}</td>
                <td><span className={'tag '+(u.ativo?'tag-ok':'tag-neutro')}>{u.ativo?'Ativo':'Inativo'}</span></td>
                <td><div className="row" style={{gap:6,flexWrap:'nowrap'}}><button className="btn btn-s btn-sm" onClick={()=>{setSenhaVisivel(false);setEdit({...u,novaSenha:''})}}>Editar</button><button className={'btn btn-sm '+(u.ativo?'btn-s':'btn-p')} onClick={()=>alterarStatusUsuario(u)}>{u.ativo?'Inativar':'Reativar'}</button></div></td>
              </tr>)}</tbody>
          </table>
        </div>
      </React.Fragment>}

      {sub==='tipos' && podeSub('cadastro.tipos_veiculo') && !carregandoCad && !erroCad && <React.Fragment>
        <div><button className="btn btn-p" onClick={()=>setEditTipo({nome:'',tipoFrota:'FROTA PESADA',pbtKg:0,capacidadeCargaKg:0,toleranciaSuperiorKg:0,limiteInferiorKg:0,exigeAprovacaoAbaixo:false,ativo:true,observacao:''})}>+ Novo tipo de veículo</button></div>
        <div className="card" style={{overflowX:'auto'}}>
          <table><thead><tr><th>Tipo de veículo</th><th>Frota</th><th className="td-num">PBT</th><th className="td-num">Capacidade</th><th className="td-num">Tolerância superior</th><th className="td-num">Limite inferior</th><th>Status</th><th>Ações</th></tr></thead>
          <tbody>{cad.tiposVeiculo.map(t=><tr key={t.itemId}><td><b>{t.nome}</b></td><td>{t.tipoFrota}</td><td className="td-num num">{Number(t.pbtKg||0).toLocaleString('pt-BR')} kg</td><td className="td-num num">{Number(t.capacidadeCargaKg||0).toLocaleString('pt-BR')} kg</td><td className="td-num num">{Number(t.toleranciaSuperiorKg||0).toLocaleString('pt-BR')} kg</td><td className="td-num num">{Number(t.limiteInferiorKg||0).toLocaleString('pt-BR')} kg</td><td><span className={'tag '+(t.ativo?'tag-ok':'tag-neutro')}>{t.ativo?'Ativo':'Inativo'}</span></td><td><div className="row" style={{gap:6,flexWrap:'nowrap'}}><button className="btn btn-s btn-sm" onClick={()=>setEditTipo({...t})}>Editar</button><button className={'btn btn-sm '+(t.ativo?'btn-s':'btn-p')} onClick={()=>alterarStatusTipo(t)}>{t.ativo?'Inativar':'Reativar'}</button></div></td></tr>)}</tbody></table>
        </div>
        <div className="aviso-box">Este cadastro é a fonte única dos tipos usados nos veículos, nas metas e nos filtros. Os limites de peso ficam armazenados para a futura auditoria, sem gerar bloqueio nesta etapa.</div>
      </React.Fragment>}

      {sub==='frota' && podeSub('cadastro.veiculos') && !carregandoCad && !erroCad && <React.Fragment>
        <div><button className="btn btn-p" onClick={()=>setEditPlaca({placa:'',tipoFrota:'FROTA PESADA',tipoModelo:'',modelo:'',ativo:true,usoCompartilhado:false})}>+ Novo veículo</button></div>
        <div className="filtros-cadastro">
          <div><label>Placa</label><input value={fVeiculo.placa} onChange={e=>setFVeiculo({...fVeiculo,placa:e.target.value})} placeholder="Filtrar placa"/></div>
          <div><label>Frota</label><select value={fVeiculo.frota} onChange={e=>setFVeiculo({...fVeiculo,frota:e.target.value})}><option value="">Todas as frotas</option>{[...new Set(cad.veiculos.map(v=>v.tipoFrota).filter(Boolean))].sort(compararTexto).map(x=><option key={x}>{x}</option>)}</select></div>
          <div><label>Tipo</label><select value={fVeiculo.tipo} onChange={e=>setFVeiculo({...fVeiculo,tipo:e.target.value})}><option value="">Todos os tipos</option>{tiposAtivos.map(t=><option key={t.itemId||t.nome} value={t.nome}>{t.nome}</option>)}</select></div>
          <div><label>Ordenar</label><select value={fVeiculo.ordem} onChange={e=>setFVeiculo({...fVeiculo,ordem:e.target.value})}><option value="placa-asc">Placa crescente</option><option value="placa-desc">Placa decrescente</option><option value="frota-asc">Frota A–Z</option><option value="frota-desc">Frota Z–A</option><option value="tipo-asc">Tipo A–Z</option><option value="tipo-desc">Tipo Z–A</option></select></div>
        </div>
        <div className="card" style={{overflowX:'auto'}}>
          <table>
            <thead><tr><th>Placa</th><th>Frota</th><th>Tipo</th><th>Modelo</th><th>Uso</th><th>Status</th><th>Ações</th></tr></thead>
            <tbody>{veiculosFiltrados.map(f=>
              <tr key={f.placa}>
                <td><b className="num">{f.placa}</b></td>
                <td><span className="tag tag-ok">{f.tipoFrota||'Não informado'}</span></td>
                <td>{f.tipoModelo}</td>
                <td>{f.modelo||'—'}</td>
                <td>{f.usoCompartilhado?'Compartilhado':'Por vínculo'}</td>
                <td><span className={'tag '+(f.ativo?'tag-ok':'tag-neutro')}>{f.ativo?'Ativo':'Inativo'}</span></td>
                <td><div className="row" style={{gap:6,flexWrap:'nowrap'}}><button className="btn btn-s btn-sm" onClick={()=>setEditPlaca({...f})}>Editar</button><button className={'btn btn-sm '+(f.ativo?'btn-s':'btn-p')} onClick={()=>alterarStatusPlaca(f)}>{f.ativo?'Inativar':'Reativar'}</button></div></td>
              </tr>)}</tbody>
          </table>
        </div>
        <div className="aviso-box">A classificação da frota define qual modelo de check list o veículo recebe. Nos pesados, o tipo de veículo define também a meta da premiação; o vínculo com o motorista é usado na importação quando a planilha não traz a coluna de motorista.</div>
      </React.Fragment>}

      {sub==='vinculos' && podeSub('cadastro.vinculos') && !carregandoCad && !erroCad && <React.Fragment>
        <div><button className="btn btn-p" onClick={()=>setEditVinculo({vinculoId:'VIN-'+String(cad.vinculos.length+1).padStart(3,'0'),usuarioItemId:'',veiculoItemId:'',dataInicio:HOJE,dataFim:'',ativo:true,principal:true,observacao:''})}>+ Novo vínculo</button></div>
        <div className="filtros-cadastro">
          <div><label>Placa</label><input value={fVinculo.placa} onChange={e=>setFVinculo({...fVinculo,placa:e.target.value})} placeholder="Filtrar placa"/></div>
          <div><label>Usuário</label><input value={fVinculo.usuario} onChange={e=>setFVinculo({...fVinculo,usuario:e.target.value})} placeholder="Filtrar usuário"/></div>
          <div><label>Status</label><select value={fVinculo.status} onChange={e=>setFVinculo({...fVinculo,status:e.target.value})}><option value="">Todos os status</option><option>Ativo</option><option>Inativo</option><option>Finalizado</option></select></div>
          <div><label>Ordenar</label><select value={fVinculo.ordem} onChange={e=>setFVinculo({...fVinculo,ordem:e.target.value})}><option value="usuario-asc">Usuário A–Z</option><option value="usuario-desc">Usuário Z–A</option><option value="status-asc">Status A–Z</option><option value="status-desc">Status Z–A</option><option value="placa-asc">Placa crescente</option><option value="placa-desc">Placa decrescente</option></select></div>
        </div>
        <div className="card" style={{overflowX:'auto'}}><table><thead><tr><th>Vínculo</th><th>Usuário</th><th>Veículo</th><th>Início</th><th>Fim</th><th>Principal</th><th>Status</th><th></th></tr></thead><tbody>{vinculosFiltrados.map(v=><tr key={v.itemId}><td>{v.vinculoId}</td><td><b>{v.usuarioNome}</b></td><td>{v.placa}</td><td>{dataBR((v.dataInicio||'').slice(0,10))}</td><td>{v.dataFim?dataBR(v.dataFim.slice(0,10)):'—'}</td><td>{v.principal?'Sim':'Não'}</td><td><span className={'tag '+(v.dataFim?'tag-neutro':v.ativo?'tag-ok':'tag-neg')}>{statusVinculo(v)}</span></td><td><button className="btn btn-s btn-sm" onClick={()=>setEditVinculo({...v})}>Editar</button></td></tr>)}</tbody></table></div>
      </React.Fragment>}

      {sub==='perfis' && podeSub('cadastro.perfis') && !carregandoCad && !erroCad && <React.Fragment>
        <div><button className="btn btn-p" onClick={()=>setEditPerfil({titulo:'',descricao:'',areasAcesso:[],subtelasAcesso:[],nivelAcesso:'SOMENTE_VISUALIZAR',permiteModulosApp:true,ativo:true})}>+ Novo perfil</button></div>
        <div className="card" style={{overflowX:'auto'}}>
          <table><thead><tr><th>Perfil</th><th>Descrição</th><th>Áreas</th><th>Subtelas</th><th>Nível</th><th>Módulos</th><th>Status</th><th></th></tr></thead>
          <tbody>{cad.perfis.map(p=><tr key={p.itemId}><td><b>{p.titulo}</b></td><td>{p.descricao||'—'}</td><td>{(p.areasAcesso||[]).join(', ')||'—'}</td><td>{(p.subtelasAcesso||[]).length}</td><td><span className="tag tag-ok">{p.nivelAcesso}</span></td><td>{p.permiteModulosApp?'Sim':'Não'}</td><td><span className={'tag '+(p.ativo?'tag-ok':'tag-neutro')}>{p.ativo?'Ativo':'Inativo'}</span></td><td><button className="btn btn-s btn-sm" onClick={()=>setEditPerfil({...p,areasAcesso:[...(p.areasAcesso||[])],subtelasAcesso:[...(p.subtelasAcesso||[])]})}>Editar</button></td></tr>)}</tbody></table>
        </div>
      </React.Fragment>}

      {edit &&
        <Modal titulo={edit.nome?'Editar usuário':'Novo usuário'} onClose={()=>setEdit(null)}>
          <div style={{display:'flex', flexDirection:'column', gap:12}}>
            <div><label>Nome completo</label><input value={edit.nome} onChange={e=>setEdit({...edit, nome:e.target.value})}/></div>
            <div className="form-grid"><div><label>UsuarioID</label><input value={edit.usuarioId||''} readOnly={Boolean(edit.itemId&&String(edit.usuarioId||'').trim())} onChange={e=>!(edit.itemId&&String(edit.usuarioId||'').trim())&&setEdit({...edit,usuarioId:e.target.value.toUpperCase()})} title={edit.itemId&&String(edit.usuarioId||'').trim()?'Identificador permanente: não pode ser alterado após a criação.':'Informe o UsuarioID para concluir este cadastro incompleto.'}/></div>
              <div><label>Usuário</label><input value={edit.login} onChange={e=>setEdit({...edit, login:e.target.value.toLowerCase()})}/></div>
              <div><label>Telefone</label><input value={edit.telefone||''} onChange={e=>setEdit({...edit,telefone:e.target.value})}/></div>
            </div>
            <div><label>Perfil</label>
              <select value={edit.perfilAcessoId||''} onChange={e=>{const p=cad.perfis.find(x=>String(x.itemId)===String(e.target.value));const permite=p?.permiteModulosApp===true;setEdit({...edit,perfilAcessoId:e.target.value,perfil:p?.titulo||edit.perfil,...(!permite?{acessoCargas:false,acessoPremiacao:false,acessoChecklist:false,acessoSinistros:false,acessoAgendamentos:false,acessoHistorico:false}:{})})}}>
                <option value="">Selecionar perfil...</option>
                {cad.perfis.filter(p=>p.ativo||p.itemId===edit.perfilAcessoId).map(p=><option key={p.itemId} value={p.itemId}>{p.titulo}</option>)}
              </select>
              {!edit.perfilAcessoId&&<div className="muted" style={{fontSize:12,marginTop:5}}>Selecione um perfil para definir áreas, subtelas e nível de acesso.</div>}</div>
            {edit.perfilAcessoId&&<div>
              <label>Módulos liberados para este usuário</label>
              <div className="muted" style={{fontSize:12,marginTop:5}}>
                Perfil selecionado: <b>{perfilSelecionado?.titulo||'não localizado'}</b> · Permite módulos: <b>{permiteModulosUsuario?'Sim':'Não'}</b>
              </div>
              {permiteModulosUsuario?
                <div className="perfil-subtelas-grid" style={{marginTop:8}}>
                  {[
                    ['acessoCargas','Cargas'],
                    ['acessoPremiacao','Premiação'],
                    ['acessoChecklist','Check list'],
                    ['acessoSinistros','Sinistros'],
                    ['acessoAgendamentos','Agendamento']
                  ].map(([campo,rotulo])=>
                    <button type="button" key={campo} className={'perfil-subtela'+(edit[campo]?' on':'')} onClick={()=>setEdit({...edit,[campo]:!edit[campo]})}>
                      <span className="perfil-subtela-check">{edit[campo]?'✓':''}</span>
                      <span>{rotulo}</span>
                    </button>
                  )}
                </div>
                :<div className="aviso-box" style={{marginTop:8}}>Este perfil está configurado com “Permite módulos do app? = Não”. Nenhum módulo pode ser liberado para este usuário.</div>}
            </div>}
            <div><label>Acesso à frota</label><select value={edit.tipoFrotaAcesso} onChange={e=>setEdit({...edit,tipoFrotaAcesso:e.target.value})}><option>FROTA PESADA</option><option>FROTA LEVE</option><option>AMBAS</option></select></div>
            <div><label>Status do usuário</label><select value={edit.ativo?'s':'n'} onChange={e=>setEdit({...edit,ativo:e.target.value==='s'})}><option value="s">Ativo</option><option value="n">Inativo</option></select></div>
            <div>
              <label>{edit.itemId?(edit.senhaCadastrada?'Redefinir senha (deixe vazio para manter)':'Definir senha'):'Senha inicial'}</label>
              <div className="row" style={{gap:8}}>
                <input className="grow" type={senhaVisivel?'text':'password'} value={edit.novaSenha||''} onChange={e=>setEdit({...edit,novaSenha:e.target.value})} placeholder={edit.perfil==='MOTORISTA'?'6 números':'mínimo 8 caracteres'}/>
                <button type="button" className="btn btn-s btn-sm" onClick={()=>setSenhaVisivel(!senhaVisivel)}>{senhaVisivel?'Ocultar':'Ver'}</button>
                <button type="button" className="btn btn-s btn-sm" onClick={gerarSenha}>Gerar</button>
              </div>
              <div className="muted" style={{fontSize:12,marginTop:5}}>A senha aparece somente agora. Depois de salva, será possível apenas redefini-la.</div>
            </div>
            <button className="btn btn-p" disabled={salvandoUsuario} onClick={salvarUser}>{salvandoUsuario?'Salvando usuário...':'Salvar usuário'}</button>
          </div>
        </Modal>}
      {editPlaca &&
        <Modal titulo={'Placa '+editPlaca.placa} onClose={()=>setEditPlaca(null)}>
          <div style={{display:'flex', flexDirection:'column', gap:12}}>
            <div><label>Frota</label>
              <select value={editPlaca.tipoFrota} onChange={e=>setEditPlaca({...editPlaca, tipoFrota:e.target.value})}>
                <option>FROTA PESADA</option><option>FROTA LEVE</option>
              </select></div>
            <div><label>Placa</label><input value={editPlaca.placa} disabled={!!editPlaca.itemId} onChange={e=>setEditPlaca({...editPlaca,placa:e.target.value.toUpperCase()})}/></div><div><label>Tipo do veículo</label>
                <select value={editPlaca.tipoModelo} onChange={e=>setEditPlaca({...editPlaca, tipoModelo:e.target.value})}>
                  <option value="">Selecionar...</option>
                  {editPlaca.tipoModelo&&!tiposAtivos.some(t=>chaveTipo(t.nome)===chaveTipo(editPlaca.tipoModelo))&&<option value={editPlaca.tipoModelo}>{editPlaca.tipoModelo} (histórico)</option>}
                  {tiposAtivos.map(t=><option key={t.itemId} value={t.nome}>{t.nome}</option>)}
                </select></div><div><label>Modelo <span className="muted">(opcional)</span></label><input value={editPlaca.modelo||''} onChange={e=>setEditPlaca({...editPlaca,modelo:e.target.value})} placeholder="Ex.: Fiat Cronos, Chevrolet Onix"/></div><div><label>Uso compartilhado?</label><select value={editPlaca.usoCompartilhado?'s':'n'} onChange={e=>setEditPlaca({...editPlaca,usoCompartilhado:e.target.value==='s'})}><option value="n">Não — exige vínculo</option><option value="s">Sim</option></select></div>
            <div><label>Status do veículo</label><select value={editPlaca.ativo?'s':'n'} onChange={e=>setEditPlaca({...editPlaca,ativo:e.target.value==='s'})}><option value="s">Ativo</option><option value="n">Inativo</option></select></div>
            <button className="btn btn-p" onClick={salvarPlaca}>Salvar placa</button>
          </div>
        </Modal>}
      {editVinculo && <Modal titulo="Vínculo usuário × veículo" onClose={()=>setEditVinculo(null)}><div style={{display:'flex',flexDirection:'column',gap:12}}><div><label>Usuário</label><select value={editVinculo.usuarioItemId} onChange={e=>setEditVinculo({...editVinculo,usuarioItemId:e.target.value})}><option value="">Selecionar...</option>{cad.usuarios.filter(u=>u.ativo).map(u=><option key={u.itemId} value={u.itemId}>{u.nome}</option>)}</select></div><div><label>Veículo</label><select value={editVinculo.veiculoItemId} onChange={e=>setEditVinculo({...editVinculo,veiculoItemId:e.target.value})}><option value="">Selecionar...</option>{cad.veiculos.filter(v=>v.ativo&&!v.usoCompartilhado).map(v=><option key={v.itemId} value={v.itemId}>{v.placa}</option>)}</select></div><div className="form-grid"><div><label>Início</label><input type="date" value={(editVinculo.dataInicio||'').slice(0,10)} onChange={e=>setEditVinculo({...editVinculo,dataInicio:e.target.value})}/></div><div><label>Fim</label><input type="date" value={(editVinculo.dataFim||'').slice(0,10)} onChange={e=>setEditVinculo({...editVinculo,dataFim:e.target.value,ativo:!e.target.value})}/></div></div><div><label>Principal?</label><select value={editVinculo.principal?'s':'n'} onChange={e=>setEditVinculo({...editVinculo,principal:e.target.value==='s'})}><option value="s">Sim</option><option value="n">Não</option></select></div><div><label>Observação</label><textarea value={editVinculo.observacao||''} onChange={e=>setEditVinculo({...editVinculo,observacao:e.target.value})}/></div><button className="btn btn-p" onClick={salvarVinculo}>Salvar vínculo</button></div></Modal>}
      {editPerfil && <Modal large titulo={editPerfil.itemId?'Editar perfil':'Novo perfil'} onClose={()=>setEditPerfil(null)}>
        <div style={{display:'flex',flexDirection:'column',gap:12}}>
          <div><label>Nome do perfil</label><input value={editPerfil.titulo||''} onChange={e=>setEditPerfil({...editPerfil,titulo:e.target.value.toUpperCase()})}/></div>
          <div><label>Descrição</label><textarea value={editPerfil.descricao||''} onChange={e=>setEditPerfil({...editPerfil,descricao:e.target.value})}/></div>
          <div className="form-grid">
            <div><label>Nível de acesso</label><select value={editPerfil.nivelAcesso||'SOMENTE_VISUALIZAR'} onChange={e=>setEditPerfil({...editPerfil,nivelAcesso:e.target.value})}><option>SOMENTE_VISUALIZAR</option><option>GERENCIAR</option><option>ADMIN_COMPLETO</option></select></div>
            <div><label>Permite módulos do app?</label><select value={editPerfil.permiteModulosApp?'s':'n'} onChange={e=>setEditPerfil({...editPerfil,permiteModulosApp:e.target.value==='s'})}><option value="s">Sim</option><option value="n">Não</option></select></div>
            <div><label>Status</label><select value={editPerfil.ativo?'s':'n'} onChange={e=>setEditPerfil({...editPerfil,ativo:e.target.value==='s'})}><option value="s">Ativo</option><option value="n">Inativo</option></select></div>
          </div>
          <div><label>Áreas e subtelas</label>
            <div className="perfil-acessos">
              {Object.entries(AREAS_E_SUBTELAS).map(([area,subtelas])=>{
                const areaAtiva=(editPerfil.areasAcesso||[]).includes(area);
                const qtdMarcadas=subtelas.filter(([codigo])=>(editPerfil.subtelasAcesso||[]).includes(codigo)).length;
                return <div key={area} className={'perfil-area'+(areaAtiva?' aberta':'')}>
                  <button type="button" className="perfil-area-cabecalho" onClick={()=>alternarArea(area)} aria-expanded={areaAtiva}>
                    <input type="checkbox" checked={areaAtiva} readOnly tabIndex="-1"/>
                    <span className="perfil-area-titulo">
                      <b>{ROTULOS_AREAS[area]}</b>
                      <span className="perfil-area-resumo">{areaAtiva?(subtelas.length?qtdMarcadas+' de '+subtelas.length+' subtelas liberadas':'Área liberada'):'Clique para liberar e abrir'}</span>
                    </span>
                    <span className="perfil-area-seta" aria-hidden="true">⌄</span>
                  </button>
                  {areaAtiva&&<div className="perfil-subtelas">
                    {subtelas.length>0?<React.Fragment>
                      <div className="perfil-subtelas-titulo">
                        <span>Subtelas disponíveis</span>
                        <span className="muted">{qtdMarcadas}/{subtelas.length} selecionadas</span>
                      </div>
                      <div className="perfil-subtelas-grid">
                        {subtelas.map(([codigo,rotulo])=>{
                          const subtelaAtiva=(editPerfil.subtelasAcesso||[]).includes(codigo);
                          return <button type="button" key={codigo} className={'perfil-subtela'+(subtelaAtiva?' on':'')} onClick={()=>alternarSubtela(codigo)}>
                            <span className="perfil-subtela-check">{subtelaAtiva?'✓':''}</span>
                            <span>{rotulo}</span>
                          </button>;
                        })}
                      </div>
                    </React.Fragment>:<div className="perfil-sem-subtelas">Esta área não possui subdivisões. Ao liberá-la, a tela principal já fica disponível para o perfil.</div>}
                  </div>}
                </div>;
              })}
            </div>
          </div>
          <button type="button" className="btn btn-p" disabled={salvandoPerfil} onClick={salvarPerfil}>{salvandoPerfil?'Salvando...':'Salvar perfil'}</button>
        </div>
      </Modal>}
      {editTipo && <Modal titulo={editTipo.itemId?'Editar tipo de veículo':'Novo tipo de veículo'} onClose={()=>setEditTipo(null)}>
        <div className="form-grid">
          <div style={{gridColumn:'1/-1'}}><label>Nome do tipo de veículo</label><input value={editTipo.nome} onChange={e=>setEditTipo({...editTipo,nome:e.target.value.toUpperCase()})}/></div>
          <div><label>Frota</label><select value={editTipo.tipoFrota} onChange={e=>setEditTipo({...editTipo,tipoFrota:e.target.value})}><option>FROTA PESADA</option><option>FROTA LEVE</option></select></div>
          <div><label>Status</label><select value={editTipo.ativo?'s':'n'} onChange={e=>setEditTipo({...editTipo,ativo:e.target.value==='s'})}><option value="s">Ativo</option><option value="n">Inativo</option></select></div>
          <div><label>PBT (kg)</label><input type="number" min="0" value={editTipo.pbtKg} onChange={e=>setEditTipo({...editTipo,pbtKg:Number(e.target.value)})}/></div>
          <div><label>Capacidade de carga (kg)</label><input type="number" min="0" value={editTipo.capacidadeCargaKg} onChange={e=>setEditTipo({...editTipo,capacidadeCargaKg:Number(e.target.value)})}/></div>
          <div><label>Tolerância superior (kg)</label><input type="number" min="0" value={editTipo.toleranciaSuperiorKg} onChange={e=>setEditTipo({...editTipo,toleranciaSuperiorKg:Number(e.target.value)})}/></div>
          <div><label>Tolerância inferior (kg)</label><input type="number" min="0" value={editTipo.limiteInferiorKg} onChange={e=>setEditTipo({...editTipo,limiteInferiorKg:Number(e.target.value)})}/></div>
          <div><label>Validar faixa de carga?</label><select value={editTipo.exigeAprovacaoAbaixo?'s':'n'} onChange={e=>setEditTipo({...editTipo,exigeAprovacaoAbaixo:e.target.value==='s'})}><option value="n">Não</option><option value="s">Sim</option></select></div>
          <div style={{gridColumn:'1/-1'}}><label>Observação</label><textarea value={editTipo.observacao||''} onChange={e=>setEditTipo({...editTipo,observacao:e.target.value})}/></div>
        </div>
        <button className="btn btn-p" style={{width:'100%',marginTop:14}} onClick={salvarTipo}>Salvar tipo de veículo</button>
      </Modal>}
    </React.Fragment>
  );
}


/* ================= ADM: SINISTROS ================= */
function AdmSinistros({toast,user,foco}){
  const podeGestao=pode(user,'sinistros.visualizar');
  const podeConfig=pode(user,'sinistros.configuracoes');
  const podeEditarConfig=pode(user,'sinistros.configuracoes.editar');
  const [sub,setSub]=useState(podeGestao?'gestao':'config');
  const [lista,setLista]=useState([]),[carregando,setCarregando]=useState(false),[selecionado,setSelecionado]=useState(null);
  const [carregandoDetalhe,setCarregandoDetalhe]=useState(false);
  const [filtro,setFiltro]=useState({texto:'',status:'ABERTOS',gravidade:'',competencia:'',tipoOcorrencia:''});
  const [edicao,setEdicao]=useState({statusSinistro:'',gravidade:'',observacao:''});
  const [solicitacoesNovas,setSolicitacoesNovas]=useState([]);
  const [analisandoDocumento,setAnalisandoDocumento]=useState('');
  const [config,setConfig]=useState(null),[salvandoConfig,setSalvandoConfig]=useState(false);
  const carregar=async()=>{if(!podeGestao)return;setCarregando(true);try{const r=await ApiService.admListarSinistros();setLista(r.sinistros||[]);}catch(e){toast('Erro ao carregar sinistros: '+e.message);}finally{setCarregando(false);}};
  const carregarConfig=async()=>{if(!podeConfig)return;try{const r=await ApiService.admObterConfiguracoesSinistros();setConfig(r.configuracao||{titulo:'Configuração Geral',ativo:true,emailPrincipal:'',emailCopia:'',emailCopiaOculta:'',nomeContatoEmergencia:'',telefoneEmergencia:'',procedimento:'',revisaoProcedimento:'Revisão 01',permiteReabrirSinistro:false,diasReabertura:0,enviarEmailAutomatico:false,assuntoEmail:'URGENTE - Novo Sinistro Registrado',versaoModulo:'1.0',ultimaAtualizacao:''});}catch(e){toast('Erro ao carregar configurações: '+e.message);}};
  useEffect(()=>{if(podeGestao)carregar();if(podeConfig)carregarConfig();},[]);
  useEffect(()=>{if(foco?.chave&&podeGestao){setSub('gestao');setFiltro(f=>({...f,status:'ABERTOS',competencia:foco.parametros?.competencia||''}));}},[foco?.chave]);
  useEffect(()=>{if(sub==='gestao'&&!podeGestao&&podeConfig)setSub('config');if(sub==='config'&&!podeConfig&&podeGestao)setSub('gestao');},[podeGestao,podeConfig]);

  const abrir=async s=>{
    setCarregandoDetalhe(true);
    try{const r=await ApiService.admObterSinistro(s.id);const detalhe=r.sinistro||s;setSelecionado(detalhe);setEdicao({statusSinistro:detalhe.statusSinistro||'Aberto',gravidade:detalhe.gravidade||'Baixa',observacao:''});setSolicitacoesNovas([]);}
    catch(e){toast('Erro ao abrir sinistro: '+e.message);}
    finally{setCarregandoDetalhe(false);}
  };
  const alternarSolicitacao=tipo=>setSolicitacoesNovas(prev=>prev.some(x=>x.tipoDocumento===tipo)?prev.filter(x=>x.tipoDocumento!==tipo):[...prev,{tipoDocumento:tipo,descricaoSolicitacao:'',obrigatorio:true}]);
  const atualizarSolicitacao=(tipo,campo,valor)=>setSolicitacoesNovas(prev=>prev.map(x=>x.tipoDocumento===tipo?{...x,[campo]:valor}:x));
  const salvar=async()=>{
    if(!selecionado)return;
    const docs=solicitacoesNovas.map(({tipoDocumento,descricaoSolicitacao,obrigatorio})=>({tipoDocumento,descricaoSolicitacao,obrigatorio}));
    if(normalizarPerfil(edicao.statusSinistro)==='AGUARDANDO_DOCUMENTOS'){
      const existentes=(selecionado.solicitacoesDocumentos||[]).filter(d=>d.ativo!==false&&!['ACEITO','DISPENSADO'].includes(normalizarPerfil(d.statusDocumento)));
      if(!docs.length&&!existentes.length){toast('Selecione ao menos um documento que o motorista precisa enviar.');return;}
      const outro=docs.find(d=>normalizarPerfil(d.tipoDocumento)==='OUTRO'&&!String(d.descricaoSolicitacao||'').trim());
      if(outro){toast('Descreva qual documento deve ser enviado na opção Outro.');return;}
    }
    try{await ApiService.admAtualizarSinistro(selecionado.id,{...edicao,documentosSolicitados:docs});toast('Sinistro atualizado.');setSelecionado(null);setSolicitacoesNovas([]);await carregar();}
    catch(e){toast('Erro ao atualizar sinistro: '+e.message);}
  };
  const analisarDocumento=async(doc,status)=>{
    let motivo='';
    if(status==='Rejeitado'){
      motivo=window.prompt('Informe o motivo da rejeição. Esta mensagem será exibida ao motorista:','')||'';
      if(!motivo.trim())return;
    }
    if(status==='Dispensado'&&!window.confirm('Dispensar esta solicitação? O motorista não precisará mais enviar este documento.'))return;
    setAnalisandoDocumento(doc.id);
    try{
      const r=await ApiService.admAnalisarDocumentoSinistro(selecionado.id,doc.id,status,motivo.trim());
      const docs=r.solicitacoesDocumentos||selecionado.solicitacoesDocumentos||[];
      const novoStatus=r.statusSinistro||selecionado.statusSinistro;
      const agora=new Date().toISOString();
      const historicoDocumento={
        id:'auto-doc-'+Date.now(),
        dataHora:agora,
        usuario:user?.login||user?.nome||'Administrativo',
        perfil:'Administrativo',
        acao:'Status alterado',
        status:selecionado.statusSinistro,
        observacao:status==='Rejeitado'
          ?'Documento rejeitado: '+doc.tipoDocumento+'. Motivo: '+motivo.trim()
          :'Documento '+status.toLowerCase()+': '+doc.tipoDocumento+'.',
        origem:'Painel Administrativo'
      };
      const historicoAutomatico=r.statusAlteradoAutomaticamente?{
        id:'auto-status-'+Date.now(),
        dataHora:agora,
        usuario:'Sistema',
        perfil:'Sistema',
        acao:'Status alterado',
        status:novoStatus,
        observacao:'Documentação concluída. Todos os documentos obrigatórios foram aceitos ou dispensados. Aguardando documentos → Em atendimento.',
        origem:'Painel Administrativo'
      }:null;
      setSelecionado(atual=>({...atual,
        statusSinistro:novoStatus,
        solicitacoesDocumentos:docs,
        documentosResumo:r.documentosResumo||atual.documentosResumo,
        pendenciaDocumental:r.pendenciaDocumental,
        historico:[...(atual.historico||[]),historicoDocumento,...(historicoAutomatico?[historicoAutomatico]:[])]
      }));
      if(r.statusAlteradoAutomaticamente)setEdicao(atual=>({...atual,statusSinistro:novoStatus}));
      setLista(lista=>lista.map(s=>String(s.id)===String(selecionado.id)?{...s,
        statusSinistro:novoStatus,
        documentosResumo:r.documentosResumo||s.documentosResumo,
        pendenciaDocumental:r.pendenciaDocumental
      }:s));
      toast(r.statusAlteradoAutomaticamente
        ?'Documento '+(status==='Dispensado'?'dispensado':'aceito')+'. Documentação concluída: sinistro voltou para Em atendimento.'
        :(status==='Aceito'?'Documento aceito.':status==='Rejeitado'?'Documento devolvido para reenvio.':'Documento dispensado.'));
    }catch(e){toast('Erro ao analisar documento: '+e.message);}
    finally{setAnalisandoDocumento('');}
  };
  const salvarConfig=async()=>{if(!config||!podeEditarConfig)return;setSalvandoConfig(true);try{const r=await ApiService.admSalvarConfiguracoesSinistros(config);setConfig(r.configuracao||config);toast('Configurações de sinistros salvas.');}catch(e){toast('Erro ao salvar configurações: '+e.message);}finally{setSalvandoConfig(false);}};
  const filtrados=lista.filter(s=>{const texto=normalizar([s.numeroSinistro,s.placa,s.motoristaNome,s.municipio,s.tipoOcorrencia,s.tipoSinistro].join(' '));const okTexto=!filtro.texto||texto.includes(normalizar(filtro.texto));const encerrado=['CONCLUIDO','CANCELADO'].includes(normalizarPerfil(s.statusSinistro));const okStatus=filtro.status==='TODOS'||(filtro.status==='ABERTOS'&&!encerrado)||normalizarPerfil(s.statusSinistro)===filtro.status;const okGrav=!filtro.gravidade||normalizarPerfil(s.gravidade)===filtro.gravidade;const okPeriodo=!filtro.competencia||String(s.dataHoraOcorrido||s.dataCriacao||s.created||'').slice(0,7)===filtro.competencia;const okTipo=!filtro.tipoOcorrencia||normalizarPerfil(s.tipoOcorrencia)===normalizarPerfil(filtro.tipoOcorrencia);return okTexto&&okStatus&&okGrav&&okPeriodo&&okTipo;});

  return <React.Fragment>
    <div className="row" style={{flexWrap:'wrap'}}><div className="grow"><h2>Sinistros</h2><div className="muted">Gestão dos registros e parâmetros operacionais do módulo.</div></div>{sub==='gestao'&&podeGestao&&<button className="btn btn-s" onClick={carregar}>{carregando?'Atualizando...':'Atualizar'}</button>}</div>
    <div className="subtabs" style={{marginTop:14}}>{podeGestao&&<button className={'subtab'+(sub==='gestao'?' on':'')} onClick={()=>setSub('gestao')}>Gestão e tratamento</button>}{podeConfig&&<button className={'subtab'+(sub==='config'?' on':'')} onClick={()=>setSub('config')}>Configurações</button>}</div>

    {sub==='gestao'&&podeGestao&&<React.Fragment>
      <div className="card"><div className="filtros-cadastro" style={{margin:0}}><div><label>Pesquisar</label><input value={filtro.texto} onChange={e=>setFiltro({...filtro,texto:e.target.value})} placeholder="Protocolo, placa, motorista..."/></div><div><label>Status</label><select value={filtro.status} onChange={e=>setFiltro({...filtro,status:e.target.value})}><option value="ABERTOS">Em aberto</option><option value="TODOS">Todos</option>{['ABERTO','AGUARDANDO_ANALISE','EM_ATENDIMENTO','AGUARDANDO_DOCUMENTOS','ENCAMINHADO_SEGURADORA','AGUARDANDO_ORCAMENTO','EM_REPARO','AGUARDANDO_TERCEIRO','CONCLUIDO','CANCELADO'].map(x=><option key={x} value={x}>{x==='ABERTO'?'Aberto (novo)':(SINISTRO_STATUS_ROTULOS[x]||x.replaceAll('_',' '))}</option>)}</select></div><div><label>Competência</label><input type="month" value={filtro.competencia||''} onChange={e=>setFiltro({...filtro,competencia:e.target.value})}/></div><div><label>Tipo de ocorrência</label><select value={filtro.tipoOcorrencia||''} onChange={e=>setFiltro({...filtro,tipoOcorrencia:e.target.value})}><option value="">Todos</option>{['Acidente','Pane','Avaria','Furto / Roubo / Vandalismo','Outro'].map(x=><option key={x}>{x}</option>)}</select></div><div><label>Gravidade</label><select value={filtro.gravidade} onChange={e=>setFiltro({...filtro,gravidade:e.target.value})}><option value="">Todas</option>{['BAIXA','MEDIA','ALTA','CRITICA'].map(x=><option key={x}>{x}</option>)}</select></div></div></div>
      <div className="cards4"><div className="card kpi"><div className="l">Registros filtrados</div><div className="v">{filtrados.length}</div></div><div className="card kpi"><div className="l">Com vítima</div><div className="v">{filtrados.filter(s=>s.possuiVitima).length}</div></div><div className="card kpi"><div className="l">Alta/crítica</div><div className="v">{filtrados.filter(s=>['ALTA','CRITICA'].includes(normalizarPerfil(s.gravidade))).length}</div></div></div>
      <div className="card" style={{overflowX:'auto'}}><table><thead><tr><th>Protocolo</th><th>Ocorrido</th><th>Placa</th><th>Motorista</th><th>Ocorrência</th><th>Gravidade</th><th>Status</th><th></th></tr></thead><tbody>{filtrados.map(s=><tr key={s.id}><td><b>{s.numeroSinistro}</b>{(s.documentosResumo?.pendentesEnvio||s.documentosResumo?.rejeitados)?<div className="muted" style={{color:'#8A5200'}}>Ação do motorista pendente</div>:null}</td><td>{dataBR(String(s.dataHoraOcorrido||'').slice(0,10))}</td><td><b>{s.placa}</b></td><td>{s.motoristaNome}</td><td><b>{s.tipoOcorrencia||'Outro'}</b><div className="muted">{s.tipoSinistro}</div>{s.necessitaGuincho&&<div style={{marginTop:4,fontWeight:800,color:'var(--erro)',fontSize:12}}>🚨 GUINCHO NECESSÁRIO</div>}</td><td><span className={'tag sinistro-gravidade-'+normalizarPerfil(s.gravidade)}>{s.gravidade}</span></td><td><SinistroStatusTag s={s.statusSinistro}/></td><td><button className="btn btn-s btn-sm" disabled={carregandoDetalhe} onClick={()=>abrir(s)}>{carregandoDetalhe?'Abrindo...':(pode(user,'sinistros.gerenciar')?'Tratar':'Visualizar')}</button></td></tr>)}</tbody></table>{!carregando&&!filtrados.length&&<div className="muted" style={{padding:18,textAlign:'center'}}>Nenhum sinistro encontrado.</div>}</div>
    </React.Fragment>}

    {sub==='config'&&podeConfig&&<React.Fragment>{!config?<div className="card"><div className="muted">Carregando configurações...</div></div>:<div className="card"><div className="row" style={{marginBottom:14}}><div className="grow"><h3>Configurações de sinistros</h3><div className="muted">Parâmetros lidos da lista Sinistros_Configuracoes.</div></div><span className={'tag '+(podeEditarConfig?'tag-ok':'tag-neutro')}>{podeEditarConfig?'Edição liberada':'Somente visualização'}</span></div><div className="form-grid"><div><label>Título</label><input disabled={!podeEditarConfig} value={config.titulo||''} onChange={e=>setConfig({...config,titulo:e.target.value})}/></div><div><label>Status</label><select disabled={!podeEditarConfig} value={config.ativo?'s':'n'} onChange={e=>setConfig({...config,ativo:e.target.value==='s'})}><option value="s">Ativo</option><option value="n">Inativo</option></select></div><div><label>E-mail principal</label><input disabled={!podeEditarConfig} value={config.emailPrincipal||''} onChange={e=>setConfig({...config,emailPrincipal:e.target.value})}/></div><div><label>E-mails em cópia</label><input disabled={!podeEditarConfig} value={config.emailCopia||''} onChange={e=>setConfig({...config,emailCopia:e.target.value})} placeholder="Separar por ;"/></div><div><label>Cópia oculta</label><input disabled={!podeEditarConfig} value={config.emailCopiaOculta||''} onChange={e=>setConfig({...config,emailCopiaOculta:e.target.value})} placeholder="Separar por ;"/></div><div><label>Assunto do e-mail</label><input disabled={!podeEditarConfig} value={config.assuntoEmail||''} onChange={e=>setConfig({...config,assuntoEmail:e.target.value})}/></div><div><label>Contato de emergência</label><input disabled={!podeEditarConfig} value={config.nomeContatoEmergencia||''} onChange={e=>setConfig({...config,nomeContatoEmergencia:e.target.value})}/></div><div><label>Telefone de emergência</label><input disabled={!podeEditarConfig} value={config.telefoneEmergencia||''} onChange={e=>setConfig({...config,telefoneEmergencia:e.target.value})}/></div><div><label>Revisão do procedimento</label><input disabled={!podeEditarConfig} value={config.revisaoProcedimento||''} onChange={e=>setConfig({...config,revisaoProcedimento:e.target.value})}/></div><div><label>Versão do módulo</label><input disabled={!podeEditarConfig} value={config.versaoModulo||''} onChange={e=>setConfig({...config,versaoModulo:e.target.value})}/></div><div><label>Enviar e-mail automático?</label><select disabled={!podeEditarConfig} value={config.enviarEmailAutomatico?'s':'n'} onChange={e=>setConfig({...config,enviarEmailAutomatico:e.target.value==='s'})}><option value="s">Sim</option><option value="n">Não</option></select></div><div><label>Permitir reabertura?</label><select disabled={!podeEditarConfig} value={config.permiteReabrirSinistro?'s':'n'} onChange={e=>setConfig({...config,permiteReabrirSinistro:e.target.value==='s'})}><option value="s">Sim</option><option value="n">Não</option></select></div><div><label>Dias para reabertura</label><input type="number" min="0" disabled={!podeEditarConfig} value={config.diasReabertura||0} onChange={e=>setConfig({...config,diasReabertura:Number(e.target.value)||0})}/></div><div style={{gridColumn:'1/-1'}}><label>Procedimento</label><textarea rows="5" disabled={!podeEditarConfig} value={config.procedimento||''} onChange={e=>setConfig({...config,procedimento:e.target.value})}/></div><div><label>Última atualização</label><input disabled value={config.ultimaAtualizacao?new Date(config.ultimaAtualizacao).toLocaleString('pt-BR'):''}/></div></div>{podeEditarConfig&&<button className="btn btn-p" disabled={salvandoConfig} style={{marginTop:14}} onClick={salvarConfig}>{salvandoConfig?'Salvando...':'Salvar configurações'}</button>}</div>}</React.Fragment>}

    {selecionado&&<Modal large titulo={selecionado.numeroSinistro+' — '+selecionado.placa} onClose={()=>setSelecionado(null)}>
      <div className="cards4"><div className="card"><label>Motorista</label><b>{selecionado.motoristaNome}</b><div className="muted">{selecionado.motoristaTelefone||'Sem telefone'}</div></div><div className="card"><label>Ocorrência</label><b>{selecionado.tipoOcorrencia||'Outro'}</b><div className="muted">{selecionado.tipoSinistro}</div></div><div className="card"><label>Data/hora</label><b>{dataHoraBRSinistro(selecionado.dataHoraOcorrido)}</b></div><div className="card"><label>Local</label><b>{selecionado.localOcorrido}</b><div className="muted">{selecionado.municipio} / {selecionado.uf}</div></div><div className="card"><label>Condições</label><div>{selecionado.possuiVitima?'⚠ Possui vítima':'Sem vítima informada'}</div><div>{selecionado.veiculoImobilizado?'Veículo imobilizado':'Veículo não imobilizado'}</div>{selecionado.necessitaGuincho&&<div style={{marginTop:5,fontWeight:900,color:'var(--erro)'}}>🚨 GUINCHO NECESSÁRIO</div>}</div></div>
      <div className="card" style={{marginTop:10}}><label>Descrição</label><div style={{whiteSpace:'pre-wrap'}}>{selecionado.descricaoOcorrido}</div></div>
      <div className="card" style={{marginTop:10}}><h3>Documentos e evidências do envio inicial</h3>{(selecionado.documentos||[]).length?<GaleriaArquivosSinistro arquivos={selecionado.documentos}/>:<div className="muted" style={{marginTop:8}}>Nenhum arquivo enviado.</div>}</div>
      <div className="card" style={{marginTop:10}}><div className="row"><h3 className="grow">Solicitações documentais</h3><span className="muted">{(selecionado.solicitacoesDocumentos||[]).length} item(ns)</span></div>{(selecionado.solicitacoesDocumentos||[]).length?(selecionado.solicitacoesDocumentos||[]).map(doc=>{const chave=normalizarPerfil(doc.statusDocumento);return <div className={'sinistro-documento-item '+(chave==='REJEITADO'?'rejeitado':chave==='PENDENTE_DE_ENVIO'?'pendente':chave==='ENVIADO'?'enviado':chave==='ACEITO'?'aceito':'dispensado')} key={doc.id}><div className="row"><div className="grow"><b>{doc.tipoDocumento}</b>{doc.obrigatorio&&<span className="muted"> · obrigatório</span>}</div><DocumentoStatusTag s={doc.statusDocumento}/></div>{doc.descricaoSolicitacao&&<div style={{marginTop:6,whiteSpace:'pre-wrap'}}>{doc.descricaoSolicitacao}</div>}{doc.observacaoMotorista&&<div className="muted" style={{marginTop:6}}><b>Motorista:</b> {doc.observacaoMotorista}</div>}{doc.motivoRejeicao&&<div className="erro-box" style={{marginTop:7}}><b>Motivo da rejeição:</b> {doc.motivoRejeicao}</div>}{(doc.arquivos||[]).length>0&&<GaleriaArquivosSinistro arquivos={doc.arquivos}/>}{pode(user,'sinistros.gerenciar')&&<div className="row" style={{marginTop:8,flexWrap:'wrap'}}>{chave==='ENVIADO'&&<React.Fragment><button className="btn btn-p btn-sm" disabled={analisandoDocumento===doc.id} onClick={()=>analisarDocumento(doc,'Aceito')}>Aceitar</button><button className="btn btn-d btn-sm" disabled={analisandoDocumento===doc.id} onClick={()=>analisarDocumento(doc,'Rejeitado')}>Rejeitar / pedir reenvio</button></React.Fragment>}{!['ACEITO','DISPENSADO'].includes(chave)&&<button className="btn btn-g btn-sm" disabled={analisandoDocumento===doc.id} onClick={()=>analisarDocumento(doc,'Dispensado')}>Dispensar</button>}</div>}</div>}):<div className="muted" style={{marginTop:8}}>Nenhum documento solicitado pela Logística.</div>}</div>
      <div className="card" style={{marginTop:10}}><h3>Histórico</h3>{(selecionado.historico||[]).map(h=>{const p=historicoSinistroApresentacao(h);return <div className="linha-item" key={h.id}><span className="grow"><b>{p.acao}</b><span className="muted" style={{display:'block'}}>{dataHoraBRSinistro(h.dataHora)} · {h.usuario||h.perfil}</span>{p.observacao&&<span style={{display:'block',whiteSpace:'pre-wrap'}}>{p.observacao}</span>}</span><HistoricoSinistroTag h={h}/></div>})}</div>
      <div className="card" style={{marginTop:10}}><div className="form-grid"><div><label>Status</label><select disabled={!pode(user,'sinistros.gerenciar')} value={edicao.statusSinistro} onChange={e=>{setEdicao({...edicao,statusSinistro:e.target.value});if(normalizarPerfil(e.target.value)!=='AGUARDANDO_DOCUMENTOS')setSolicitacoesNovas([]);}}>{['Aberto','Aguardando analise','Em atendimento','Aguardando documentos','Encaminhado seguradora','Aguardando orcamento','Em reparo','Aguardando terceiro','Concluido','Cancelado'].map(x=><option key={x}>{x}</option>)}</select></div><div><label>Gravidade</label><select disabled={!pode(user,'sinistros.gerenciar')} value={edicao.gravidade} onChange={e=>setEdicao({...edicao,gravidade:e.target.value})}>{['Baixa','Media','Alta','Critica'].map(x=><option key={x}>{x}</option>)}</select></div><div style={{gridColumn:'1/-1'}}><label>Observação administrativa</label><textarea disabled={!pode(user,'sinistros.gerenciar')} rows="3" value={edicao.observacao} onChange={e=>setEdicao({...edicao,observacao:e.target.value})} placeholder="Registre a orientação ou andamento relevante."/></div></div>
        {pode(user,'sinistros.gerenciar')&&normalizarPerfil(edicao.statusSinistro)==='AGUARDANDO_DOCUMENTOS'&&<div style={{marginTop:12,paddingTop:12,borderTop:'1px solid var(--linha)'}}><div className="row"><div className="grow"><h3>Solicitar documentos ao motorista</h3><div className="muted">Marque somente o que precisa ser enviado nesta etapa. Solicitações já existentes continuam válidas.</div></div></div>{TIPOS_DOCUMENTOS_SINISTRO.map(tipo=>{const atual=solicitacoesNovas.find(x=>x.tipoDocumento===tipo);return <div className="sinistro-solicitacao-opcao" key={tipo}><label style={{display:'flex',alignItems:'center',gap:8,textTransform:'none',letterSpacing:0,color:'var(--tinta)',fontSize:14,margin:0}}><input type="checkbox" style={{width:18,height:18}} checked={Boolean(atual)} onChange={()=>alternarSolicitacao(tipo)}/><b>{tipo}</b></label>{atual&&<React.Fragment><textarea rows="2" style={{marginTop:8}} value={atual.descricaoSolicitacao||''} onChange={e=>atualizarSolicitacao(tipo,'descricaoSolicitacao',e.target.value)} placeholder={tipo==='Outro'?'Descreva exatamente o documento necessário.':'Orientação adicional (opcional): ex. foto frontal e lateral.'}/><label style={{display:'flex',alignItems:'center',gap:8,textTransform:'none',letterSpacing:0,marginTop:7}}><input type="checkbox" style={{width:18,height:18}} checked={atual.obrigatorio!==false} onChange={e=>atualizarSolicitacao(tipo,'obrigatorio',e.target.checked)}/>Obrigatório para encerrar a pendência documental</label></React.Fragment>}</div>})}</div>}
        {pode(user,'sinistros.gerenciar')&&<button className="btn btn-p" style={{width:'100%',marginTop:12}} onClick={salvar}>Salvar andamento</button>}
      </div>
    </Modal>}
  </React.Fragment>;
}


/* ================= SHELL ADM ================= */
function AdmApp({st, setSt, user, onSair, toast}){
  const dados = usarDadosMensais(st);
  const abas=[
    pode(user,'painel_rh.visualizar')&&['rh','Fechamento RH'],
    pode(user,'painel.visualizar')&&['painel','Painel'],
    pode(user,'importar.criar')&&['importar','Importar'],
    pode(user,'contestacoes.visualizar')&&['contest','Contestações'],
    (pode(user,'sinistros.visualizar')||pode(user,'sinistros.configuracoes'))&&['sinistros','Sinistros'],
    (pode(user,'agendamentos.agenda')||pode(user,'agendamentos.monitoramento')||pode(user,'agendamentos.relatorio'))&&['agendamentos','Agendamentos'],
    (pode(user,'checklist.aprovacao')||pode(user,'checklist.perguntas')||pode(user,'checklist.relatorio'))&&['check','Check list'],
    (pode(user,'premiacao.visualizar')||pode(user,'metas.visualizar')||pode(user,'descontos.visualizar'))&&['prem','Premiação'],
    (pode(user,'cadastro.usuarios')||pode(user,'cadastro.tipos_veiculo')||pode(user,'cadastro.veiculos')||pode(user,'cadastro.vinculos')||pode(user,'cadastro.perfis'))&&['cad','Cadastros']
  ].filter(Boolean);
  const [aba,setAba]=useState(abas[0]?.[0]||'');
  const [destino,setDestino]=useState(null);
  const navegarPara=(id,parametros={})=>{
    if(!abas.some(([codigo])=>codigo===id)){
      toast('Seu perfil não possui acesso ao módulo solicitado.');
      return;
    }
    setDestino({id,parametros,chave:Date.now()});
    setAba(id);
  };
  useEffect(()=>{
    if(CONFIG.MODO_DEMONSTRACAO||!pode(user,'checklist.administrar')) return;
    ApiService.admListarChecklists().then(r=>{
      const vindos=(r.itens||r.checklists||[]).map(x=>({
        id:x.protocolo||x.id, idLocal:x.idLocal||'', motorista:x.motoristaNome||'', placa:x.placa||'',
        frota:String(x.tipoChecklist||'').toUpperCase().includes('LEVE')?'leve':'pesada',
        data:String(x.dataHoraLocal||'').slice(0,10),
        status:String(x.status||'PENDENTE').toLowerCase()==='aprovado'?'aprovado':(String(x.status||'').toLowerCase()==='reprovado'?'reprovado':'pendente'),
        motivoReprova:x.motivoReprova||x.motivoReprovacao||'', km:String(x.quilometragem||''), combustivel:'',
        respostas:(x.respostas||[]).map(rr=>({pid:String(rr.idPergunta||''),pergunta:rr.pergunta||'',resp:rr.resposta||'NA',obs:rr.observacao||'',foto:rr.linkFoto||null}))
      }));
      setSt(s=>({...s,checklists:vindos}));
    }).catch(e=>toast('Falha ao carregar checklists do SharePoint: '+e.message));
  },[]);
  return (
    <div className="ashell">
      <div className="atop">
        <div className="atop-in">
          <div className="marca">Bocchi <em>Frota</em></div>
          <nav className="anav grow">
            {abas.map(([id,nome])=><button key={id} className={aba===id?'on':''} onClick={()=>{setDestino(null);setAba(id)}}>{nome}</button>)}
          </nav>
          <button className="btn btn-sm" style={{color:'rgba(255,255,255,.8)'}} onClick={onSair}>Sair</button>
        </div>
      </div>
      <div className="abody">
        {aba==='rh' && <PainelRH st={st} dados={dados} user={user}/>}
        {aba==='painel' && <AdmPainel st={st} dados={dados} user={user} onNavegar={navegarPara}/>}
        {aba==='importar' && <AdmImportar st={st} setSt={setSt} toast={toast}/>}
        {aba==='contest' && <AdmContestacoes st={st} setSt={setSt} toast={toast} foco={destino?.id==='contest'?destino:null}/>}
        {aba==='agendamentos' && <AdmAgendamentos user={user} toast={toast}/>}
        {aba==='sinistros' && <AdmSinistros toast={toast} user={user} foco={destino?.id==='sinistros'?destino:null}/>}
        {aba==='check' && <AdmChecklist st={st} setSt={setSt} toast={toast} user={user} foco={destino?.id==='check'?destino:null}/>}
        {aba==='prem' && <AdmPremiacao st={st} setSt={setSt} toast={toast} user={user}/>}
        {aba==='cad' && <AdmCadastros st={st} setSt={setSt} toast={toast} user={user}/>}
      </div>
    </div>
  );
}

/* ================= APP ================= */
function App(){
  const [st,setSt]=useState(estadoInicial);
  const [user,setUser]=useState(null);
  const [toastMsg,setToastMsg]=useState('');
  const tRef = useRef(null);
  const toast=(m)=>{ setToastMsg(m); clearTimeout(tRef.current); const tempo=Math.max(3800,Math.min(6500,String(m||'').length*45)); tRef.current=setTimeout(()=>setToastMsg(''),tempo); };
  const userAtual = user ? st.usuarios.find(u=>u.id===user.id) || user : null;
  const ehMotorista = temPerfil(userAtual,'MOTORISTA');
  const acessoGestao = [
    'painel_rh.visualizar',
    'painel.visualizar',
    'importar.criar',
    'contestacoes.visualizar',
    'sinistros.visualizar',
    'sinistros.configuracoes',
    'agendamentos.agenda',
    'agendamentos.monitoramento',
    'agendamentos.relatorio',
    'checklist.aprovacao',
    'checklist.perguntas',
    'checklist.relatorio',
    'premiacao.visualizar',
    'metas.visualizar',
    'descontos.visualizar',
    'cadastro.usuarios',
    'cadastro.tipos_veiculo',
    'cadastro.veiculos',
    'cadastro.vinculos',
    'cadastro.perfis'
  ].some(permissao=>pode(userAtual,permissao)) ||
    permissoesDoUsuario(userAtual).has('*');
  return (
    <React.Fragment>
      {!userAtual && <Login st={st} onLogin={setUser}/>}
      {userAtual && ehMotorista && !acessoGestao && <MotoristaApp st={st} setSt={setSt} user={userAtual} onSair={()=>{ApiService.sair();setUser(null);}} toast={toast}/>}
      {userAtual && acessoGestao && <AdmApp st={st} setSt={setSt} user={userAtual} onSair={()=>{ApiService.sair();setUser(null);}} toast={toast}/>}
      {userAtual && !ehMotorista && !acessoGestao && (
        <div className="login-wrap"><div className="login-card">
          <div className="marca">Bocchi <em>Frota</em></div>
          <div className="erro-box">O perfil “{userAtual.perfil||'não informado'}” não está configurado para acesso.</div>
          <button className="btn btn-p" onClick={()=>setUser(null)}>Voltar ao login</button>
        </div></div>
      )}
      <Toast msg={toastMsg}/>
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
