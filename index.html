      const fimMes=new Date(anoMes,mesNumero,0).toISOString().slice(0,10);
      return usuarioValidoPremiacaoPeriodo(u,vinculosRH,inicioMes,fimMes)
        ?{u,competencia,chave:idUsuario(u)+'|'+competencia}
        :null;
    })
    .filter(Boolean)
  );
  const apuracoesPorChave=new Map();
  motoristasPeriodo.forEach(u=>(apuracoesRH[idUsuario(u)]||[]).forEach(a=>{
    const competencia=String(a.competencia||'');
    if(meses.some(m=>competencia===m.slice(3)+'-'+m.slice(0,2))){
      apuracoesPorChave.set(idUsuario(u)+'|'+competencia,a);
    }
  }));
  const itensQuadrimestre=[...apuracoesPorChave.values()];
  const ausentes=competenciasEsperadas.filter(item=>!apuracoesPorChave.has(item.chave));
  const totalEsperado=competenciasEsperadas.length;
  const totalAusentes=ausentes.length;
  const totalEncontrado=totalEsperado-totalAusentes;
  const totalFechados=competenciasEsperadas.filter(item=>
    String(apuracoesPorChave.get(item.chave)?.status||'').toUpperCase()==='FECHADO'
  ).length;
  const haRegistrosFechados=totalFechados>0;
  const quadrimestreFechado=totalEsperado>0&&totalAusentes===0&&totalFechados===totalEsperado;
  const fechadoComPendencias=haRegistrosFechados&&!quadrimestreFechado;
  const periodoBloqueado=haRegistrosFechados;
  const podeFechar=totalEsperado>0&&totalAusentes===0&&
    competenciasEsperadas.every(item=>
      ['CALCULADO','FECHADO'].includes(String(apuracoesPorChave.get(item.chave)?.status||'').toUpperCase()) &&
      apuracoesPorChave.get(item.chave)?.desatualizada!==true
    );
  const podeFecharPeloPerfil=pode(user,'quadrimestre.fechar');
  const podeReabrirPeloPerfil=pode(user,'quadrimestre.reabrir');
  const alterarFechamento=async(acao)=>{
    if(carregandoRH)return;
    if(acao==='FECHAR'&&quadrimestreFechado)return;
    if(acao==='REABRIR'&&!haRegistrosFechados)return;
    if(acao==='FECHAR'&&new Date().toISOString().slice(0,10)<=fimPeriodo){
      setErroRH(`O ${quadrimestre}º quadrimestre de ${ano} termina em ${dataBR(fimPeriodo)}. O fechamento definitivo só será liberado após o encerramento do período.`);
      return;
    }
    if(acao==='FECHAR'&&!podeFechar){
      const amostraAusentes=ausentes.slice(0,6).map(item=>
        `${item.u.nome} — ${mesLabel(item.competencia.slice(5)+'/'+item.competencia.slice(0,4))}`
      );
      const outros=Math.max(0,ausentes.length-amostraAusentes.length);
      setErroRH(totalAusentes
        ?`Não é possível fechar: faltam ${totalAusentes} competência(s) aplicável(is). ${amostraAusentes.join(' | ')}${outros?` | e mais ${outros}`:''}. Atualize as pendências antes de fechar.`
        :'Não é possível fechar: ainda existem apurações pendentes ou com erro.');
      return;
    }
    const pergunta=acao==='FECHAR'
      ?`Fechar TODO o ${quadrimestre}º quadrimestre de ${ano}? Os valores ficarão bloqueados. A seleção de motoristas é usada somente para atualizar apurações.`
      :`Reabrir TODO o ${quadrimestre}º quadrimestre de ${ano}? Somente os registros que ainda estão FECHADOS voltarão para PENDENTE. A seleção de motoristas não altera esta ação.`;
    if(!window.confirm(pergunta))return;
    setCarregandoRH(true);setErroRH('');setSucessoRH('');
    setProgressoRH(acao==='FECHAR'
      ?'Fechando o quadrimestre e bloqueando os lançamentos. Aguarde...'
      :'Reabrindo os registros fechados do quadrimestre. Aguarde...');
    try{
      const resposta=await executarComRetentativaGraph(()=>
        ApiService.alterarStatusQuadrimestre(ano,quadrimestre,acao)
      );
      const totalAlterado=Number(resposta.total||0);
      const atualizadas=await ApiService.obterApuracoesSalvas('','',{somenteSalvas:true});
      const porMotorista={};
      (atualizadas.apuracoes||[]).forEach(item=>{
        const chave=String(item.motoristaId||'');
        const u=usuariosRH.find(x=>idUsuario(x)===chave);
        porMotorista[chave]=porMotorista[chave]||[];
        porMotorista[chave].push(apuracaoSalvaParaTela(item,u?.nome||''));
      });
      setApuracoesRH(porMotorista);
      setSucessoRH(acao==='FECHAR'
        ?`Quadrimestre fechado com sucesso. ${totalAlterado} apuração(ões) foram bloqueadas.`
        :totalAlterado
          ?`Quadrimestre reaberto com sucesso. ${totalAlterado} apuração(ões) fechadas voltaram para PENDENTE.`
          :'O quadrimestre já não possuía registros FECHADOS para reabrir.');
    }catch(e){
      setErroRH('Falha ao alterar o fechamento: '+e.message);
      try{
        const atuais=await ApiService.obterApuracoesSalvas('','',{somenteSalvas:true});
        const porMotorista={};
        (atuais.apuracoes||[]).forEach(item=>{
          const chave=String(item.motoristaId||'');
          const u=usuariosRH.find(x=>idUsuario(x)===chave);
          porMotorista[chave]=porMotorista[chave]||[];
          porMotorista[chave].push(apuracaoSalvaParaTela(item,u?.nome||''));
        });
        setApuracoesRH(porMotorista);
      }catch(_){}
    }
    finally{setCarregandoRH(false);setProgressoRH('')}
  };
  const alternarAuditoria=async(linha)=>{
    const motoristaId=idUsuario(linha.u);
    if(aberto===linha.u.nome){
      setAberto('');
      return;
    }
    setAberto(linha.u.nome);
    const atual=auditoriasRH[motoristaId];
    if(atual?.carregando||atual?.apuracoes)return;
    setAuditoriasRH(v=>({...v,[motoristaId]:{carregando:true,erro:'',apuracoes:null}}));
    try{
      const resposta=await ApiService.obterPremiacaoMotorista(linha.u.nome);
      const porCompetencia={};
      (resposta.apuracoes||[]).forEach(a=>{porCompetencia[String(a.competencia||'')]=a});
      setAuditoriasRH(v=>({...v,[motoristaId]:{
        carregando:false,erro:'',apuracoes:porCompetencia,carregadoEm:agoraISO()
      }}));
    }catch(e){
      setAuditoriasRH(v=>({...v,[motoristaId]:{
        carregando:false,erro:e.message||String(e),apuracoes:null
      }}));
    }
  };
  const linhas=motoristas.map(u=>{
    const chave=idUsuario(u);
    const vindas=Array.isArray(apuracoesRH[chave])?apuracoesRH[chave]:[];
    const stMotorista={...st,apuracoes:vindas};
    const apuracoes=meses.map(m=>apuracaoMes(stMotorista,dados,u.nome,m));
    const acumulado=apuracoes.reduce((s,a)=>s+Number(a.apurado||0),0);
    const competenciasAplicaveis=mesesProcessaveis
      .map(m=>m.slice(3)+'-'+m.slice(0,2))
      .filter(competencia=>{
        const [anoMes,mesNumero]=competencia.split('-').map(Number);
        const inicioMes=`${anoMes}-${String(mesNumero).padStart(2,'0')}-01`;
        const fimMes=new Date(anoMes,mesNumero,0).toISOString().slice(0,10);
        return usuarioValidoPremiacaoPeriodo(u,vinculosRH,inicioMes,fimMes);
      });
    const aplicaveis=vindas.filter(a=>competenciasAplicaveis.includes(String(a.competencia||'')));
    const faltantes=Math.max(0,competenciasAplicaveis.length-aplicaveis.length);
    const statusSalvos=aplicaveis.map(a=>String(a.status||'PENDENTE').toUpperCase());
    const quantidadeFechada=statusSalvos.filter(s=>s==='FECHADO').length;
    const statusMotorista=
      statusSalvos.some(s=>s==='ERRO')?'ERRO':
      faltantes>0?'NÃO CALCULADO':
      aplicaveis.some(a=>a.desatualizada===true)?'NOVAS CARGAS — RECALCULAR':
      statusSalvos.length&&quantidadeFechada===statusSalvos.length?'FECHADO':
      quantidadeFechada>0?'FECHADO PARCIAL':
      statusSalvos.some(s=>s==='PENDENTE')?'PENDENTE':
      statusSalvos.length?'CALCULADO':'AGUARDANDO';
    return {u,apuracoes,acumulado,pagar:Math.max(0,acumulado),statusMotorista};
  });
  const total=linhas.reduce((s,l)=>s+l.pagar,0);
  return <React.Fragment>
    <div className="row" style={{flexWrap:'wrap'}}>
      <div className="grow">
        <h2>Fechamento de premiação — RH</h2>
        <div className="muted">Exibe os últimos valores salvos e identifica cargas alteradas após o cálculo. O recálculo ocorre somente quando solicitado. <b>Versão {CONFIG.VERSAO}.</b></div>
      </div>
      <button
        className={'btn btn-sm '+(!periodoBloqueado&&pode(user,'quadrimestre.atualizar')?'btn-p':'btn-g')}
        disabled={periodoBloqueado||periodoAindaNaoIniciado||carregandoRH||filaRH.rodando||!pode(user,'quadrimestre.atualizar')}
        title={periodoBloqueado?'Reabra o quadrimestre para atualizar as apurações.':periodoAindaNaoIniciado?'Este quadrimestre ainda não começou.':''}
        onClick={recalcularQuadrimestre}>
        {filaRH.rodando?'Atualização em andamento':'Atualizar selecionados'}
      </button>
      <button
        className={'btn btn-sm '+(!periodoBloqueado&&podeFecharPeloPerfil?'btn-p':'btn-g')}
        disabled={periodoBloqueado||periodoAindaNaoIniciado||carregandoRH||filaRH.rodando||!podeFecharPeloPerfil}
        title={!periodoBloqueado&&!podeFechar?'Ao clicar, o sistema informará exatamente quais apurações impedem o fechamento.':''}
        onClick={()=>alterarFechamento('FECHAR')}>
        Fechar quadrimestre
      </button>
      <button
        className={'btn btn-sm '+(haRegistrosFechados&&podeReabrirPeloPerfil?'btn-p':'btn-g')}
        disabled={!haRegistrosFechados||carregandoRH||filaRH.rodando||!podeReabrirPeloPerfil}
        title={!haRegistrosFechados?'Disponível somente após o fechamento do quadrimestre.':''}
        onClick={()=>alterarFechamento('REABRIR')}>
        Reabrir quadrimestre
      </button>
    </div>
    <div className="card">
      <div className="filtros-cadastro" style={{margin:0}}>
        <div><label>Motorista</label><input value={nome} onChange={e=>setNome(e.target.value)} placeholder="Filtrar por nome"/></div>
        <div><label>Ano</label><select value={ano} onChange={e=>setAno(e.target.value)}>{[2025,2026,2027,2028].map(a=><option key={a}>{a}</option>)}</select></div>
        <div><label>Pagamento</label><select value={quadrimestre} onChange={e=>setQuadrimestre(e.target.value)}><option value="1">1º quadrimestre — jan a abr</option><option value="2">2º quadrimestre — mai a ago</option><option value="3">3º quadrimestre — set a dez</option></select></div>
        <div><label>Escopo da atualização</label><select value={modoAtualizacao} disabled={filaRH.rodando} onChange={e=>setModoAtualizacao(e.target.value)}>
          <option value="PENDENTES">Somente pendentes/erros</option>
          <option value="TODOS">Todos os motoristas</option>
          <option value="SELECIONADOS">Motoristas selecionados</option>
        </select></div>
      </div>
      <div className="muted" style={{marginTop:8}}>A seleção de motoristas vale somente para <b>Atualizar selecionados</b>. Fechar e reabrir são ações do quadrimestre inteiro.</div>
    </div>
    {filaRH.rodando&&<div className="aviso-box"><b>Atualização em andamento:</b> {filaRH.atual} de {filaRH.total}{filaRH.motorista?' — '+filaRH.motorista:''}. Você pode navegar pelas outras telas do aplicativo, mas não feche nem atualize esta página.</div>}
    <div className="cards4">
      <div className="card kpi"><div className="l">Motoristas</div><div className="v num">{linhas.length}</div></div>
      <div className="card kpi"><div className="l">Total previsto para folha</div><div className="v num">{brl(total)}</div></div>
      <div className="card kpi"><div className="l">Período</div><div className="v" style={{fontSize:18}}>{quadrimestre}º quadrimestre/{ano}</div></div>
      <div className="card kpi"><div className="l">Status</div><div className="v" style={{fontSize:18}}>{quadrimestreFechado?'FECHADO':fechadoComPendencias?'FECHADO COM PENDÊNCIAS':periodoAindaNaoIniciado?'AGUARDANDO PERÍODO':podeFechar?'PRONTO PARA FECHAR':'EM APURAÇÃO'}</div></div>
    </div>
    {totalAusentes>0&&<div className="aviso-box">
      <b>Conferência do período:</b> {totalEncontrado} de {totalEsperado} competência(s) aplicável(is) possuem apuração salva.
      {' '}Faltam {totalAusentes}. Atualize as pendências antes de fechar o quadrimestre.
      <div className="muted" style={{marginTop:6}}>
        {ausentes.slice(0,8).map(item=>`${item.u.nome} — ${mesLabel(item.competencia.slice(5)+'/'+item.competencia.slice(0,4))}`).join(' | ')}
        {ausentes.length>8?` | e mais ${ausentes.length-8}`:''}
      </div>
    </div>}
    {periodoAindaNaoIniciado&&<div className="aviso-box">
      <b>Período futuro:</b> o {quadrimestre}º quadrimestre de {ano} começa em {mesLabel(meses[0])}. A atualização será liberada quando a primeira competência iniciar.
    </div>}
    {carregandoRH&&!filaRH.rodando&&<div className="aviso-box">{progressoRH||'Consultando as apurações salvas...'}</div>}
    {sucessoRH&&<div className="aviso-box" style={{color:'var(--mata)'}}>{sucessoRH}</div>}
    {erroRH&&<div className="aviso-box" style={{color:'var(--erro)'}}>{erroRH}</div>}
    <div className="card" style={{overflowX:'auto'}}>
      <table>
        <thead><tr>{modoAtualizacao==='SELECIONADOS'&&<th><input type="checkbox" disabled={filaRH.rodando} checked={motoristas.length>0&&motoristas.every(u=>selecionados.includes(idUsuario(u)))} onChange={e=>setSelecionados(e.target.checked?motoristas.map(idUsuario):[])}/></th>}<th>Motorista</th><th>Status</th>{meses.map(m=><th key={m} className="td-num">{mesLabel(m)}</th>)}<th className="td-num">Acumulado</th><th className="td-num">Valor a pagar</th><th></th></tr></thead>
        <tbody>{linhas.map(l=><React.Fragment key={l.u.id||l.u.nome}>
          <tr>
            {modoAtualizacao==='SELECIONADOS'&&<td><input type="checkbox" disabled={filaRH.rodando} checked={selecionados.includes(idUsuario(l.u))} onChange={e=>setSelecionados(v=>e.target.checked?[...new Set([...v,idUsuario(l.u)])]:v.filter(id=>id!==idUsuario(l.u)))}/></td>}
            <td><b>{l.u.nome}</b></td>
            <td><span className={'tag '+(
              l.statusMotorista==='CALCULADO'||l.statusMotorista==='FECHADO'?'tag-ok':
              l.statusMotorista==='ERRO'?'tag-neg':'tag-pend'
            )}>{l.statusMotorista}</span></td>
            {l.apuracoes.map((a,i)=><td key={meses[i]} className="td-num num" style={{color:a.apurado<0?'var(--erro)':'inherit'}}>{brl(a.apurado)}</td>)}
            <td className="td-num num"><b style={{color:l.acumulado<0?'var(--erro)':'var(--mata)'}}>{brl(l.acumulado)}</b></td>
            <td className="td-num num"><b>{brl(l.pagar)}</b></td>
            <td><button className="btn btn-s btn-sm" onClick={()=>alternarAuditoria(l)}>{aberto===l.u.nome?'Fechar':'Auditar'}</button></td>
          </tr>
          {aberto===l.u.nome&&<tr><td colSpan={modoAtualizacao==='SELECIONADOS'?"10":"9"}>
            {auditoriasRH[idUsuario(l.u)]?.carregando&&<div className="aviso-box">Carregando faturamento e memória de cálculo...</div>}
            {auditoriasRH[idUsuario(l.u)]?.erro&&<div className="aviso-box" style={{color:'var(--erro)'}}>Não foi possível carregar a auditoria: {auditoriasRH[idUsuario(l.u)].erro}</div>}
            <div className="cards4">{l.apuracoes.map((salva,i)=>{
              const competencia=meses[i].slice(3)+'-'+meses[i].slice(0,2);
              const aoVivo=auditoriasRH[idUsuario(l.u)]?.apuracoes?.[competencia];
              const a=aoVivo?apuracaoMes({...st,apuracoes:[aoVivo]},dados,l.u.nome,meses[i]):salva;
              return <div className="card" key={meses[i]} style={{boxShadow:'none',border:'1px solid var(--linha)'}}>
              <b>{mesLabel(meses[i])}</b>
              <div className="linha-item"><span>Tipo / meta</span><span>{a.tipo||'—'}{a.meta?' · '+brl(a.meta.meta):''}</span></div>
              <div className="linha-item"><span>Faturamento</span><b>{brl(a.fat)}</b></div>
              <div className="linha-item"><span>Premiação calculada</span><span>{brl(a.prod)}</span></div>
              <div className="linha-item"><span>Descontos</span><span style={{color:a.totDesc<0?'var(--erro)':'inherit'}}>{brl(a.totDesc)}</span></div>
              <div className="linha-item"><span>Apurado do mês</span><b>{brl(a.apurado)}</b></div>
              {aoVivo&&<div className="muted" style={{marginTop:6}}>Dados atuais conferidos na origem.</div>}
            </div>})}</div>
          </td></tr>}
        </React.Fragment>)}</tbody>
      </table>
    </div>
    <div className="aviso-box">O acumulado soma os quatro meses, inclusive resultados negativos. O valor a pagar nunca fica abaixo de R$ 0,00 e o saldo negativo não é levado para o quadrimestre seguinte.</div>
  </React.Fragment>;
}

function AdmPainel({st, dados, user, onNavegar}){
  const [mes,setMes]=useState(MES_ATUAL);
  const [usuariosPainel,setUsuariosPainel]=useState([]);
  const [vinculosPainel,setVinculosPainel]=useState([]);
  const [veiculosPainel,setVeiculosPainel]=useState([]);
  const [cargasPainel,setCargasPainel]=useState([]);
  const [apuracoesPainel,setApuracoesPainel]=useState({});
  const [contestacoesPainel,setContestacoesPainel]=useState([]);
  const [checklistsPainel,setChecklistsPainel]=useState([]);
  const [sinistrosPainel,setSinistrosPainel]=useState([]);
  const [periodoPendencias,setPeriodoPendencias]=useState(MES_ATUAL);
  const [carregandoPainel,setCarregandoPainel]=useState(false);
  const [carregandoCargasPainel,setCarregandoCargasPainel]=useState(false);
  const [erroPainel,setErroPainel]=useState('');
  const [erroCargasPainel,setErroCargasPainel]=useState('');
  const [progressoPainel,setProgressoPainel]=useState('');
  const [revisaoPendencias,setRevisaoPendencias]=useState(0);
  const [revisaoCargas,setRevisaoCargas]=useState(0);
  const [cargasCarregadas,setCargasCarregadas]=useState(false);
  const [fMotorista,setFMotorista]=useState('');
  const [fTipo,setFTipo]=useState('');
  const [fSituacao,setFSituacao]=useState('');
  const [subPainel,setSubPainel]=useState('visao');
  const [motoristaDetalhe,setMotoristaDetalhe]=useState(null);
  const [fBuscaDetalhe,setFBuscaDetalhe]=useState('');
  const [fProdutoDetalhe,setFProdutoDetalhe]=useState('');
  const [fDataInicialDetalhe,setFDataInicialDetalhe]=useState('');
  const [fDataFinalDetalhe,setFDataFinalDetalhe]=useState('');
  const [mesNumero,anoNumero]=String(mes).split('/');
  const competencia=anoNumero+'-'+mesNumero;
  const inicioMes=`${competencia}-01`;
  const fimMes=new Date(Number(anoNumero),Number(mesNumero),0).toISOString().slice(0,10);

  /* Visão geral: carrega somente os módulos de pendência. */
  useEffect(()=>{
    let ativo=true;
    const carregarPendencias=async()=>{
      setCarregandoPainel(true);
      setErroPainel('');
      try{
        if(CONFIG.MODO_DEMONSTRACAO){
          if(!ativo)return;
          setContestacoesPainel(st.contestacoes||[]);
          setChecklistsPainel(st.checklists||[]);
          setSinistrosPainel(st.sinistros||[]);
          return;
        }
        const [contestacoesResp,checklistsResp,sinistrosResp]=await Promise.allSettled([
          pode(user,'contestacoes.visualizar')?ApiService.admListarContestacoes():Promise.resolve({contestacoes:[]}),
          pode(user,'checklist.aprovacao')?ApiService.admListarChecklists():Promise.resolve({checklists:[]}),
          pode(user,'sinistros.visualizar')?ApiService.admListarSinistros():Promise.resolve({sinistros:[]})
        ]);
        if(!ativo)return;
        setContestacoesPainel(contestacoesResp.status==='fulfilled'?(contestacoesResp.value.contestacoes||[]):[]);
        const dadosChecklist=checklistsResp.status==='fulfilled'?(checklistsResp.value.itens||checklistsResp.value.checklists||[]):[];
        setChecklistsPainel(dadosChecklist.map(x=>({
          ...x,
          motorista:x.motorista||x.motoristaNome||'',
          data:String(x.data||x.dataHoraLocal||'').slice(0,10),
          status:String(x.status||'PENDENTE').toLowerCase()
        })));
        setSinistrosPainel(sinistrosResp.status==='fulfilled'?(sinistrosResp.value.sinistros||[]):[]);
      }catch(e){
        if(ativo)setErroPainel('Não foi possível carregar as pendências: '+e.message);
      }finally{
        if(ativo)setCarregandoPainel(false);
      }
    };
    carregarPendencias();
    return()=>{ativo=false};
  },[revisaoPendencias]);

  /* Subtela Cargas: dados pesados somente sob demanda. */
  useEffect(()=>{
    if(revisaoCargas===0)return;
    let ativo=true;
    const carregarCargas=async()=>{
      setCarregandoCargasPainel(true);
      setErroCargasPainel('');
      try{
        if(CONFIG.MODO_DEMONSTRACAO){
          if(!ativo)return;
          setUsuariosPainel(st.usuarios||[]);
          setVinculosPainel(st.vinculos||[]);
          setVeiculosPainel(Object.values(st.frota||{}));
          setCargasPainel((st.cargas||[]).filter(c=>String(c.mes||c.competencia||'')===mes||String(c.competencia||'')===competencia));
          const salvas={};
          (st.apuracoes||[]).filter(a=>String(a.competencia||'')===competencia).forEach(a=>{salvas[String(a.motoristaId||a.usuarioId||'')]=a});
          setApuracoesPainel(salvas);
          setCargasCarregadas(true);
          return;
        }
        const [cadastros,cargasResp,apuracoesResp]=await Promise.all([
          ApiService.admCadastros(),
          ApiService.obterCargas(competencia),
          ApiService.obterApuracoesSalvas(competencia)
        ]);
        if(!ativo)return;
        const usuarios=Array.isArray(cadastros.usuarios)?cadastros.usuarios:[];
        setUsuariosPainel(usuarios);
        setVinculosPainel(Array.isArray(cadastros.vinculos)?cadastros.vinculos:[]);
        setVeiculosPainel(Array.isArray(cadastros.veiculos)?cadastros.veiculos:[]);
        setCargasPainel(Array.isArray(cargasResp.cargas)?cargasResp.cargas:[]);
        const salvas={};
        (apuracoesResp.apuracoes||[]).forEach(item=>{
          const u=usuarios.find(x=>idUsuario(x)===String(item.motoristaId||''));
          salvas[String(item.motoristaId||'')]=apuracaoSalvaParaTela(item,u?.nome||'');
        });
        setApuracoesPainel(salvas);
        setCargasCarregadas(true);
      }catch(e){
        if(ativo)setErroCargasPainel('Não foi possível carregar Cargas: '+e.message);
      }finally{
        if(ativo)setCarregandoCargasPainel(false);
      }
    };
    carregarCargas();
    return()=>{ativo=false};
  },[mes,revisaoCargas]);

  const motoristas=usuariosPainel.filter(u=>usuarioValidoPremiacaoPeriodo(u,vinculosPainel,inicioMes,fimMes));
  const mesFechado=Object.values(apuracoesPainel).some(
    item=>String(item?.status||'').toUpperCase()==='FECHADO'
  );
  const recalcularMes=async()=>{
    if(!motoristas.length||carregandoCargasPainel)return;
    setCarregandoCargasPainel(true);
    setErroCargasPainel('');
    setProgressoPainel('');
    const falhas=[];
    try{
      for(let i=0;i<motoristas.length;i++){
        const u=motoristas[i];
        setProgressoPainel(`Processando ${i+1} de ${motoristas.length}: ${u.nome}`);
        try{
          await executarComRetentativaGraph(async()=>{
            const r=await ApiService.obterPremiacaoMotorista(u.nome);
            const apuracao=(r.apuracoes||[]).find(a=>String(a.competencia||'')===competencia);
            if(apuracao)await ApiService.salvarApuracoes(idUsuario(u),[apuracao]);
          });
        }catch(e){
          falhas.push(`${u.nome}: ${e.message}`);
        }
        if(i<motoristas.length-1)await aguardar(1800);
      }
      setProgressoPainel('Carregando os resultados salvos...');
      const atualizadas=await ApiService.obterApuracoesSalvas(competencia);
      const saida={};
      (atualizadas.apuracoes||[]).forEach(item=>{
        const u=usuariosPainel.find(x=>idUsuario(x)===String(item.motoristaId||''));
        saida[String(item.motoristaId||'')]=apuracaoSalvaParaTela(item,u?.nome||'');
      });
      setApuracoesPainel(saida);
      if(falhas.length)setErroCargasPainel(`${falhas.length} motorista(s) não puderam ser atualizados: ${falhas.join(' | ')}`);
    }catch(e){
      setErroCargasPainel('Falha ao atualizar a apuração mensal: '+e.message);
    }finally{
      setCarregandoCargasPainel(false);
      setProgressoPainel('');
    }
  };
  const veiculoPorPlaca=new Map((veiculosPainel||[]).map(v=>[String(v.placa||'').trim().toUpperCase(),v]));
  const cargasPorMotorista=new Map();
  for(const carga of cargasPainel){
    const uid=String(carga.usuarioId||'');
    const chave=uid||normalizar(carga.motorista||'');
    if(!cargasPorMotorista.has(chave))cargasPorMotorista.set(chave,[]);
    cargasPorMotorista.get(chave).push(carga);
  }
  const pendenciasNome=nome=>{
    const contestacoes=contestacoesPainel.filter(c=>String(c.status||'').toLowerCase()==='pendente'&&String(c.dataCarga||c.data||'').slice(0,7)===competencia&&normalizar(c.motorista)===normalizar(nome)).length;
    const checklists=checklistsPainel.filter(c=>String(c.status||'').toLowerCase()==='pendente'&&String(c.data||'').slice(0,7)===competencia&&normalizar(c.motoristaNome||c.motorista)===normalizar(nome)).length;
    return contestacoes+checklists;
  };
  const linhas=motoristas.map(u=>{
    const uid=idUsuario(u);
    const cargas=(cargasPorMotorista.get(uid)||cargasPorMotorista.get(normalizar(u.nome))||[]).slice().sort((a,b)=>String(b.data||'').localeCompare(String(a.data||'')));
    const peso=cargas.reduce((s,c)=>s+Number(c.peso||c.pesoTon||0),0);
    const frete=cargas.reduce((s,c)=>s+Number(c.freteTotal||0),0);
    const premiacao=cargas.reduce((s,c)=>s+Number(c.valor||c.premiacao||0),0);
    const tipos=[...new Set(cargas.map(c=>{
      const placa=String(c.placa||'').trim().toUpperCase();
      return String(c.tipoVeiculo||veiculoPorPlaca.get(placa)?.tipoModelo||veiculoPorPlaca.get(placa)?.tipo||'').trim();
    }).filter(Boolean))];
    const tipo=tipos.join(' / ');
    const oficial=apuracoesPainel[uid];
    const pendencias=pendenciasNome(u.nome);
    const inconsistencias=cargas.filter(c=>!Number(c.peso||c.pesoTon||0)||!Number(c.freteTotal||0)||!String(c.tipoVeiculo||veiculoPorPlaca.get(String(c.placa||'').trim().toUpperCase())?.tipoModelo||'').trim()).length;
    let situacao='CONFERIDO';
    if(oficial&&String(oficial.status||'').toUpperCase()==='FECHADO')situacao='FECHADO';
    else if(!cargas.length)situacao='SEM_MOVIMENTO';
    else if(inconsistencias>0||!oficial)situacao='DIVERGENTE';
    else if(pendencias>0)situacao='PENDENTE';
    return {u,uid,cargas,peso,frete,premiacao,tipo,pendencias,inconsistencias,oficial,situacao};
  }).sort((a,b)=>b.frete-a.frete||a.u.nome.localeCompare(b.u.nome,'pt-BR'));

  const tipos=[...new Set(linhas.map(l=>l.tipo).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
  const linhasFiltradas=linhas.filter(l=>(!fMotorista||l.uid===fMotorista)&&(!fTipo||l.tipo===fTipo)&&(!fSituacao||l.situacao===fSituacao));
  const totalPeso=linhasFiltradas.reduce((s,l)=>s+l.peso,0);
  const totalFrete=linhasFiltradas.reduce((s,l)=>s+l.frete,0);
  const totalCargas=linhasFiltradas.reduce((s,l)=>s+l.cargas.length,0);
  const totalPendencias=linhasFiltradas.reduce((s,l)=>s+l.pendencias,0);
  const totalDivergencias=linhasFiltradas.filter(l=>l.situacao==='DIVERGENTE').length;
  const competenciaPendencias=periodoPendencias==='TODOS'?'':periodoPendencias.slice(3)+'-'+periodoPendencias.slice(0,2);
  const dentroPeriodo=data=>!competenciaPendencias||String(data||'').slice(0,7)===competenciaPendencias;
  const contestacoesPendentes=contestacoesPainel.filter(c=>
    String(c.status||'').toLowerCase()==='pendente'&&dentroPeriodo(c.dataCarga||c.data)
  );
  const totalContestacoesCarga=contestacoesPendentes.filter(c=>String(c.tipoContestacao||'ERRO_CARGA').toUpperCase()==='ERRO_CARGA').length;
  const totalPBT=contestacoesPendentes.filter(c=>String(c.tipoContestacao||'').toUpperCase()==='DIVERGENCIA_PBT').length;
  const totalChecklist=checklistsPainel.filter(c=>String(c.status||'').toLowerCase()==='pendente'&&dentroPeriodo(c.data||c.dataHoraLocal)).length;
  const totalSinistros=sinistrosPainel.filter(s=>
    !['CONCLUIDO','CANCELADO'].includes(normalizarPerfil(s.statusSinistro))&&
    dentroPeriodo(s.dataHoraOcorrido||s.dataCriacao||s.created)
  ).length;
  const limparFiltros=()=>{setFMotorista('');setFTipo('');setFSituacao('')};
  const rotuloSituacao=s=>({CONFERIDO:'Conferido',PENDENTE:'Pendente',DIVERGENTE:'Divergente',SEM_MOVIMENTO:'Sem movimento',FECHADO:'Fechado'}[s]||s);
  const corSituacao=s=>({CONFERIDO:'var(--mata)',PENDENTE:'var(--colheita-escura)',DIVERGENTE:'var(--erro)',SEM_MOVIMENTO:'var(--texto-suave)',FECHADO:'var(--azul)'}[s]||'inherit');
  const abrirDetalhe=linha=>{
    setMotoristaDetalhe(linha);
    setFBuscaDetalhe('');setFProdutoDetalhe('');setFDataInicialDetalhe('');setFDataFinalDetalhe('');
    setSubPainel('detalhes');
  };
  const abrirModulo=(id,parametros={})=>{
    if(onNavegar)onNavegar(id,parametros);
  };

  const produtosDetalhe=[...new Set((motoristaDetalhe?.cargas||[]).map(c=>String(c.produto||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
  const cargasDetalhe=(motoristaDetalhe?.cargas||[]).filter(c=>{
    const busca=normalizar(fBuscaDetalhe);
    const data=String(c.data||'').slice(0,10);
    const correspondeBusca=!busca||[c.nota,c.numeroNota,c.origem,c.destino,c.placa,c.produto].some(v=>normalizar(v).includes(busca));
    return correspondeBusca&&(!fProdutoDetalhe||String(c.produto||'')===fProdutoDetalhe)&&(!fDataInicialDetalhe||data>=fDataInicialDetalhe)&&(!fDataFinalDetalhe||data<=fDataFinalDetalhe);
  });
  const totaisDetalhe={
    cargas:cargasDetalhe.length,
    peso:cargasDetalhe.reduce((s,c)=>s+Number(c.peso||c.pesoTon||0),0),
    frete:cargasDetalhe.reduce((s,c)=>s+Number(c.freteTotal||0),0),
    premiacao:cargasDetalhe.reduce((s,c)=>s+Number(c.valor||c.premiacao||0),0)
  };

  const Subtabs=()=> <div className="subtabs" style={{marginBottom:12}}>
    <button className={'subtab'+(subPainel==='visao'?' on':'')} onClick={()=>setSubPainel('visao')}>Visão geral</button>
    <button className={'subtab'+(['cargas','detalhes'].includes(subPainel)?' on':'')} onClick={()=>{setSubPainel('cargas');if(!cargasCarregadas)setRevisaoCargas(v=>v+1)}}>Cargas</button>
  </div>;

  const emCargas=['cargas','detalhes'].includes(subPainel);
  const Cabecalho=()=> <div className="row" style={{flexWrap:'wrap',gap:10,alignItems:'flex-end'}}>
    <div className="grow"><h2 style={{marginBottom:2}}>Painel operacional</h2><div className="muted">Pendências que aguardam análise, aprovação ou reprovação</div></div>
    {subPainel==='visao'&&<button className="btn btn-s btn-sm" disabled={carregandoPainel} onClick={()=>setRevisaoPendencias(v=>v+1)}>{carregandoPainel?'Carregando...':'Atualizar pendências'}</button>}
    {emCargas&&<button className="btn btn-s btn-sm" disabled={carregandoCargasPainel} onClick={()=>setRevisaoCargas(v=>v+1)}>{carregandoCargasPainel?'Carregando...':'Recarregar dados'}</button>}
    {emCargas&&pode(user,'apuracao.mensal.atualizar')&&<button
      className="btn btn-p btn-sm"
      disabled={carregandoCargasPainel||mesFechado}
      title={mesFechado?'O quadrimestre está fechado. Reabra-o no Fechamento RH para atualizar este mês.':''}
      onClick={recalcularMes}>
      {carregandoCargasPainel?'Atualizando...':mesFechado?'Quadrimestre fechado':'Atualizar apuração mensal'}
    </button>}
  </div>;

  const FiltrosCargas=()=> <div className="card" style={{marginTop:12}}><div className="form-grid" style={{alignItems:'end'}}>
    <div><label>Competência</label><select value={mes} onChange={e=>setMes(e.target.value)}>{MESES_2026.map(m=><option key={m} value={m}>{mesLabel(m)}</option>)}</select></div>
    <div><label>Motorista</label><select value={fMotorista} onChange={e=>setFMotorista(e.target.value)}><option value="">Todos</option>{linhas.map(l=><option key={l.uid} value={l.uid}>{l.u.nome}</option>)}</select></div>
    <div><label>Tipo de veículo</label><select value={fTipo} onChange={e=>setFTipo(e.target.value)}><option value="">Todos</option>{tipos.map(t=><option key={t} value={t}>{t}</option>)}</select></div>
    <div><label>Situação</label><select value={fSituacao} onChange={e=>setFSituacao(e.target.value)}><option value="">Todas</option>{['CONFERIDO','PENDENTE','DIVERGENTE','SEM_MOVIMENTO','FECHADO'].map(s=><option key={s} value={s}>{rotuloSituacao(s)}</option>)}</select></div>
    <div><button className="btn btn-s" style={{width:'100%'}} onClick={limparFiltros}>Limpar filtros</button></div>
  </div></div>;

  if(subPainel==='detalhes'&&motoristaDetalhe){
    return <React.Fragment>
      <Cabecalho/><Subtabs/>
      <div className="row" style={{marginBottom:12,flexWrap:'wrap'}}>
        <button className="btn btn-s btn-sm" onClick={()=>setSubPainel('cargas')}>← Voltar para cargas</button>
        <div className="grow"><h3 style={{margin:0}}>{motoristaDetalhe.u.nome}</h3><div className="muted">{mesLabel(mes)} · {motoristaDetalhe.tipo||'Tipo não identificado'}</div></div>
      </div>
      <div className="cards4">
        <div className="card kpi"><div className="l">Cargas</div><div className="v num">{totaisDetalhe.cargas}</div></div>
        <div className="card kpi"><div className="l">Peso transportado</div><div className="v num">{brn(totaisDetalhe.peso,1)} t</div></div>
        <div className="card kpi"><div className="l">Frete total</div><div className="v num">{brl(totaisDetalhe.frete)}</div></div>
        <div className="card kpi"><div className="l">Premiação das cargas</div><div className="v num">{brl(totaisDetalhe.premiacao)}</div></div>
      </div>
      <div className="card" style={{marginTop:12}}><div className="form-grid" style={{alignItems:'end'}}>
        <div><label>Buscar NF, rota, placa ou produto</label><input value={fBuscaDetalhe} onChange={e=>setFBuscaDetalhe(e.target.value)} placeholder="Digite para localizar"/></div>
        <div><label>Produto</label><select value={fProdutoDetalhe} onChange={e=>setFProdutoDetalhe(e.target.value)}><option value="">Todos</option>{produtosDetalhe.map(p=><option key={p} value={p}>{p}</option>)}</select></div>
        <div><label>Data inicial</label><input type="date" value={fDataInicialDetalhe} onChange={e=>setFDataInicialDetalhe(e.target.value)}/></div>
        <div><label>Data final</label><input type="date" value={fDataFinalDetalhe} onChange={e=>setFDataFinalDetalhe(e.target.value)}/></div>
      </div></div>
      <div className="card" style={{overflowX:'auto',marginTop:12}}><table>
        <thead><tr><th>Data</th><th>Placa</th><th>Rota entrada</th><th>Rota saída</th><th>Produto</th><th>NF</th><th className="td-num">Peso (t)</th><th className="td-num">Frete</th><th className="td-num">Premiação</th></tr></thead>
        <tbody>{cargasDetalhe.map(c=><tr key={c.id||[c.data,c.placa,c.nota,c.origem,c.destino].join('|')}>
          <td>{dataBR(c.data)}</td><td><b>{c.placa||'—'}</b></td><td>{c.origem||'—'}</td><td>{c.destino||'—'}</td><td>{c.produto||'—'}</td><td>{c.nota||c.numeroNota||'—'}</td><td className="td-num num">{brn(Number(c.peso||c.pesoTon||0),2)}</td><td className="td-num num">{brl(Number(c.freteTotal||0))}</td><td className="td-num num">{brl(Number(c.valor||c.premiacao||0))}</td>
        </tr>)}{!cargasDetalhe.length&&<tr><td colSpan="9" className="muted" style={{textAlign:'center',padding:24}}>Nenhuma carga encontrada para os filtros selecionados.</td></tr>}</tbody>
        <tfoot><tr><td colSpan="6"><b>Total filtrado</b></td><td className="td-num num"><b>{brn(totaisDetalhe.peso,2)}</b></td><td className="td-num num"><b>{brl(totaisDetalhe.frete)}</b></td><td className="td-num num"><b>{brl(totaisDetalhe.premiacao)}</b></td></tr></tfoot>
      </table></div>
    </React.Fragment>;
  }

  return <React.Fragment>
    <Cabecalho/><Subtabs/>
    {subPainel==='visao'&&carregandoPainel&&<div className="aviso-box">Carregando pendências operacionais...</div>}
    {subPainel==='visao'&&erroPainel&&<div className="aviso-box" style={{color:'var(--erro)'}}>{erroPainel}</div>}
    {['cargas','detalhes'].includes(subPainel)&&carregandoCargasPainel&&<div className="aviso-box">{progressoPainel||'Carregando cargas, motoristas e apurações salvas...'}</div>}
    {['cargas','detalhes'].includes(subPainel)&&erroCargasPainel&&<div className="aviso-box" style={{color:'var(--erro)'}}>{erroCargasPainel}</div>}

    {!carregandoPainel&&!erroPainel&&subPainel==='visao'&&<React.Fragment>
      <div className="card" style={{padding:12}}>
        <div className="row" style={{flexWrap:'wrap',alignItems:'end'}}>
          <label style={{minWidth:220}}>Período das pendências
            <select value={periodoPendencias} onChange={e=>setPeriodoPendencias(e.target.value)}>
              <option value="TODOS">Todos os meses</option>
              {MESES_2026.map(m=><option key={m} value={m}>{mesLabel(m)}</option>)}
            </select>
          </label>
          <div className="muted grow">Os cards mostram somente registros aguardando decisão. Clique para abrir diretamente a tela responsável.</div>
        </div>
      </div>
      <div className="cards4">
        <button className="card kpi card-atalho" disabled={!pode(user,'contestacoes.visualizar')} onClick={()=>abrirModulo('contest',{tipoContestacao:'ERRO_CARGA',competencia:competenciaPendencias})}>
          <span className="seta-card">→</span><div className="l">Cargas</div><div className="v num" style={{color:totalContestacoesCarga?'var(--erro)':'var(--mata)'}}>{pode(user,'contestacoes.visualizar')?totalContestacoesCarga:'—'}</div><div className="muted">Contestações de carga pendentes</div>
        </button>
        <button className="card kpi card-atalho" disabled={!pode(user,'contestacoes.visualizar')} onClick={()=>abrirModulo('contest',{tipoContestacao:'DIVERGENCIA_PBT',competencia:competenciaPendencias})}>
          <span className="seta-card">→</span><div className="l">PBT</div><div className="v num" style={{color:totalPBT?'var(--erro)':'var(--mata)'}}>{pode(user,'contestacoes.visualizar')?totalPBT:'—'}</div><div className="muted">Divergências de peso aguardando decisão</div>
        </button>
        <button className="card kpi card-atalho" disabled={!pode(user,'checklist.aprovacao')} onClick={()=>abrirModulo('check',{sub:'aprovar',competencia:competenciaPendencias})}>
          <span className="seta-card">→</span><div className="l">Check list</div><div className="v num" style={{color:totalChecklist?'var(--colheita-escura)':'var(--mata)'}}>{pode(user,'checklist.aprovacao')?totalChecklist:'—'}</div><div className="muted">Aguardando aprovação ou reprovação</div>
        </button>
        <button className="card kpi card-atalho" disabled={!pode(user,'sinistros.visualizar')} onClick={()=>abrirModulo('sinistros',{sub:'gestao',status:'ABERTOS',competencia:competenciaPendencias})}>
          <span className="seta-card">→</span><div className="l">Sinistros</div><div className="v num" style={{color:totalSinistros?'var(--erro)':'var(--mata)'}}>{pode(user,'sinistros.visualizar')?totalSinistros:'—'}</div><div className="muted">Registros em aberto para tratamento</div>
        </button>
      </div>
      <div className="aviso-box">O painel apenas sinaliza o volume pendente e direciona para o módulo de origem. A decisão continua sendo registrada na tela responsável.</div>
    </React.Fragment>}

    {!carregandoCargasPainel&&!erroCargasPainel&&subPainel==='cargas'&&<React.Fragment>
      <FiltrosCargas/>
      <div className="cards4" style={{marginTop:12}}>
        <div className="card kpi"><div className="l">Motoristas</div><div className="v num">{linhasFiltradas.length}</div></div>
        <div className="card kpi"><div className="l">Cargas</div><div className="v num">{totalCargas}</div></div>
        <div className="card kpi"><div className="l">Peso transportado</div><div className="v num">{brn(totalPeso,1)} t</div></div>
        <div className="card kpi"><div className="l">Frete total</div><div className="v num">{brl(totalFrete)}</div></div>
      </div>
      <div className="cards4">
        <button className="card kpi" style={{textAlign:'left',cursor:'pointer',border:fSituacao==='PENDENTE'?'2px solid var(--colheita-escura)':'none'}} onClick={()=>setFSituacao(fSituacao==='PENDENTE'?'':'PENDENTE')}><div className="l">Pendências</div><div className="v num" style={{color:totalPendencias?'var(--colheita-escura)':'var(--mata)'}}>{totalPendencias}</div></button>
        <button className="card kpi" style={{textAlign:'left',cursor:'pointer',border:fSituacao==='DIVERGENTE'?'2px solid var(--erro)':'none'}} onClick={()=>setFSituacao(fSituacao==='DIVERGENTE'?'':'DIVERGENTE')}><div className="l">Divergências</div><div className="v num" style={{color:totalDivergencias?'var(--erro)':'var(--mata)'}}>{totalDivergencias}</div></button>
        <div className="card kpi"><div className="l">Competência</div><div className="v" style={{fontSize:18}}>{mesLabel(mes)}</div></div>
      </div>
      <div className="card" style={{overflowX:'auto'}}><table>
        <thead><tr><th>Motorista</th><th>Tipo</th><th className="td-num">Cargas</th><th className="td-num">Peso (t)</th><th className="td-num">Frete</th><th className="td-num">Premiação</th><th className="td-num">Pendências</th><th>Situação</th><th></th></tr></thead>
        <tbody>{linhasFiltradas.map(l=><tr key={l.uid||l.u.nome}>
          <td><b>{l.u.nome}</b></td><td className="muted">{l.tipo||'—'}</td><td className="td-num num">{l.cargas.length}</td><td className="td-num num">{brn(l.peso,1)}</td><td className="td-num num">{brl(l.frete)}</td><td className="td-num num">{brl(l.premiacao)}</td><td className="td-num num">{l.pendencias||'—'}</td><td><b style={{color:corSituacao(l.situacao)}}>{rotuloSituacao(l.situacao)}</b></td><td><button className="btn btn-s btn-sm" onClick={()=>abrirDetalhe(l)}>Detalhar</button></td>
        </tr>)}{!linhasFiltradas.length&&<tr><td colSpan="9" className="muted" style={{textAlign:'center',padding:24}}>Nenhum motorista encontrado para os filtros selecionados.</td></tr>}</tbody>
      </table></div>
      <div className="aviso-box">O resumo consulta os dados existentes. O detalhamento abre em uma subtela própria para evitar uma página extensa.</div>
    </React.Fragment>}



  </React.Fragment>;
}
/* ================= ADM: IMPORTAÇÃO ================= */
function AdmImportar({st, setSt, toast}){
  const [resumo,setResumo]=useState(null);
  const [competenciasSelecionadas,setCompetenciasSelecionadas]=useState([]);
  const [placaSelecionada,setPlacaSelecionada]=useState('');
  const [dataInicial,setDataInicial]=useState('');
  const [dataFinal,setDataFinal]=useState('');
  const [erro,setErro]=useState('');
  const [lendo,setLendo]=useState(false);
  const [enviando,setEnviando]=useState(false);
  const [progresso,setProgresso]=useState(null);
  const fileRef = useRef(null);

  const processar = (file)=>{
    setErro(''); setResumo(null); setLendo(true);
    const rd = new FileReader();
    rd.onload = ev => {
      try{
        const wb = XLSX.read(ev.target.result, {type:'array', cellDates:true});
        const nomeAba = wb.SheetNames.find(n=>n.toUpperCase().includes('BASE CARGAS FROTA')) ||
                        wb.SheetNames.find(n=>n.toUpperCase().trim()==='CARGAS FROTA');
        if(!nomeAba) throw new Error('Nenhuma aba de cargas encontrada. O arquivo precisa ter a aba "BASE CARGAS FROTA manual" (planilha da premiação) ou "CARGAS FROTA" (relatório).');
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[nomeAba], {defval:null});
        if(!rows.length) throw new Error('A aba "'+nomeAba+'" está vazia.');
        const cols = Object.keys(rows[0]);
        const obrig = ['DATA','PLACA','ORIGEM','DESTINO','PRODUTO','PESO (t)','PREMIAÇÃO'];
        const faltando = obrig.filter(c=>!cols.includes(c));
        if(faltando.length) throw new Error('Colunas não encontradas na aba "'+nomeAba+'": '+faltando.join(', ')+'. Confira se a planilha não foi alterada.');
        const colNota = cols.includes('N° NOTA') ? 'N° NOTA' : (cols.includes('Nº NOTA') ? 'Nº NOTA' : null);

        const novas=[];
        rows.forEach(r=>{
          if(!r['DATA'] || !r['PLACA']) return;
          let dt;
          if(r['DATA'] instanceof Date){
            const d = r['DATA'];
            // usa a data "de calendário" do Excel, imune a fuso horário
            const ut = new Date(d.getTime() + d.getTimezoneOffset()*60000 + 12*3600000);
            dt = ut.getFullYear()+'-'+String(ut.getMonth()+1).padStart(2,'0')+'-'+String(ut.getDate()).padStart(2,'0');
          } else { dt = String(r['DATA']).slice(0,10); }
          novas.push({data:dt, placa:String(r['PLACA']||'').trim().toUpperCase(), origem:r['ORIGEM']||'', destino:r['DESTINO']||'',
            produto:r['PRODUTO']||'', numeroNota:colNota?String(r[colNota]||''):'', valorTon:Number(r['R$/t'])||0,
            pesoTon:Number(r['PESO (t)'])||0, pesoBruto:Number(r['PESO BRUTO'])||0, freteTotal:Number(r['R$ TOTAL'])||0,
            premiacao:Number(r['PREMIAÇÃO'])||0, maiorKM:String(r['MAIOR KM?']||''), distancia:Number(r['DISTANCIA'])||0,
            freteOriginal:Number(r['FRETE ORIGINAL'])||0, diferenca:Number(r['DIFERENÇA'])||0});
        });

        // Descontos da aba "Lançamento", se existir
        const descNovos=[];
        if(wb.SheetNames.includes('Lançamento')){
          const lrows = XLSX.utils.sheet_to_json(wb.Sheets['Lançamento'], {range:6, defval:null});
          const jaTem = new Set(st.descontos.map(d=>[d.motorista,d.mes,d.item,d.valor].join('|')));
          lrows.forEach(r=>{
            const item = r['ITEM CONTROLE'];
            if(!['Multas','Notificação / Advertencia','Check List'].includes(item)) return;
            const v = Number(r['R$']); if(!v) return;
            const d = {motorista:r['MOTORISTA'], mes:String(r['MÊS/ANO']), item, valor:v};
            if(!jaTem.has([d.motorista,d.mes,d.item,d.valor].join('|'))) descNovos.push(d);
          });
        }
        const porCompetencia={};
        novas.forEach(c=>{const comp=c.data.slice(0,7);(porCompetencia[comp]||(porCompetencia[comp]=[])).push(c)});
        const competencias=Object.keys(porCompetencia).sort();
        const atual=new Date().getFullYear()+'-'+String(new Date().getMonth()+1).padStart(2,'0');
        setCompetenciasSelecionadas([competencias.includes(atual)?atual:competencias[competencias.length-1]].filter(Boolean));
        setPlacaSelecionada(''); setDataInicial(''); setDataFinal('');
        setResumo({arquivo:file.name, aba:nomeAba, total:rows.length, novas, porCompetencia, descNovos});
      }catch(e){ setErro(e.message); }
      setLendo(false);
    };
    rd.readAsArrayBuffer(file);
  };
  const competenciasDisponiveis=resumo?Object.keys(resumo.porCompetencia).sort():[];
  const placasDisponiveis=resumo?[...new Set(resumo.novas.map(c=>c.placa))].sort():[];
  const cargasFiltradas=resumo?resumo.novas.filter(c=>
    competenciasSelecionadas.includes(c.data.slice(0,7)) &&
    (!placaSelecionada || c.placa===placaSelecionada) &&
    (!dataInicial || c.data>=dataInicial) && (!dataFinal || c.data<=dataFinal)
  ):[];
  const porCompetenciaFiltrada={};
  cargasFiltradas.forEach(c=>{const comp=c.data.slice(0,7);(porCompetenciaFiltrada[comp]||(porCompetenciaFiltrada[comp]=[])).push(c)});
  const alternarCompetencia=comp=>setCompetenciasSelecionadas(atual=>atual.includes(comp)?atual.filter(x=>x!==comp):[...atual,comp].sort());
  const confirmar=async()=>{
    const TAMANHO_LOTE=25;
    const MAX_TENTATIVAS_LOTE=6;
    if(!cargasFiltradas.length){setErro('Selecione ao menos uma competência com cargas para importar.');return;}
    setEnviando(true); setErro(''); setProgresso({processadas:0,total:cargasFiltradas.length,lote:0,totalLotes:Math.ceil(cargasFiltradas.length/TAMANHO_LOTE)});
    try{
      let novas=0, atualizadas=0, semAlteracao=0, duplicadasRemovidas=0;
      const lotes=[];
      Object.entries(porCompetenciaFiltrada).forEach(([competencia,cargas])=>{
        for(let inicio=0;inicio<cargas.length;inicio+=TAMANHO_LOTE) lotes.push({competencia,cargas:cargas.slice(inicio,inicio+TAMANHO_LOTE)});
      });
      let processadas=0;
      for(let indice=0;indice<lotes.length;indice++){
        const {competencia,cargas}=lotes[indice];
        let r=null;
        for(let tentativa=1;tentativa<=MAX_TENTATIVAS_LOTE;tentativa++){
          try{ r=await ApiService.importarCargas(competencia,cargas); break; }
          catch(e){
            const status=Number(e.status||0);
            const falhaTemporaria=!status || [408,425,429,500,502,503,504].includes(status) || e.name==='AbortError' || /failed to fetch|network|timeout|aborted/i.test(String(e.message||''));
            if(tentativa===MAX_TENTATIVAS_LOTE || !falhaTemporaria){
              e.message='Falha no lote '+(indice+1)+' de '+lotes.length+' ('+competencia+'): '+e.message;
              throw e;
            }
            const espera=Math.min(60000,5000*Math.pow(2,tentativa-1));
            setErro('Instabilidade no lote '+(indice+1)+'. Nova tentativa automática '+(tentativa+1)+' de '+MAX_TENTATIVAS_LOTE+' em '+Math.ceil(espera/1000)+'s...');
            await new Promise(resolve=>setTimeout(resolve,espera));
          }
        }
        setErro('');
        novas+=Number(r.novas??r.gravadas??0);
        atualizadas+=Number(r.atualizadas||0);
        semAlteracao+=Number(r.semAlteracao||0);
        duplicadasRemovidas+=Number(r.duplicadasRemovidas||0);
        processadas+=cargas.length;
        setProgresso({processadas,total:cargasFiltradas.length,lote:indice+1,totalLotes:lotes.length});
        await new Promise(resolve=>setTimeout(resolve,1200));
      }
      /* A importação já foi confirmada lote a lote pela API. Não consulta
         /cargas/me novamente aqui: essa leitura era pesada e podia falhar depois
         de uma importação bem-sucedida, exibindo um falso "Failed to fetch".
         As telas que precisam das cargas consultam a competência necessária ao
         serem abertas. */
      setErro('');
      toast(novas+' novas, '+atualizadas+' atualizadas, '+semAlteracao+' já estavam iguais'+(duplicadasRemovidas?' e '+duplicadasRemovidas+' duplicadas removidas.':'.'));
      setResumo(null); setProgresso(null);
    }catch(e){
      const inc=e.detalhe&&e.detalhe.inconsistencias;
      setErro(e.message+(Array.isArray(inc)&&inc.length?' Primeiros casos: '+inc.slice(0,5).map(x=>x.placa+' em '+dataBR(x.data)+' — '+x.motivo).join('; '):''));
    }finally{setEnviando(false)}
  };
  return (
    <React.Fragment>
      <h2>Importar planilha</h2>
      <div className="card">
        <p style={{marginBottom:12}}>Envie a <b>planilha da premiação (.xlsm)</b> salva no SharePoint — o app lê a aba de cargas e também a aba "Lançamento" (multas, advertências e check list). O relatório de cargas (.xlsx) também é aceito.</p>
        <div className="drop">
          <div style={{fontSize:30, marginBottom:6}}>📥</div>
          {lendo ? 'Lendo o arquivo...' : 'Selecione o arquivo .xlsm ou .xlsx'}
          <div style={{marginTop:12}}>
            <button className="btn btn-p" onClick={()=>fileRef.current.click()}>Escolher arquivo</button>
            <input type="file" accept=".xlsx,.xlsm" style={{display:'none'}} ref={fileRef}
              onChange={e=>{ if(e.target.files[0]) processar(e.target.files[0]); e.target.value=''; }}/>
          </div>
        </div>
        {erro && <div className="erro-box" style={{marginTop:12}}>{erro}</div>}
      </div>
      {resumo &&
        <div className="card">
          <h3>Conferência antes de importar</h3>
          <div className="muted" style={{marginBottom:8}}>{resumo.arquivo} · aba "{resumo.aba}" · motorista e tipo serão resolvidos pela placa e vigência</div>
          <div className="linha-item"><span>Linhas lidas</span><b className="num">{resumo.total}</b></div>
          <div style={{marginTop:14}}><b>Competências a importar</b></div>
          <div className="row" style={{gap:8,marginTop:8,flexWrap:'wrap'}}>
            {competenciasDisponiveis.map(comp=><label key={comp} className="btn btn-s btn-sm" style={{cursor:'pointer',background:competenciasSelecionadas.includes(comp)?'var(--mata)':'white',color:competenciasSelecionadas.includes(comp)?'white':'inherit'}}><input type="checkbox" checked={competenciasSelecionadas.includes(comp)} onChange={()=>alternarCompetencia(comp)} style={{display:'none'}}/>{comp}</label>)}
          </div>
          <div className="row" style={{gap:10,marginTop:12,alignItems:'end',flexWrap:'wrap'}}>
            <label style={{minWidth:170,flex:1}}>Placa (opcional)<select value={placaSelecionada} onChange={e=>setPlacaSelecionada(e.target.value)} disabled={enviando}><option value="">Todas as placas</option>{placasDisponiveis.map(p=><option key={p} value={p}>{p}</option>)}</select></label>
            <label style={{minWidth:145}}>Data inicial<input type="date" value={dataInicial} onChange={e=>setDataInicial(e.target.value)} disabled={enviando}/></label>
            <label style={{minWidth:145}}>Data final<input type="date" value={dataFinal} onChange={e=>setDataFinal(e.target.value)} disabled={enviando}/></label>
          </div>
          <div className="linha-item" style={{marginTop:12}}><span>Cargas que serão comparadas</span><b className="num" style={{color:'var(--mata)'}}>{cargasFiltradas.length}</b></div>
          <div className="linha-item"><span>Competências selecionadas</span><b className="num">{competenciasSelecionadas.join(', ')||'Nenhuma'}</b></div>
          {enviando && progresso && <div className="aviso-box" style={{marginTop:12}}><b>Importando: {progresso.processadas} de {progresso.total} cargas</b><div className="muted">Lote {progresso.lote} de {progresso.totalLotes}. Não feche esta tela.</div><div style={{height:8,background:'#dfe7e2',borderRadius:8,marginTop:8,overflow:'hidden'}}><div style={{height:'100%',width:Math.round((progresso.processadas/Math.max(1,progresso.total))*100)+'%',background:'var(--mata)',transition:'width .2s'}}/></div></div>}
          <div className="row" style={{marginTop:12}}>
            <button className="btn btn-g" onClick={()=>setResumo(null)} disabled={enviando}>Cancelar</button>
            <button className="btn btn-p grow" onClick={confirmar} disabled={enviando||!cargasFiltradas.length}>{enviando?'Importando em lotes...':'Confirmar importação'}</button>
          </div>
        </div>}
      <div className="aviso-box">A planilha completa é lida apenas no navegador. Somente as competências, placa e período selecionados são enviados à API. Cargas iguais são mantidas, alteradas são atualizadas e novas são incluídas.</div>
    </React.Fragment>
  );
}

/* ================= ADM: CONTESTAÇÕES ================= */
function AdmContestacoes({st, setSt, toast, foco}){
  const [filtro,setFiltro]=useState('pendente');
  const [tipoFiltro,setTipoFiltro]=useState('todos');
  const [motoristaFiltro,setMotoristaFiltro]=useState('');
  const [competenciaFiltro,setCompetenciaFiltro]=useState('');
  const [respondendo,setRespondendo]=useState(null);
  const [resposta,setResposta]=useState('');
  const [decisao,setDecisao]=useState('procede');
  const [carregando,setCarregando]=useState(!CONFIG.MODO_DEMONSTRACAO);
  const [salvando,setSalvando]=useState(false);
  useEffect(()=>{
    if(!foco?.chave)return;
    setFiltro('pendente');
    setTipoFiltro(foco.parametros?.tipoContestacao||'todos');
    setMotoristaFiltro('');
    setCompetenciaFiltro(foco.parametros?.competencia||'');
  },[foco?.chave]);
  const motoristasContestacoes=[...new Set((st.contestacoes||[]).map(c=>c.motorista).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
  const lista = (st.contestacoes||[])
    .filter(c=>filtro==='todas'||c.status===filtro)
    .filter(c=>tipoFiltro==='todos'||c.tipoContestacao===tipoFiltro)
    .filter(c=>!motoristaFiltro||c.motorista===motoristaFiltro)
    .filter(c=>!competenciaFiltro||String(c.dataCarga||c.data||'').slice(0,7)===competenciaFiltro)
    .sort((a,b)=>String(b.data||'').localeCompare(String(a.data||'')));
  const cargaDe = id => st.cargas.find(c=>c.id===id);
  const carregar=async()=>{
    if(CONFIG.MODO_DEMONSTRACAO)return;
    setCarregando(true);
    try{
      const r=await ApiService.admListarContestacoes();
      setSt(s=>({...s,contestacoes:Array.isArray(r.contestacoes)?r.contestacoes:[]}));
    }catch(e){toast('Falha ao carregar contestações: '+e.message);}
    finally{setCarregando(false);}
  };
  useEffect(()=>{carregar()},[]);
  const responder=async()=>{
    if(!resposta.trim()){toast('Informe a justificativa da decisão.');return;}
    if(CONFIG.MODO_DEMONSTRACAO){
      setSt(s=>({...s, contestacoes: s.contestacoes.map(c=>c.id===respondendo.id?{...c, status:decisao, resposta:resposta.trim()}:c)}));
      setRespondendo(null); setResposta(''); toast('Contestação respondida.'); return;
    }
    setSalvando(true);
    try{
      const r=await ApiService.admAnalisarContestacao(respondendo.id,decisao,resposta.trim());
      setSt(s=>({...s,contestacoes:s.contestacoes.map(c=>c.id===respondendo.id?r.contestacao:c)}));
      setRespondendo(null);setResposta('');toast('Contestação respondida.');
    }catch(e){toast('Não foi possível concluir a análise: '+e.message);}
    finally{setSalvando(false);}
  };
  return (
    <React.Fragment>
      <div className="row" style={{flexWrap:'wrap'}}>
        <h2 className="grow">Contestações de carga</h2>
        <div className="subtabs">
          {[['pendente','Pendentes'],['procede','Procedem'],['nao_procede','Não procedem'],['todas','Todas']].map(([v,l])=>
            <button key={v} className={'subtab'+(filtro===v?' on':'')} onClick={()=>setFiltro(v)}>{l}</button>)}
        </div>
      </div>
      <div className="card" style={{padding:12}}>
        <div className="row" style={{gap:10,flexWrap:'wrap',alignItems:'end'}}>
          <label style={{minWidth:210,flex:1}}>Tipo de contestação
            <select value={tipoFiltro} onChange={e=>setTipoFiltro(e.target.value)}>
              <option value="todos">Todos os tipos</option>
              <option value="DIVERGENCIA_PBT">Divergência de PBT</option>
              <option value="ERRO_CARGA">Erro de carga</option>
            </select>
          </label>
          <label style={{minWidth:170}}>Competência
            <input type="month" value={competenciaFiltro} onChange={e=>setCompetenciaFiltro(e.target.value)}/>
          </label>
          <label style={{minWidth:210,flex:1}}>Motorista
            <select value={motoristaFiltro} onChange={e=>setMotoristaFiltro(e.target.value)}>
              <option value="">Todos os motoristas</option>
              {motoristasContestacoes.map(nome=><option key={nome} value={nome}>{nome}</option>)}
            </select>
          </label>
          {(tipoFiltro!=='todos'||motoristaFiltro||competenciaFiltro) &&
            <button className="btn btn-g btn-sm" onClick={()=>{setTipoFiltro('todos');setMotoristaFiltro('');setCompetenciaFiltro('');}}>Limpar filtros</button>}
        </div>
      </div>
      {carregando && <div className="card muted">Carregando contestações do SharePoint...</div>}
      {lista.length===0 && <div className="card muted">Nenhuma contestação encontrada com os filtros selecionados.</div>}
      {lista.map(ct=>{
        const c = cargaDe(ct.cargaId);
        return (
          <div className="card" key={ct.id}>
            <div className="row">
              <div className="grow">
                <b>{ct.motorista||'Motorista não informado'}</b>
                <div><span className="tag tag-neutro">{ct.tipoContestacao==='DIVERGENCIA_PBT'?'Divergência de PBT':'Erro de carga'}</span></div>
                {c && <div className="muted">{dataBR(c.data)} · {c.origem} → {c.destino} · NF {c.nota} · {brn(c.peso)} t · {brl(c.valor)}</div>}
                {!c && <div className="muted">{dataBR(ct.dataCarga)} · {ct.tipoVeiculo||'Tipo não informado'} · Peso bruto {brn(Number(ct.pesoCarga||0),0)} kg · Limite considerado {brn(Number(ct.limitePBT||0)+Number(ct.toleranciaPBT||0),0)} kg</div>}
              </div>
              <StatusTag s={ct.status}/>
            </div>
            <div className="row muted" style={{marginTop:8,gap:18,flexWrap:'wrap',fontSize:13}}>
              <span><b>Data do pedido:</b> {dataBR(ct.data)}</span>
              <span><b>Data da carga:</b> {dataBR(ct.dataCarga||(c&&c.data))}</span>
              {ct.status!=='pendente' && <span><b>Analisado por:</b> {ct.analisadoPor||'Não informado'}</span>}
              {ct.status!=='pendente' && <span><b>Data da análise:</b> {dataBR(ct.dataAnalise)||'Não informada'}</span>}
            </div>
            <div style={{marginTop:8, background:'var(--papel)', borderRadius:10, padding:'9px 12px', fontSize:14}}>“{ct.motivo}”</div>
            {ct.resposta && <div className="muted" style={{marginTop:6}}><b>Justificativa da análise:</b> {ct.resposta}</div>}
            {ct.status==='pendente' &&
              <button className="btn btn-s btn-sm" style={{marginTop:10}} onClick={()=>{setRespondendo(ct); setDecisao('procede'); setResposta('');}}>Responder</button>}
          </div>
        );
      })}
      {respondendo &&
        <Modal titulo="Responder contestação" onClose={()=>setRespondendo(null)}>
          <label>Decisão</label>
          <div className="subtabs" style={{marginBottom:12}}>
            <button className={'subtab'+(decisao==='procede'?' on':'')} onClick={()=>setDecisao('procede')}>Procede</button>
            <button className={'subtab'+(decisao==='nao_procede'?' on':'')} onClick={()=>setDecisao('nao_procede')}>Não procede</button>
          </div>
          <label>Resposta ao motorista</label>
          <textarea rows="3" value={resposta} onChange={e=>setResposta(e.target.value)} placeholder={decisao==='procede'?'Ex.: confirmado com o ticket, peso será corrigido na próxima importação.':'Ex.: conferimos com a balança e o valor está correto.'}/>
          <div className="aviso-box" style={{margin:'10px 0'}}>A correção do dado em si é feita no sistema de origem — na próxima importação a carga entra atualizada.</div>
          <button className="btn btn-p" disabled={salvando} style={{width:'100%'}} onClick={responder}>{salvando?'Salvando...':'Enviar resposta'}</button>
        </Modal>}
    </React.Fragment>
  );
}

/* ================= ADM: CHECK LIST (aprovação + perguntas + relatório) ================= */
function AdmChecklist({st, setSt, toast, user, foco}){
  /* ALTERAÇÃO V6: fora do modo demonstração, o painel carrega os registros pela
     API (GET /admin/checklists) em vez de usar apenas o estado do navegador. */
  const [sub,setSub]=useState(pode(user,'checklist.aprovacao')?'aprovar':pode(user,'checklist.perguntas')?'perguntas':'relatorio');
  const [sincronizando,setSincronizando]=useState(false);
  const sincronizar = async ()=>{
    if (CONFIG.MODO_DEMONSTRACAO){ toast('Modo demonstração: dados locais. Configure a URL da Azure Function e desative MODO_DEMONSTRACAO para consultar o SharePoint.'); return; }
    setSincronizando(true);
    try{
      const r = await ApiService.admListarChecklists();
      const vindos = (r.itens||r.checklists||[]).map(x=>({
        id:x.protocolo, idLocal:x.idLocal, motorista:x.motoristaNome, placa:x.placa,
        frota:(x.tipoChecklist==='LEVE'?'leve':'pesada'), data:(x.dataHoraLocal||'').slice(0,10),
        status:(x.status||'PENDENTE').toLowerCase()==='aprovado'?'aprovado':((x.status||'').toLowerCase()==='reprovado'?'reprovado':'pendente'),
        motivoReprova:x.motivoReprovacao||'', km:x.quilometragem, combustivel:'',
        respostas:(x.respostas||[]).map(rr=>({pid:rr.idPergunta, pergunta:rr.pergunta||'', resp:rr.resposta, obs:rr.observacao||'', foto:rr.linkFoto||null}))
      }));
      setSt(s=>({...s, checklists: vindos.length? vindos : s.checklists}));
      toast('Sincronizado: '+vindos.length+' checklist(s) carregado(s) do servidor.');
    }catch(e){ toast('Falha ao sincronizar: '+e.message); }
    finally{ setSincronizando(false); }
  };
  const [ver,setVer]=useState(null);
  const [reprovando,setReprovando]=useState(null);
  const [motivoRep,setMotivoRep]=useState('');
  const [bloquearAoAprovar,setBloquearAoAprovar]=useState(false);
  const [motivoBloqueio,setMotivoBloqueio]=useState('');
  const [veiculosBloqueados,setVeiculosBloqueados]=useState([]);
  const [carregandoBloqueados,setCarregandoBloqueados]=useState(false);
  const [liberandoVeiculo,setLiberandoVeiculo]=useState(null);
  const [observacaoLiberacao,setObservacaoLiberacao]=useState('');
  const perguntaVazia={texto:'', grupo:'Anomalias estéticas', frota:'pesada', frequencia:'Diária', ordem:10, obrigatoria:true, fotoNC:false, ativa:true};
  const [novaPerg,setNovaPerg]=useState(perguntaVazia);
  const [editandoPergunta,setEditandoPergunta]=useState(null);
  const [fFrota,setFFrota]=useState('pesada');
  const [fMot,setFMot]=useState('todos');
  const mesAtualFiltro = String(HOJE||'').slice(0,7);
  const [fMes,setFMes]=useState(mesAtualFiltro);
  const [fPlaca,setFPlaca]=useState('todas');
  const [fStatus,setFStatus]=useState('todos');
  const [fMesAprovacao,setFMesAprovacao]=useState('');
  const [carregandoCatalogo,setCarregandoCatalogo]=useState(false);

  useEffect(()=>{
    if(!foco?.chave||!pode(user,'checklist.aprovacao'))return;
    setSub('aprovar');
    setFMesAprovacao(foco.parametros?.competencia||'');
  },[foco?.chave]);

  const carregarCatalogo = async ()=>{
    setCarregandoCatalogo(true);
    try{
      const r = await ApiService.obterPerguntas('TODAS',{incluirInativas:true});
      const lista = (r.perguntas || []).map(p=>({
        id:String(p.id),
        texto:p.texto || '',
        grupo:p.grupo || 'Outros',
        frota:(p.tipoFrota || '').toLowerCase(),
        frequencia:p.frequencia || 'Diária',
        obrigatoria:p.obrigatoria === true,
        fotoNC:p.fotoObrigatoriaNC === true,
        observacaoObrigatoriaNC:p.observacaoObrigatoriaNC === true,
        ativa:p.ativa !== false,
        ordem:Number(p.ordem || 999)
      })).sort((a,b)=>a.grupo.localeCompare(b.grupo,'pt-BR') || a.ordem-b.ordem);
      setSt(s=>({...s, perguntas:lista}));
    }catch(e){
      toast('Erro ao carregar perguntas do SharePoint: '+e.message);
    }finally{
      setCarregandoCatalogo(false);
    }
  };

  const carregarBloqueados=async()=>{
    setCarregandoBloqueados(true);
    try{const r=await ApiService.admVeiculosBloqueados();setVeiculosBloqueados(r.veiculos||[]);}
    catch(e){toast('Erro ao carregar veículos bloqueados: '+e.message);}
    finally{setCarregandoBloqueados(false);}
  };

  useEffect(()=>{ carregarCatalogo(); sincronizar(); carregarBloqueados(); },[]);

  const pendentesTodos = st.checklists.filter(c=>c.status==='pendente');
  const pendentes = pendentesTodos.filter(c=>!fMesAprovacao||String(c.data||'').slice(0,7)===fMesAprovacao);
  const decidir=async(ck, status, motivo, opcoes={})=>{
    if(status==='aprovado'&&opcoes.bloquearVeiculo===true&&!String(opcoes.motivoBloqueio||'').trim()){toast('Informe o motivo do bloqueio do veículo.');return;}
    if (!CONFIG.MODO_DEMONSTRACAO && ck.id && !String(ck.id).startsWith('DEMO-')){
      try{
        await ApiService.admStatus(ck.id,status==='aprovado'?'APROVADO':'REPROVADO',motivo||'',opcoes);
      }catch(e){toast('Não foi possível gravar a decisão no SharePoint: '+e.message);return;}
    }
    setSt(s=>({...s,checklists:s.checklists.map(x=>x.id===ck.id?{...x,status,motivoReprova:motivo||''}:x)}));
    setVer(null);setReprovando(null);setMotivoRep('');setBloquearAoAprovar(false);setMotivoBloqueio('');
    if(opcoes.bloquearVeiculo===true)await carregarBloqueados();
    toast(status==='aprovado'?(opcoes.bloquearVeiculo?'Check list aprovado e veículo bloqueado.':'Check list aprovado.'):'Check list reprovado — o motorista deverá refazer.');
  };
  const liberarVeiculo=async()=>{
    if(!liberandoVeiculo)return;
    try{await ApiService.admLiberarVeiculo(liberandoVeiculo.itemId,observacaoLiberacao);toast('Veículo liberado com sucesso.');setLiberandoVeiculo(null);setObservacaoLiberacao('');await carregarBloqueados();}
    catch(e){toast('Erro ao liberar veículo: '+e.message);}
  };
  const salvarPergunta = async()=>{
  if(!novaPerg.texto.trim()){
    toast('Escreva o texto da pergunta.');
    return;
  }
  const ordem=Number(novaPerg.ordem);
  if(!Number.isFinite(ordem)||ordem<0){toast('Informe uma ordem numérica igual ou maior que zero.');return;}

  try{
    const dados={
      texto: novaPerg.texto.trim(),
      grupo: novaPerg.grupo,
      tipoFrota: novaPerg.frota.toUpperCase(),
      frequencia: novaPerg.frequencia,
      ordem,
      obrigatoria: novaPerg.obrigatoria,
      fotoObrigatoriaNC: novaPerg.fotoNC,
      observacaoObrigatoriaNC: true,
      ativa: novaPerg.ativa!==false
    };
    if(editandoPergunta) await ApiService.atualizarPergunta(editandoPergunta.id,dados);
    else await ApiService.criarPergunta(dados);

    await carregarCatalogo();
    setNovaPerg({...perguntaVazia,grupo:novaPerg.grupo,frota:novaPerg.frota,frequencia:novaPerg.frequencia,ordem:ordem+10});
    setEditandoPergunta(null);
    toast(editandoPergunta?'Pergunta atualizada no SharePoint.':'Pergunta salva no SharePoint.');
  }catch(e){
    toast('Erro ao salvar pergunta: '+e.message);
  }
};
  const iniciarEdicao=p=>{setEditandoPergunta(p);setNovaPerg({texto:p.texto,grupo:p.grupo,frota:p.frota,frequencia:p.frequencia,ordem:p.ordem,obrigatoria:p.obrigatoria,fotoNC:p.fotoNC,ativa:p.ativa});window.scrollTo({top:0,behavior:'smooth'});};
  const alternarPergunta=async p=>{try{await ApiService.atualizarPergunta(p.id,{texto:p.texto,grupo:p.grupo,tipoFrota:p.frota.toUpperCase(),frequencia:p.frequencia,ordem:p.ordem,obrigatoria:p.obrigatoria,fotoObrigatoriaNC:p.fotoNC,observacaoObrigatoriaNC:p.observacaoObrigatoriaNC,ativa:!p.ativa});await carregarCatalogo();toast(p.ativa?'Pergunta inativada.':'Pergunta reativada.');}catch(e){toast('Erro ao alterar pergunta: '+e.message);}};
  const motoristas = [...new Set(st.checklists.map(c=>c.motorista).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
  const placas = [...new Set(st.checklists.map(c=>c.placa).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
  const relatorio = st.checklists.filter(c=>(!fMes||String(c.data||'').slice(0,7)===fMes) && (fPlaca==='todas'||c.placa===fPlaca) && (fMot==='todos'||c.motorista===fMot) && (fStatus==='todos'||c.status===fStatus)).sort((a,b)=>b.data.localeCompare(a.data));
  const totaisRelatorio={total:relatorio.length,aprovados:relatorio.filter(c=>c.status==='aprovado').length,reprovados:relatorio.filter(c=>c.status==='reprovado').length,pendentes:relatorio.filter(c=>c.status==='pendente').length};
  return (
    <React.Fragment>
      <div className="row" style={{flexWrap:'wrap'}}>
        <h2 className="grow">Check list veicular</h2>
        <button className="btn btn-s btn-sm" disabled={sincronizando} onClick={sincronizar}>{sincronizando?'Sincronizando...':'Sincronizar com servidor'}</button>
        <div className="subtabs">
          {pode(user,'checklist.aprovacao')&&<button className={'subtab'+(sub==='aprovar'?' on':'')} onClick={()=>setSub('aprovar')}>Aprovar ({pendentes.length})</button>}
          {pode(user,'checklist.aprovacao')&&<button className={'subtab'+(sub==='bloqueados'?' on':'')} onClick={()=>{setSub('bloqueados');carregarBloqueados();}}>Veículos bloqueados ({veiculosBloqueados.length})</button>}
          {pode(user,'checklist.perguntas')&&<button className={'subtab'+(sub==='perguntas'?' on':'')} onClick={()=>setSub('perguntas')}>Perguntas</button>}
          {pode(user,'checklist.relatorio')&&<button className={'subtab'+(sub==='relatorio'?' on':'')} onClick={()=>setSub('relatorio')}>Relatório</button>}
        </div>
      </div>

      {sub==='aprovar' && pode(user,'checklist.aprovacao') && <React.Fragment>
        <div className="card" style={{padding:12}}>
          <div className="row" style={{flexWrap:'wrap',alignItems:'end'}}>
            <label style={{minWidth:190}}>Competência
              <input type="month" value={fMesAprovacao} onChange={e=>setFMesAprovacao(e.target.value)}/>
            </label>
            {fMesAprovacao&&<button className="btn btn-g btn-sm" onClick={()=>setFMesAprovacao('')}>Todos os meses</button>}
            <div className="muted grow">{pendentes.length} checklist(s) aguardando decisão no período selecionado.</div>
          </div>
