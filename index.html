<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Bocchi Frota — Portal do Motorista e ADM Logística</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --mata:#173F2E; --folha:#2D6A4F; --folha-clara:#E3EFE7; --colheita:#F2B705; --colheita-escura:#B78900;
  --papel:#F6F5F0; --branco:#FFFFFF; --tinta:#20261F; --cinza:#6B7267; --linha:#DDDDD2;
  --erro:#B3401F; --erro-claro:#F9E8E1; --ok:#2D6A4F; --aviso:#FDF3D7;
  --r:14px; --sombra:0 1px 3px rgba(23,63,46,.10), 0 6px 20px rgba(23,63,46,.06);
}
*{box-sizing:border-box; margin:0}
html,body{height:100%}
body{font-family:'Public Sans',system-ui,sans-serif; background:var(--papel); color:var(--tinta); font-size:15px; line-height:1.45}
h1,h2,h3,h4,.disp{font-family:'Archivo',sans-serif}
button{font-family:inherit; cursor:pointer; border:none; background:none; font-size:inherit}
input,select,textarea{font-family:inherit; font-size:15px; padding:11px 12px; border:1.5px solid var(--linha); border-radius:10px; background:var(--branco); color:var(--tinta); width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--folha); outline-offset:1px; border-color:var(--folha)}
label{font-size:12.5px; font-weight:600; color:var(--cinza); display:block; margin-bottom:5px; text-transform:uppercase; letter-spacing:.04em}
.num{font-variant-numeric:tabular-nums}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 18px; border-radius:11px; font-weight:700; font-family:'Archivo'; letter-spacing:.01em; transition:transform .06s}
.btn:active{transform:scale(.98)}
.btn-p{background:var(--mata); color:#fff}
.btn-s{background:var(--folha-clara); color:var(--mata)}
.btn-d{background:var(--erro); color:#fff}
.btn-g{background:transparent; color:var(--cinza); border:1.5px solid var(--linha)}
.btn:disabled{background:#fff!important; color:#9ca3af!important; border:1.5px solid var(--linha)!important; opacity:1; cursor:not-allowed; transform:none}
.btn-sm{padding:7px 12px; font-size:13px; border-radius:9px}
.card{background:var(--branco); border-radius:var(--r); box-shadow:var(--sombra); padding:16px}
.tag{display:inline-block; padding:3px 9px; border-radius:99px; font-size:11.5px; font-weight:700; letter-spacing:.03em}
.tag-pend{background:var(--aviso); color:#7A5D00}
.tag-ok{background:var(--folha-clara); color:var(--mata)}
.tag-neg{background:var(--erro-claro); color:var(--erro)}
.tag-neutro{background:#EDEDE5; color:var(--cinza)}
.muted{color:var(--cinza); font-size:13px}
.row{display:flex; align-items:center; gap:10px}
.grow{flex:1}
.divider{height:1px; background:var(--linha); margin:12px 0}

/* ---------- LOGIN ---------- */
.login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(160deg, var(--mata) 0%, #0F2B1F 100%); padding:20px}
.login-card{width:100%; max-width:400px; background:var(--branco); border-radius:20px; padding:32px 28px; box-shadow:0 20px 60px rgba(0,0,0,.35)}
.marca{font-family:'Archivo'; font-weight:800; font-size:30px; color:var(--mata); letter-spacing:-.02em}
.marca em{font-style:normal; color:var(--colheita-escura)}
.logo-login{display:block;width:170px;max-width:65%;height:auto;margin:0 auto 16px}
.login-sub{color:var(--cinza); font-size:13.5px; margin:4px 0 24px}
.hint{background:var(--papel); border:1px dashed var(--linha); border-radius:10px; padding:10px 12px; font-size:12.5px; color:var(--cinza); margin-top:16px}

/* ---------- SHELL MOTORISTA ---------- */
.mshell{max-width:520px; margin:0 auto; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; background:var(--papel)}
.mtop{background:var(--mata); color:#fff; padding:14px 16px 12px; position:sticky; top:0; z-index:20}
.mtop .nome{font-family:'Archivo'; font-weight:700; font-size:17px}
.mtop .sub{font-size:12px; opacity:.75}
.chip-placa{background:rgba(255,255,255,.14); border-radius:8px; padding:4px 10px; font-family:'Archivo'; font-weight:700; font-size:13px; letter-spacing:.06em}
.mbody{flex:0 0 auto; padding:14px; display:flex; flex-direction:column; gap:12px}
.mtabs{position:sticky; bottom:0; margin-top:0; width:100%; max-width:520px; background:var(--branco); border-top:1px solid var(--linha); display:flex; z-index:30; padding-bottom:env(safe-area-inset-bottom)}
.mtab{flex:1; padding:10px 4px 12px; text-align:center; color:var(--cinza); font-size:11.5px; font-weight:600}
.mtab .ic{font-size:21px; display:block; margin-bottom:2px}
.mtab.on{color:var(--mata);background:rgba(20,78,58,.09);box-shadow:inset 0 0 0 1.5px rgba(20,78,58,.28);border-radius:14px 14px 0 0;margin:5px 4px 4px;padding:7px 4px 8px}
.mtab.on .ic{transform:translateY(-1px);filter:drop-shadow(0 1px 0 rgba(20,78,58,.15))}
.mtab:focus-visible{outline:3px solid rgba(20,78,58,.28);outline-offset:-3px}
.seletor-mes{display:flex; gap:6px; overflow-x:auto; padding-bottom:2px}
.mes-pill{padding:8px 14px; border-radius:99px; background:var(--branco); border:1.5px solid var(--linha); font-family:'Archivo'; font-weight:700; font-size:13px; white-space:nowrap; color:var(--cinza)}
.mes-pill.on{background:var(--mata); border-color:var(--mata); color:#fff}
.totais{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.totais .card{padding:12px 10px; text-align:center}
.totais .v{font-family:'Archivo'; font-weight:800; font-size:19px; color:var(--mata)}
.totais .l{font-size:11px; color:var(--cinza); font-weight:600; text-transform:uppercase; letter-spacing:.04em}
.carga{padding:12px 14px}
.carga .rota{font-family:'Archivo'; font-weight:700; font-size:14.5px}
.carga .seta{color:var(--colheita-escura)}
.carga .meta-l{font-size:12.5px; color:var(--cinza); margin-top:2px}
.carga .valor{font-family:'Archivo'; font-weight:800; font-size:16px; color:var(--mata)}

/* ---------- RÉGUA DA PREMIAÇÃO (assinatura) ---------- */
.regua-wrap{padding:20px 16px 14px}
.regua{position:relative; height:14px; border-radius:99px; background:#E9E8DF; margin:34px 6px 30px}
.regua .fill{position:absolute; inset:0 auto 0 0; border-radius:99px; background:linear-gradient(90deg, var(--folha), var(--mata)); transition:width .6s cubic-bezier(.2,.8,.2,1)}
.regua .fill.alem{background:linear-gradient(90deg, var(--folha), var(--colheita-escura))}
.marco{position:absolute; top:-9px; bottom:-9px; width:3px; background:var(--tinta); border-radius:2px}
.marco .flag{position:absolute; top:-24px; left:50%; transform:translateX(-50%); font-size:10.5px; font-weight:800; font-family:'Archivo'; letter-spacing:.05em; white-space:nowrap; background:var(--tinta); color:#fff; padding:2px 7px; border-radius:6px}
.marco.meta{background:var(--colheita-escura)}
.marco.meta .flag{background:var(--colheita); color:#5C4500; top:auto; bottom:-26px}
.caminhao{position:absolute; top:-15px; transform:translateX(-50%); font-size:22px; transition:left .6s cubic-bezier(.2,.8,.2,1); filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.grande{font-family:'Archivo'; font-weight:800; font-size:30px; letter-spacing:-.01em}
.linha-item{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--linha); font-size:14px}
.linha-item:last-child{border-bottom:none}
.ocorrencia-linha{display:block}
.ocorrencia-resumo{display:flex; justify-content:space-between; align-items:center; gap:10px}
.ocorrencia-abrir{display:flex; align-items:center; gap:7px; min-width:0; text-align:left; color:inherit}
.ocorrencia-seta{display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px; flex:0 0 24px; border-radius:50%; background:var(--papel); color:var(--mata); font-weight:800; transition:transform .18s}
.ocorrencia-seta.aberta{transform:rotate(180deg)}
.ocorrencia-detalhes{margin-top:8px; padding:10px 12px; border-radius:10px; background:var(--papel); border:1px solid var(--linha)}
.ocorrencia-detalhe{padding:8px 0; border-bottom:1px solid var(--linha)}
.ocorrencia-detalhe:last-child{border-bottom:none}
.ocorrencia-motivo{margin-top:4px; color:var(--tinta); white-space:pre-wrap}
.filtros-cadastro{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px; margin:12px 0}
.filtros-cadastro label{margin-bottom:4px}
.quad-mes{display:flex; justify-content:space-between; align-items:center; padding:10px 12px; border-radius:10px; background:var(--papel); margin-bottom:6px}
.quad-mes.on{outline:2px solid var(--folha)}

/* ---------- CHECKLIST ---------- */
.perg{padding:13px 14px}
.perg .txt{font-weight:600; font-size:14.5px}
.resp-btns{display:flex; gap:8px; margin-top:10px}
.resp-btn{flex:1; padding:10px 6px; border-radius:10px; border:1.5px solid var(--linha); font-weight:700; font-family:'Archivo'; font-size:13px; background:var(--branco); color:var(--cinza)}
.resp-btn.c.on{background:var(--folha-clara); border-color:var(--folha); color:var(--mata)}
.resp-btn.nc.on{background:var(--erro-claro); border-color:var(--erro); color:var(--erro)}
.resp-btn.na.on{background:#EDEDE5; border-color:var(--cinza); color:var(--tinta)}
.foto-thumb{width:74px; height:74px; object-fit:cover; border-radius:10px; border:1.5px solid var(--linha)}
.foto-add{width:74px; height:74px; border-radius:10px; border:1.5px dashed var(--linha); display:flex; align-items:center; justify-content:center; color:var(--cinza); font-size:24px; background:var(--branco)}
.foto-clicavel{cursor:zoom-in; transition:transform .15s, box-shadow .15s}
.foto-clicavel:hover{transform:scale(1.03); box-shadow:0 4px 14px #0002}
.visualizador-foto{position:fixed; inset:0; z-index:3000; background:#111e; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:18px}
.visualizador-foto img{max-width:min(1100px,96vw); max-height:78vh; object-fit:contain; background:#fff; border-radius:10px; box-shadow:0 12px 40px #0008}
.visualizador-foto-acoes{display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; justify-content:center}

/* ---------- SHELL ADM ---------- */
.ashell{min-height:100vh; display:flex; flex-direction:column}
.atop{background:var(--mata); color:#fff; padding:0 18px}
.atop-in{max-width:1180px; margin:0 auto; display:flex; align-items:center; gap:18px; flex-wrap:wrap}
.atop .marca{color:#fff; font-size:20px; padding:14px 0}
.atop .marca em{color:var(--colheita)}
.anav{display:flex; gap:2px; overflow-x:auto}
.anav button{padding:14px 13px; color:rgba(255,255,255,.72); font-weight:600; font-size:13.5px; border-bottom:3px solid transparent; white-space:nowrap}
.anav button.on{color:#fff; border-bottom-color:var(--colheita)}
.abody{flex:1; max-width:1180px; width:100%; margin:0 auto; padding:20px 18px 60px; display:flex; flex-direction:column; gap:14px}
table{width:100%; border-collapse:collapse; font-size:13.5px}
th{text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--cinza); font-weight:700; padding:8px 10px; border-bottom:2px solid var(--linha)}
td{padding:9px 10px; border-bottom:1px solid var(--linha); vertical-align:middle}
tr:last-child td{border-bottom:none}
.td-num{text-align:right}
th.td-num{text-align:right}
.subtabs{display:flex; gap:6px; flex-wrap:wrap}
.subtab{padding:8px 14px; border-radius:99px; border:1.5px solid var(--linha); background:var(--branco); font-weight:700; font-family:'Archivo'; font-size:13px; color:var(--cinza)}
.subtab.on{background:var(--mata); border-color:var(--mata); color:#fff}
.cards4{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px}
.card-atalho{position:relative;text-align:left;cursor:pointer;border:1.5px solid transparent;transition:transform .12s,border-color .12s,box-shadow .12s}
.card-atalho:hover{transform:translateY(-2px);border-color:rgba(45,106,79,.35);box-shadow:0 8px 24px rgba(23,63,46,.12)}
.card-atalho.on{border-color:var(--mata);background:#F2F8F4}
.card-atalho:disabled{cursor:not-allowed;opacity:.55;transform:none}
.card-atalho .seta-card{position:absolute;right:14px;top:14px;color:var(--folha);font-weight:800}
.filtros-operacionais{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
.linha-pendente{background:#FFFCF2}
.linha-confirmada{background:#FBFDFB}
.kpi .l{font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--cinza); font-weight:700}
.kpi .v{font-family:'Archivo'; font-weight:800; font-size:24px; color:var(--mata); margin-top:2px}
.drop{border:2px dashed var(--linha); border-radius:var(--r); padding:34px 20px; text-align:center; color:var(--cinza); background:var(--branco)}
.form-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px}


/* ---------- SINISTROS ---------- */
.sinistro-hero{background:linear-gradient(145deg,#fff5e8,#fff);border:1px solid #f0c98a}
.sinistro-alerta{border-left:5px solid var(--erro);background:var(--erro-claro)}
.sinistro-passos{display:grid;gap:8px;counter-reset:passo}
.sinistro-passo{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:10px;background:var(--papel)}
.sinistro-passo:before{counter-increment:passo;content:counter(passo);display:flex;align-items:center;justify-content:center;width:25px;height:25px;flex:0 0 25px;border-radius:50%;background:var(--mata);color:#fff;font-weight:800}
.sinistro-docs{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.sinistro-doc{padding:9px 11px;border:1px solid var(--linha);border-radius:10px;background:#fff;font-size:13px}
.sinistro-ocorrencia-escolha{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.sinistro-ocorrencia-btn{border:1.5px solid var(--linha);border-radius:12px;background:#fff;padding:11px 10px;text-align:left;font-weight:800;color:var(--tinta);cursor:pointer;min-height:48px}
.sinistro-ocorrencia-btn.on{border-color:var(--mata);background:var(--folha-clara);color:var(--mata);box-shadow:0 0 0 1px rgba(20,78,58,.08)}
.sinistro-ocorrencia-btn.largo{grid-column:1/-1}
.sinistro-orientacao-compacta{display:grid;gap:6px;margin-top:8px}
.sinistro-orientacao-item{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.35}
.sinistro-orientacao-item:before{content:'✓';font-weight:900;color:var(--mata)}
.sinistro-evidencias-compactas{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sinistro-evidencia-chip{font-size:12px;border:1px solid var(--linha);border-radius:999px;padding:5px 8px;background:#fff}
.sinistro-guincho{border-left:5px solid var(--erro);background:var(--erro-claro);padding:10px 12px;border-radius:10px;margin-top:10px;font-size:13px}
.sinistro-bloco-compacto{padding:14px 16px}
@media(max-width:460px){.sinistro-ocorrencia-escolha{grid-template-columns:1fr 1fr}.sinistro-ocorrencia-btn{font-size:13px;padding:10px 9px}.sinistro-bloco-compacto{padding:12px 13px}}
.sinistro-arquivo{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--papel);border-radius:9px;margin-top:6px}
.sinistro-gravidade-CRITICA{background:#7f1d1d;color:#fff}.sinistro-gravidade-ALTA{background:var(--erro-claro);color:var(--erro)}
.sinistro-gravidade-MEDIA{background:var(--aviso);color:#765600}.sinistro-gravidade-BAIXA{background:var(--folha-clara);color:var(--mata)}

.sinistro-galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-top:9px;max-width:100%;overflow:hidden}
.sinistro-galeria-item{min-width:0;border:1px solid var(--linha);border-radius:11px;background:var(--papel);overflow:hidden;text-align:left;color:var(--tinta)}
.sinistro-galeria-foto{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;background:#ecece5}
.sinistro-galeria-legenda{display:block;padding:7px 8px;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sinistro-galeria-doc{display:flex;min-height:96px;align-items:center;justify-content:center;flex-direction:column;gap:6px;padding:9px;text-align:center;text-decoration:none}
.sinistro-galeria-doc .icone{font-size:28px}
.sinistro-galeria-doc .ext{font-size:10px;color:var(--cinza);text-transform:uppercase}
.sinistro-documento-item{max-width:100%;overflow:hidden}
.sinistro-documento-item>div{max-width:100%}
.modal{overflow-x:hidden}
@media(max-width:420px){.sinistro-galeria{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.sinistro-galeria-legenda{font-size:11px;padding:6px}}

.sinistro-status{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:99px;font-size:11.5px;font-weight:800;white-space:nowrap}
.sinistro-status-ABERTO,.sinistro-status-AGUARDANDO_ANALISE{background:#E8F1FB;color:#1D4F91}
.sinistro-status-EM_ATENDIMENTO{background:var(--folha-clara);color:var(--mata)}
.sinistro-status-AGUARDANDO_DOCUMENTOS,.sinistro-status-ACAO_NECESSARIA{background:#FFF0D5;color:#8A5200}
.sinistro-status-DOCUMENTOS_ENVIADOS{background:#E8F1FB;color:#1D4F91}
.sinistro-status-ENCAMINHADO_SEGURADORA,.sinistro-status-EM_REPARO{background:#EFE8FA;color:#623A8A}
.sinistro-status-AGUARDANDO_ORCAMENTO,.sinistro-status-AGUARDANDO_TERCEIRO{background:var(--aviso);color:#765600}
.sinistro-status-CONCLUIDO{background:var(--folha-clara);color:var(--mata)}
.sinistro-status-CANCELADO{background:#EDEDE5;color:var(--cinza)}
.sinistro-registro-card{width:100%;text-align:left;padding:13px 14px;border:1.5px solid var(--linha);border-radius:12px;background:#fff;margin-top:8px;transition:border-color .15s,box-shadow .15s,transform .15s}
.sinistro-registro-card:hover{border-color:rgba(45,106,79,.45);box-shadow:0 5px 16px rgba(23,63,46,.09);transform:translateY(-1px)}
.sinistro-registro-card.acao{border-left:6px solid #D97706;background:#FFFCF5}
.sinistro-documento-item{padding:12px;border:1px solid var(--linha);border-radius:12px;background:#fff;margin-top:9px}
.sinistro-documento-item.rejeitado{border-left:5px solid var(--erro);background:#FFF9F7}
.sinistro-documento-item.pendente{border-left:5px solid #D97706}
.sinistro-documento-item.enviado{border-left:5px solid #3B82F6}
.sinistro-documento-item.aceito{border-left:5px solid var(--folha)}
.sinistro-documento-item.dispensado{border-left:5px solid #9CA3AF;background:#FAFAF8}
.sinistro-doc-status-PENDENTE_DE_ENVIO{background:#FFF0D5;color:#8A5200}
.sinistro-doc-status-ENVIADO{background:#E8F1FB;color:#1D4F91}
.sinistro-doc-status-ACEITO{background:var(--folha-clara);color:var(--mata)}
.sinistro-doc-status-REJEITADO{background:var(--erro-claro);color:var(--erro)}
.sinistro-doc-status-DISPENSADO{background:#EDEDE5;color:var(--cinza)}
.sinistro-solicitacao-opcao{padding:10px 12px;border:1px solid var(--linha);border-radius:11px;background:#fff;margin-top:7px}


/* ---------- AGENDAMENTOS ---------- */

<script type="text/babel" data-presets="react">
const {useState, useMemo, useRef, useEffect} = React;

/* ============================================================================
   ALTERAÇÃO V6 — CONFIG (configuração centralizada)
   >>> AQUI é o ÚNICO lugar onde se configura a URL da API. <<<
   Em produção: MODO_DEMONSTRACAO = false e API_URL = endereço real da Azure Function.
   ========================================================================== */
const CONFIG = {
  // ÚNICO ponto de configuração da integração. Não inserir credenciais neste HTML.
  API_URL: "https://bocchi-frota-api.logistica-951.workers.dev",
MODO_DEMONSTRACAO: false,   // true = funciona offline e não grava no SharePoint
  ORIGEM_PORTAL: "https://bocchi-logistica.github.io",
  SHAREPOINT_ESTRUTURA: {
    listaChecklists: "Checklists_Frota",
    listaRespostas: "Checklists_Respostas",
    bibliotecaFotos: "Fotos_Checklist"
  },
  MAX_FOTO_MB: 2,
  QUALIDADE_FOTO: 0.7,
  FOTO_MAX_PX: 1600,
  TIMEOUT_MS: 90000,
  RETRY_DELAYS_MS: [0, 10000, 30000, 120000],
  MAX_TENTATIVAS: 4,
  VERSAO: '2.8.15'
};

// A versão exibida no login e no título do navegador vem sempre do CONFIG.
document.title = `Bocchi Frota — Portal do Motorista e ADM Logística (${CONFIG.VERSAO})`;

/* ============================================================================
   CONTROLE DE ACESSO — PERFIS + PERMISSÕES
   A API pode devolver `perfis` e `permissoes`. Enquanto a API não devolver
   essas listas, os perfis atuais recebem as permissões-padrão abaixo.
   ========================================================================== */
const normalizarPerfil=p=>String(p||'').trim().toUpperCase()
  .normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[\s/]+/g,'_');
const normalizar=valor=>String(valor||'').trim().toLocaleLowerCase('pt-BR')
  .normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ');
const usuarioConfiguradoPremiacao=u=>
  normalizarPerfil(u?.perfil)==='MOTORISTA' &&
  normalizarPerfil(u?.tipoFrotaAcesso)==='FROTA_PESADA' &&
  u?.acessoPremiacao===true;
const idUsuario=u=>String(u?.itemId||u?.id||u?.usuarioItemId||u?.usuarioId||'');
const vinculoPertenceUsuario=(v,u)=>{
  const id=idUsuario(u);
  const idV=String(v?.usuarioItemId||v?.usuarioId||v?.userItemId||'');
  if(id&&idV) return id===idV;
  return normalizar(v?.usuarioNome||v?.motoristaNome||v?.nomeUsuario)===normalizar(u?.nome);
};
const sobrepoePeriodo=(v,inicio,fim)=>{
  const ini=String(v?.dataInicio||'').slice(0,10)||'0000-01-01';
  const encerrado=String(v?.dataFim||'').slice(0,10);
  const fimV=encerrado||'9999-12-31';
  /*
   * DataInicio é inclusiva e DataFim é exclusiva:
   * - início em 01/03: aplica-se a março;
   * - fim em 01/03: não se aplica a março;
   * - fim em 01/02: não se aplica a fevereiro.
   */
  return ini<=fim&&fimV>inicio;
};
const usuarioValidoPremiacaoPeriodo=(u,vinculos,inicio,fim)=>{
  if(!usuarioConfiguradoPremiacao(u)) return false;
  const lista=(Array.isArray(vinculos)?vinculos:[]).filter(v=>vinculoPertenceUsuario(v,u));
  /* Compatibilidade: enquanto não houver vínculos retornados, preserva os ativos. */
  if(!lista.length) return u?.ativo!==false;
  return lista.some(v=>sobrepoePeriodo(v,inicio,fim));
};
function perfisDoUsuario(user){
  const lista=Array.isArray(user?.perfis)?user.perfis:[user?.perfil];
  return [...new Set(lista.filter(Boolean).map(normalizarPerfil))];
}
function permissoesDoUsuario(user){
  return new Set(Array.isArray(user?.permissoes)?user.permissoes.filter(Boolean):[]);
}
const ACESSO_NOVO_POR_PERMISSAO = {
  'painel_rh.visualizar':{areas:['RH_FECHAMENTO','FECHAMENTO_RH']},
  'painel.visualizar':{areas:['PAINEL']},
  'importar.criar':{areas:['IMPORTACAO'],editar:true},
  'contestacoes.visualizar':{areas:['CONTESTACOES']},
  'sinistros.visualizar':{area:'SINISTROS',subtela:'SINISTROS_GESTAO'},
  'sinistros.gerenciar':{area:'SINISTROS',subtela:'SINISTROS_GESTAO',editar:true},
  'sinistros.configuracoes':{area:'SINISTROS',subtela:'SINISTROS_CONFIGURACOES'},
  'sinistros.configuracoes.editar':{area:'SINISTROS',subtela:'SINISTROS_CONFIGURACOES',editar:true},
  'checklist.aprovacao':{area:'CHECKLIST',subtela:'CHECKLIST_APROVACAO'},
  'checklist.perguntas':{area:'CHECKLIST',subtela:'CHECKLIST_PERGUNTAS'},
  'checklist.relatorio':{area:'CHECKLIST',subtela:'CHECKLIST_RELATORIO'},
  'checklist.administrar':{area:'CHECKLIST',qualquerSubtela:true,editar:true},
  'premiacao.visualizar':{area:'PREMIACAO',subtela:'PREMIACAO_PAINEL'},
  'metas.visualizar':{area:'PREMIACAO',subtela:'PREMIACAO_METAS'},
  'metas.editar':{area:'PREMIACAO',subtela:'PREMIACAO_METAS',editar:true},
  'descontos.visualizar':{area:'PREMIACAO',subtela:'PREMIACAO_DESCONTOS'},
  'descontos.editar':{area:'PREMIACAO',subtela:'PREMIACAO_DESCONTOS',editar:true},
  'cadastro.usuarios':{area:'CADASTROS',subtela:'CADASTRO_USUARIOS'},
  'cadastro.tipos_veiculo':{area:'CADASTROS',subtela:'CADASTRO_TIPOS_VEICULO'},
  'cadastro.veiculos':{area:'CADASTROS',subtela:'CADASTRO_VEICULOS'},
  'cadastro.vinculos':{area:'CADASTROS',subtela:'CADASTRO_VINCULOS'},
  'cadastro.perfis':{area:'CADASTROS',subtela:'CADASTRO_PERFIS'},
  'apuracao.mensal.atualizar':{area:'PAINEL',subtela:'ATUALIZARAPURACAOMENSAL_PAINEL',editar:true},
  'quadrimestre.atualizar':{area:'RH_FECHAMENTO',subtela:'ATUALIZARAPURACOESDOQUADRIMESTRE_RH_FECHAMENTO',editar:true},
  'quadrimestre.fechar':{area:'RH_FECHAMENTO',subtela:'FECHARQUADRIMESTRE_RH_FECHAMENTO',editar:true},
  'quadrimestre.reabrir':{area:'RH_FECHAMENTO',subtela:'REABRIQUADRIMESTRE_RH_FECHAMENTO',editar:true},
  'agendamentos.agenda':{area:'AGENDAMENTOS',subtela:'AGENDAMENTOS_AGENDA_GERAL'},
  'agendamentos.monitoramento':{area:'AGENDAMENTOS',subtela:'AGENDAMENTOS_MONITORAMENTO',editar:true},
  'agendamentos.relatorio':{area:'AGENDAMENTOS',subtela:'AGENDAMENTOS_RELATORIO'},
  'agendamentos.parametros':{area:'AGENDAMENTOS',subtela:'AGENDAMENTOS_PARAMETROS',editar:true}
};
function podePeloPerfilNovo(user,permissao){
  if(!user?.acessosPerfilDefinidos)return false;
  const regra=ACESSO_NOVO_POR_PERMISSAO[permissao];
  if(!regra)return false;
  const areas=new Set((user.areasAcesso||[]).map(normalizarPerfil));
  const subtelas=new Set((user.subtelasAcesso||[]).map(normalizarPerfil));
  const areaOk=regra.areas
    ? regra.areas.some(a=>areas.has(normalizarPerfil(a)))
    : areas.has(normalizarPerfil(regra.area));
  if(!areaOk)return false;
  if(regra.subtela&&!subtelas.has(normalizarPerfil(regra.subtela)))return false;
  if(regra.qualquerSubtela&&![...subtelas].some(s=>s.startsWith(normalizarPerfil(regra.area)+'_')))return false;
  if(regra.editar&&!['GERENCIAR','ADMIN_COMPLETO'].includes(normalizarPerfil(user.nivelAcesso)))return false;
  return true;
}
function pode(user,permissao){
  if(podePeloPerfilNovo(user,permissao)) return true;
  return permissoesDoUsuario(user).has(permissao);
}
function temPerfil(user,perfil){return perfisDoUsuario(user).includes(normalizarPerfil(perfil));}

/* ============================================================================
   ALTERAÇÃO V6 — UTILITÁRIOS
   ========================================================================== */
function gerarUUID(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  // Alternativa quando crypto.randomUUID não existe (navegadores antigos)
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c=>{
    const r = Math.random()*16|0, v = c==='x' ? r : (r&0x3|0x8);
    return v.toString(16);
  });
}
async function fetchComTimeout(url, options = {}, timeout = CONFIG.TIMEOUT_MS){
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), timeout);
  try{
    return await fetch(url, {...options, signal: controller.signal});
  } finally {
    clearTimeout(timer);
  }
}
const agoraISO = ()=> new Date().toISOString();

/* ============================================================================
   ALTERAÇÃO V6 — INDEXEDDB (fila de envio local + rascunho)
   Status locais: RASCUNHO, PENDENTE, ENVIANDO, ENVIADO, ERRO
   ========================================================================== */
const IDB = {
  _db: null,
  abrir(){
    if (this._db) return Promise.resolve(this._db);
    return new Promise((res, rej)=>{
      const rq = indexedDB.open('bocchi_frota', 1);
      rq.onupgradeneeded = e=>{
        const db = e.target.result;
        if(!db.objectStoreNames.contains('fila'))     db.createObjectStore('fila',     {keyPath:'idLocal'});
        if(!db.objectStoreNames.contains('rascunho')) db.createObjectStore('rascunho', {keyPath:'chave'});
      };
      rq.onsuccess = e=>{ this._db = e.target.result; res(this._db); };
      rq.onerror = ()=>rej(rq.error);
    });
  },
  _tx(store, mode, fn){
    return this.abrir().then(db=>new Promise((res, rej)=>{
      const tx = db.transaction(store, mode);
      const st = tx.objectStore(store);
      const out = fn(st);
      tx.oncomplete = ()=>res(out && out.result !== undefined ? out.result : undefined);
      tx.onerror = ()=>rej(tx.error);
    }));
  },
  salvarFila(item){ return this._tx('fila','readwrite', st=>st.put(item)); },
  removerFila(idLocal){ return this._tx('fila','readwrite', st=>st.delete(idLocal)); },

      rq.onerror = ()=>rej(rq.error);
    }));
  },

      rq.onerror = ()=>rej(rq.error);
    }));
  },

  },

/* ============================================================================
   ALTERAÇÃO V6 — FOTOS (compressão antes do envio)
   Redimensiona para no máximo CONFIG.FOTO_MAX_PX no maior lado,
   converte para JPEG qualidade CONFIG.QUALIDADE_FOTO e valida o tamanho.
   Isolada de propósito: se o backend passar a aceitar multipart/form-data,
   basta trocar o retorno de Base64 por Blob aqui.
   ========================================================================== */
function comprimirImagem(arquivo){
  return new Promise((res, rej)=>{
    const url = URL.createObjectURL(arquivo);
    const img = new Image();
    img.onload = ()=>{
      try{
        let {width:w, height:h} = img;
        const maior = Math.max(w, h);
        if (maior > CONFIG.FOTO_MAX_PX){
          const esc = CONFIG.FOTO_MAX_PX / maior;
          w = Math.round(w*esc); h = Math.round(h*esc);
        }
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        const b64 = cv.toDataURL('image/jpeg', CONFIG.QUALIDADE_FOTO);
        URL.revokeObjectURL(url);
        const tamanhoMB = (b64.length*0.75)/1048576; // aprox. bytes do Base64
        if (tamanhoMB > CONFIG.MAX_FOTO_MB){
          rej(new Error('Foto muito grande mesmo após compressão ('+tamanhoMB.toFixed(1)+' MB). Tente uma foto mais próxima do problema.'));
          return;
        }
        res(b64);
      }catch(e){ URL.revokeObjectURL(url); rej(e); }
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error('Não foi possível ler a imagem.')); };
    img.src = url;
  });
}


function otimizarArquivoBinario(arquivo){
  if(!String(arquivo?.type||'').toLowerCase().startsWith('image/')){
    if(Number(arquivo?.size||0)>4*1024*1024) return Promise.reject(new Error('O arquivo '+arquivo.name+' ultrapassa 4 MB.'));
    return Promise.resolve({nome:arquivo.name||'arquivo',tipo:arquivo.type||'application/octet-stream',blob:arquivo,tamanho:Number(arquivo.size||0),chave:[arquivo.name||'arquivo',arquivo.size||0,arquivo.lastModified||0].join('_')});
  }
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(arquivo),img=new Image();
    img.onload=()=>{
      try{
        let w=img.width,h=img.height;const maior=Math.max(w,h);
        if(maior>CONFIG.FOTO_MAX_PX){const esc=CONFIG.FOTO_MAX_PX/maior;w=Math.round(w*esc);h=Math.round(h*esc);}
        const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);
        cv.toBlob(blob=>{
          URL.revokeObjectURL(url);
          if(!blob){reject(new Error('Não foi possível otimizar '+arquivo.name));return;}
          if(blob.size>4*1024*1024){reject(new Error('A foto '+arquivo.name+' ainda ultrapassa 4 MB após a otimização.'));return;}
          resolve({nome:String(arquivo.name||'foto').replace(/\.[^.]+$/,'')+'.jpg',tipo:'image/jpeg',blob,tamanho:blob.size,chave:[arquivo.name||'foto',arquivo.size||0,arquivo.lastModified||0].join('_')});
        },'image/jpeg',CONFIG.QUALIDADE_FOTO);
      }catch(e){URL.revokeObjectURL(url);reject(e);}
    };
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Não foi possível ler '+arquivo.name));};img.src=url;
  });
}

const aguardar = ms => new Promise(resolve => setTimeout(resolve, ms));
function erroTemporarioGraph(error){
  const status=Number(error?.status||0);
  const texto=String(error?.message||'')+' '+JSON.stringify(error?.detalhe||{});
  const falhaRede=/failed to fetch|network|fetch|aborterror|timeout|tempo limite/i.test(texto);
  return falhaRede || ([408,425,429,500,502,503,504].includes(status) &&
    (status!==500 || /429|throttl|temporari|limite|muitas tentativas/i.test(texto)));
}
async function executarComRetentativaGraph(operacao,maxTentativas=4){
  let ultimoErro;
  for(let tentativa=1;tentativa<=maxTentativas;tentativa++){
    try{return await operacao()}
    catch(error){
      ultimoErro=error;
      if(!erroTemporarioGraph(error)||tentativa===maxTentativas)throw error;
      await aguardar(Math.min(30000,4000*Math.pow(2,tentativa-1)));
    }
  }
  throw ultimoErro;
}

/* ============================================================================
   ALTERAÇÃO V6 — FILA DE ENVIO (internet instável)
   O checklist é gravado no IndexedDB ANTES da tentativa de envio.
   Só é marcado como ENVIADO com confirmação real da API (protocolo).
   O mesmo idLocal é mantido em todas as tentativas (idempotência).
   ========================================================================== */
const FilaEnvio = {
  _processando: false,
  ouvintes: new Set(),
  _notificar(){ this.ouvintes.forEach(f=>{ try{f();}catch(e){} }); },
  validar(registro){
    const faltando = [];
    if(!String(registro?.idLocal||'').trim()) faltando.push('identificador');
    if(!String(registro?.motorista?.nome||'').trim()) faltando.push('motorista');
    if(!String(registro?.motorista?.login||'').trim()) faltando.push('login');
    if(!String(registro?.veiculo?.placa||'').trim()) faltando.push('placa');
    if(!Array.isArray(registro?.respostas) || !registro.respostas.length) faltando.push('respostas');
    return faltando;
  },
  _loginDono(registro){
    return String(registro?.donoLogin || registro?.motorista?.login || '').trim().toLowerCase();
  },
  async adicionar(registro){
    const faltando = this.validar(registro);
    if(faltando.length) throw new Error('Não foi possível salvar: faltam '+faltando.join(', ')+'.');
    // Vincula definitivamente o registro ao usuário que o criou neste aparelho.
    // Isso impede que outro motorista veja ou envie a fila após uma troca de login.
    registro.donoLogin = this._loginDono(registro);
    registro.statusEnvio = 'PENDENTE';
    registro.tentativas = 0;
    await IDB.salvarFila(registro);
    this._notificar();
  },
  async pendentes(loginDono){
    const todos = await IDB.listarFila();
    const login = String(loginDono||'').trim().toLowerCase();
    if(!login) return [];
    return todos.filter(x=>x.statusEnvio!=='ENVIADO' && this._loginDono(x)===login);
  },
  async sanear(loginDono){
    const login = String(loginDono||'').trim().toLowerCase();
    if(!login) return {removidos:0};
    const todos = await IDB.listarFila();
    let removidos = 0;
    for(const item of todos){
      if(this._loginDono(item)!==login) continue;
      const irrecuperavel = this.validar(item).length>0 || item.statusEnvio==='DADOS_INCOMPLETOS';
      if(irrecuperavel){ await IDB.removerFila(item.idLocal); removidos++; }
    }
    if(removidos) this._notificar();
    return {removidos};
  },
  async processar(toast, loginDono){
    const login = String(loginDono||'').trim().toLowerCase();
    if(!login) return;
    // Um temporizador de uma sessão anterior pode disparar depois da troca de
    // motorista. Nesse caso ele é encerrado sem acessar nem enviar o registro.
    if(!CONFIG.MODO_DEMONSTRACAO && ApiService.loginAtual!==login) return;
    if (this._processando) return; // evita tentativas simultâneas
    this._processando = true;
    try{
      const fila = await this.pendentes(login);
      for (const item of fila){
        const faltando = this.validar(item);
        if(faltando.length){
          item.statusEnvio = 'DADOS_INCOMPLETOS';
          item.ultimoErro = 'Registro antigo incompleto: faltam '+faltando.join(', ')+'. Exclua e refaça o checklist.';
          await IDB.salvarFila(item); this._notificar();
          continue;
        }
        item.statusEnvio = 'ENVIANDO';
        await IDB.salvarFila(item); this._notificar();
        try{
          const resp = await ApiService.enviarChecklist(item);
          if (resp && resp.sucesso===true && resp.protocolo){
            item.statusEnvio = 'ENVIADO';
            item.protocolo = resp.protocolo;
            item.dataHoraRecebimento = resp.dataHoraRecebimento;
            await IDB.salvarFila(item);
            if (toast) toast('Checklist enviado. Protocolo: '+resp.protocolo);
          } else {
            throw new Error((resp && resp.mensagem) || 'Resposta inválida da API');
          }
        }catch(e){
          item.tentativas = (item.tentativas||0)+1;
          item.ultimoErro = e.message;
          item.statusEnvio = item.tentativas >= CONFIG.MAX_TENTATIVAS ? 'ERRO' : 'PENDENTE';
          await IDB.salvarFila(item);
          // Agenda nova tentativa com intervalo crescente
          if (item.statusEnvio==='PENDENTE'){
            const delay = CONFIG.RETRY_DELAYS_MS[Math.min(item.tentativas, CONFIG.RETRY_DELAYS_MS.length-1)];
            setTimeout(()=>this.processar(toast, login), delay);
          }
        }
        this._notificar();
      }
    } finally {
      this._processando = false;
    }
  }
};

/* Régua da política POL 4.1.1 */
function calcProdutividade(fat, meta){
  if(!meta || !fat || fat < meta.start) return 0;
  if(fat < meta.meta) return meta.pctStart/100 * (fat - meta.start);
  return Math.min(meta.valorMeta + meta.pctMeta/100 * (fat - meta.meta), meta.teto);
}
function metaDoTipo(metas, tipo, mes){
  // mes 'MM/AAAA' -> usa vigência
  const ref = mes ? mes.slice(3)+'-'+mes.slice(0,2)+'-15' : '2026-06-15';
  const tipoBusca=chaveTipo(tipo);
  return metas.find(m => chaveTipo(m.tipo)===tipoBusca && m.vigIni<=ref && m.vigFim>=ref) ||
         metas.find(m=>chaveTipo(m.tipo)===tipoBusca);
}

/* Faturamento por motorista/mês: resumos (jan–abr) + cargas detalhadas (mai em diante) */
function usarDadosMensais(st){
  return useMemo(()=>{
    const map = {}; // mot -> mes -> {fat,n,peso,detalhe:boolean}
    st.resumos.forEach(r=>{
      map[r.m] = map[r.m] || {};
      map[r.m][r.mes] = {fat:r.fat, n:r.n, peso:r.peso, detalhe:false};
    });
    st.cargas.forEach(c=>{
      const mes = mesDaData(c.data);
      map[c.motorista] = map[c.motorista] || {};
      const cur = map[c.motorista][mes] || {fat:0,n:0,peso:0,detalhe:true};
      cur.fat += c.valor; cur.n += 1; cur.peso += c.peso; cur.detalhe = true;
      map[c.motorista][mes] = cur;
    });
    return map;
  },[st.resumos, st.cargas]);
}
function apuracaoMes(st, dados, motNome, mes){
  const calculada=(st.apuracoes||[]).find(a=>
    a.mes===mes &&
    (!a.motoristaNome || normalizar(a.motoristaNome)===normalizar(motNome))
  );
  if(calculada){
    return {
      fat:Number(calculada.faturamento ?? calculada.realizadoInformado ?? calculada.realizado ?? 0),
      realizadoElegivel:Number(calculada.realizadoElegivel ?? calculada.realizado ?? 0),
      prod:Number(calculada.premioBruto||0),
      descs:Array.isArray(calculada.descontos)?calculada.descontos:[],
      totDesc:Number(calculada.totalDescontos||0),
      apurado:Number(calculada.apurado||0),
      meta:calculada.meta||null,
      tipo:String(calculada.tipoVeiculo||""),
      temDados:Number(calculada.quantidadeCargas||0)>0,
      nCargas:Number(calculada.quantidadeCargas||0),
      peso:Number(calculada.pesoTon||0),
      detalhe:true
      ,detalhesVigencia:Array.isArray(calculada.detalhesVigencia)?calculada.detalhesVigencia:[]
      ,inconsistencias:Array.isArray(calculada.inconsistencias)?calculada.inconsistencias:[]
      ,nCargasValidas:Number(calculada.quantidadeCargasValidas||0)
    };
  }
  const u = st.usuarios.find(x=>x.nome===motNome);
  const placa = Object.values(st.frota).find(f=>f.motorista===motNome && f.frota!=='leve');
  const cargaComTipo = [...st.cargas].reverse().find(c=>c.motorista===motNome && c.tipoVeiculo);
  const tipo = cargaComTipo ? cargaComTipo.tipoVeiculo : (placa ? placa.tipo : null);
  const meta = tipo ? metaDoTipo(st.metas, tipo, mes) : null;
  const d = (dados[motNome]||{})[mes];
  const fat = d ? d.fat : 0;
  const prod = calcProdutividade(fat, meta);
  const descs = st.descontos.filter(x=>x.motorista===motNome && x.mes===mes);
  const totDesc = descs.reduce((s,x)=>s+x.valor,0);
  return {fat, prod, descs, totDesc, apurado: prod + totDesc, meta, tipo, temDados: !!d, nCargas: d?d.n:0, peso: d?d.peso:0, detalhe: d?d.detalhe:false};
}

function historicoSinistroApresentacao(h){
  if(h?.acaoExibicao||h?.tipoEvento){
    return {
      tipoEvento:h.tipoEvento||'STATUS',
      acao:h.acaoExibicao||h.acao||'Atualização',
      observacao:h.observacaoExibicao!==undefined?h.observacaoExibicao:(h.observacao||''),
      statusEvento:h.statusEvento||'',
      exibirStatusSinistro:h.exibirStatusSinistro!==false
    };
  }
  const obs=String(h?.observacao||'').trim();
  const acao=String(h?.acao||'').trim();
  const tirar=prefixo=>obs.replace(new RegExp('^'+prefixo+'\\s*:\\s*','i'),'').trim();
  if(/^Documento reenviado\s*:/i.test(obs))return {tipoEvento:'DOCUMENTO_REENVIADO',acao:'Documento reenviado',observacao:tirar('Documento reenviado'),statusEvento:'Enviado',exibirStatusSinistro:false};
  if(/^Documento enviado\s*:/i.test(obs))return {tipoEvento:'DOCUMENTO_ENVIADO',acao:'Documento enviado',observacao:tirar('Documento enviado'),statusEvento:'Enviado',exibirStatusSinistro:false};
  if(/^Documento aceito\s*:/i.test(obs))return {tipoEvento:'DOCUMENTO_ACEITO',acao:'Documento aceito',observacao:tirar('Documento aceito'),statusEvento:'Aceito',exibirStatusSinistro:false};
  if(/^Documento rejeitado\s*:/i.test(obs))return {tipoEvento:'DOCUMENTO_REJEITADO',acao:'Documento rejeitado',observacao:tirar('Documento rejeitado'),statusEvento:'Rejeitado',exibirStatusSinistro:false};
  if(/^Documento dispensado\s*:/i.test(obs))return {tipoEvento:'DOCUMENTO_DISPENSADO',acao:'Documento dispensado',observacao:tirar('Documento dispensado'),statusEvento:'Dispensado',exibirStatusSinistro:false};
  const marcador='Documentos solicitados:';
  const pos=obs.toLocaleLowerCase('pt-BR').indexOf(marcador.toLocaleLowerCase('pt-BR'));
  if(pos>=0){const antes=obs.slice(0,pos).trim().replace(/[.\s]+$/g,'');const docs=obs.slice(pos+marcador.length).trim();return {tipoEvento:'DOCUMENTOS_SOLICITADOS',acao:'Documentos solicitados',observacao:[antes,docs].filter(Boolean).join(antes&&docs?' — ':''),statusEvento:'Pendente de envio',exibirStatusSinistro:false};}
  if(normalizar(acao)===normalizar('E-mail enviado'))return {tipoEvento:'EMAIL_ENVIADO',acao:'E-mail enviado',observacao:obs,statusEvento:'Enviado',exibirStatusSinistro:false};
  return {tipoEvento:'STATUS',acao:acao||'Atualização',observacao:obs,statusEvento:'',exibirStatusSinistro:true};
}

function Login({st, onLogin}){
  const [login,setLogin]=useState(''); const [senha,setSenha]=useState(''); const [erro,setErro]=useState('');
  const [senhaLoginVisivel,setSenhaLoginVisivel]=useState(false);
  /* ALTERAÇÃO V6: em produção a autenticação é feita pelo endpoint POST /auth/login
     da API (o token fica só em memória; a senha nunca é gravada no navegador).
     O modo demonstração usa a base local e está claramente separado. */
  const [carregando,setCarregando]=useState(false);
  const entrar = async ()=>{
    setErro('');
    if (CONFIG.MODO_DEMONSTRACAO){
      const u = st.usuarios.find(x=>x.login===login.trim().toLowerCase());
      if(!u){ setErro('Usuário ou senha incorretos.'); return; }
      onLogin(u);
      return;
    }
    setCarregando(true);
    try{
      const r = await ApiService.login(login.trim().toLowerCase(), senha);
      if(!r || !r.sucesso){ setErro('Usuário ou senha incorretos.'); return; }
     onLogin({
  id: 'api' + r.motorista.id,
  nome: r.motorista.nome,
  login: r.motorista.login || login.trim().toLowerCase(),
  perfil: r.motorista.perfil || 'motorista',
  perfis: Array.isArray(r.motorista.perfis) ? r.motorista.perfis : undefined,
  permissoes: Array.isArray(r.motorista.permissoes) ? r.motorista.permissoes : undefined,
  permissoesDefinidas: r.motorista.permissoesDefinidas,
  areasAcesso: Array.isArray(r.motorista.areasAcesso) ? r.motorista.areasAcesso : [],
  subtelasAcesso: Array.isArray(r.motorista.subtelasAcesso) ? r.motorista.subtelasAcesso : [],
  acessosPerfilDefinidos: r.motorista.acessosPerfilDefinidos === true,
  nivelAcesso: r.motorista.nivelAcesso || 'SOMENTE_VISUALIZAR',
  tipoFrotaAcesso: r.motorista.tipoFrotaAcesso || '',
  perms: r.motorista.perms || {
    cargas: true,
    premiacao: true,
    checklist: true
  },
  veiculoPadrao: r.motorista.veiculoPadrao || '',
  acessos: r.motorista.acessos || {}
});
    }catch(e){
      setErro('Não foi possível conectar ao servidor. Verifique a internet e tente novamente.');
    }finally{ setCarregando(false); }
  };
  return (
    <div className="login-wrap">
      <div className="login-card">
        <img src={LOGO} className="logo-login" alt="Bocchi Agrobios"/>
        <div className="login-sub">Portal do motorista e ADM logística — Versão {CONFIG.VERSAO} — Edson.B</div>
        <div style={{display:'flex',flexDirection:'column',gap:12}}>
          <div><label>Usuário</label><input value={login} onChange={e=>setLogin(e.target.value)} placeholder="ex.: adelir" autoCapitalize="none"/></div>
          <div>
            <label>Senha</label>
            <div className="row" style={{gap:8}}>
              <input className="grow" type={senhaLoginVisivel?'text':'password'} value={senha} onChange={e=>setSenha(e.target.value)} onKeyDown={e=>e.key==='Enter'&&entrar()} placeholder="••••" autoComplete="current-password"/>
              <button type="button" className="btn btn-s btn-sm" onClick={()=>setSenhaLoginVisivel(v=>!v)} title={senhaLoginVisivel?'Ocultar senha':'Visualizar senha'} aria-label={senhaLoginVisivel?'Ocultar senha':'Visualizar senha'} style={{minWidth:72}}>{senhaLoginVisivel?'Ocultar':'Ver'}</button>
            </div>
          </div>
          {erro && <div className="erro-box">{erro}</div>}
          <button className="btn btn-p" disabled={carregando} onClick={entrar}>{carregando?'Entrando...':'Entrar'}</button>
        </div>
        {CONFIG.MODO_DEMONSTRACAO && <div className="hint">
          <b>MODO DEMONSTRAÇÃO ativo</b> — selecione um usuário cadastrado para navegar sem gravar no SharePoint.
        </div>}
      </div>
    </div>
  );
}

function TelaCargas({st, setSt, user, dados, toast}){
  const [mes,setMes]=useState(MES_ATUAL);
  const [contestar,setContestar]=useState(null);
  const [detalheContestacao,setDetalheContestacao]=useState('');
  const [motivo,setMotivo]=useState('');
  const [tipoContestacao,setTipoContestacao]=useState('ERRO_CARGA');
  const [opcoesContestacao,setOpcoesContestacao]=useState(['ERRO_CARGA']);
  const [carregandoOpcoes,setCarregandoOpcoes]=useState(false);
  const [enviandoContestacao,setEnviandoContestacao]=useState(false);
  const ap = apuracaoMes(st, dados, user.nome, mes);
  const cargasMes = st.cargas.filter(c=>c.motorista===user.nome && mesDaData(c.data)===mes)

    setCarregandoOpcoes(true);
    try{
      const r=await ApiService.obterOpcoesContestacao(carga.id);
      const opcoes=Array.isArray(r.opcoes)?r.opcoes:['ERRO_CARGA'];
      setOpcoesContestacao(opcoes);
      if(carga.pbtForaFaixa&&opcoes.includes('DIVERGENCIA_PBT'))setTipoContestacao('DIVERGENCIA_PBT');

      toast('Não foi possível validar esta carga: '+e.message);

  const enviar=async()=>{

    setEnviandoContestacao(true);
    try{
      const r=await ApiService.criarContestacao(contestar.id,tipoContestacao,motivo.trim());

      setContestar(null); setMotivo(''); toast('Contestação enviada para a logística.');
    }catch(e){toast('Não foi possível enviar a contestação: '+e.message);}
    finally{setEnviandoContestacao(false);}
  };
  const mesesDisp = MESES_2026.slice(0,7);
  return (
    <React.Fragment>
      <div className="seletor-mes">
        {mesesDisp.map(m=> <button key={m} className={'mes-pill'+(m===mes?' on':'')} onClick={()=>setMes(m)}>{mesLabel(m)}</button>)}

        <div className="card"><div className="v num">{brn(ap.peso,1)}</div><div className="l">Peso (t)</div></div>
        <div className="card"><div className="v num">{brl(ap.fat)}</div><div className="l">Faturamento</div></div>
      </div>
      {!ap.temDados && <div className="card muted">Nenhuma carga registrada em {mesLabel(mes)}.</div>}
      {ap.temDados && !ap.detalhe &&
        <div className="aviso-box">O detalhe carga a carga de {mesLabel(mes)} ainda não foi importado para o app — os totais acima vêm do fechamento do mês. A partir de Mai/2026 a lista completa está disponível.</div>}
      {cargasMes.map(c=>{
        const ct = contestDaCarga(c.id);
        const detalhesAbertos=ct&&detalheContestacao===String(ct.id);
        const limiteFaixaKg=c.pbtMotivo==='ABAIXO_DA_FAIXA'?c.limiteInferiorKg:c.limiteSuperiorKg;
        return (
          <div className="card carga" key={c.id}>

              <div className="grow">
                <div className="rota">{c.origem} <span className="seta">→</span> {c.destino}</div>

                {c.pbtForaFaixa&&<div className="tag tag-neg" style={{marginTop:7}}>
                  PBT fora da faixa — limite <span style={{whiteSpace:'nowrap'}}>{brn(Number(limiteFaixaKg||0)/1000,2)} t</span>
                </div>}
              </div>
              <div style={{textAlign:'right'}}>
                <div className="valor num">{brl(c.valor)}</div>
                {ct ? <StatusTag s={ct.status}/> :
                  <button className={'btn '+(c.pbtForaFaixa?'btn-p':'btn-g')+' btn-sm'} style={{marginTop:4}} onClick={()=>abrirContestacao(c)}>

              {detalhesAbertos&&<div className="card" style={{marginTop:8,marginBottom:0,boxShadow:'none',background:'var(--papel)'}}>

                <div style={{marginTop:6}}><b>Data da solicitação:</b> {ct.data?dataBR(ct.data):'Não informada'}</div>

            </div>}

      {contestar &&
        <Modal titulo="Contestar carga" onClose={()=>setContestar(null)}>
          <div className="card" style={{background:'var(--papel)', boxShadow:'none', marginBottom:12}}>
            <b>{contestar.origem} → {contestar.destino}</b>

          </div>

        </Modal>}
    </React.Fragment>
  );
}

/* ================= MOTORISTA: PREMIAÇÃO ================= */
function Regua({fat, meta}){
  if(!meta) {
    return (
      <div className="regua" style={{opacity:.55}}>
        <div className="fill" style={{width:'0%'}}></div>
        <div className="marco" style={{left:'35%'}}><span className="flag">START</span></div>
        <div className="marco meta" style={{left:'78%'}}><span className="flag">META</span></div>
        <span className="caminhao" style={{left:'3%'}}>🚛</span>
      </div>
    );
  }
  const fim = Math.max(meta.meta * 1.25, meta.start * 1.35, 1);
  const pct = Math.max(0, Math.min(100, fat/fim*100));
  const pStart = meta.start/fim*100, pMeta = meta.meta/fim*100;
  return (
    <div className="regua">
      <div className={'fill'+(fat>=meta.meta?' alem':'')} style={{width:pct+'%'}}></div>
      <div className="marco" style={{left:pStart+'%'}}><span className="flag">START {brn(meta.start/1000,0)}k</span></div>
      <div className="marco meta" style={{left:pMeta+'%'}}><span className="flag">META {brn(meta.meta/1000,0)}k</span></div>
      <span className="caminhao" style={{left:pct+'%'}}>🚛</span>
    </div>
  );
}

  const pctStart = ap.meta ? Math.min(100, ap.fat/ap.meta.start*100) : 0;
  const pctMeta = ap.meta ? Math.min(100, ap.fat/ap.meta.meta*100) : 0;
  const faltaStart = ap.meta ? Math.max(0, ap.meta.start - ap.fat) : 0;

  const mesesVisiveis = mesesAteHoje();

      </div>

      <div className="card">
        <div className="row" style={{marginBottom:10}}>
          <h3 className="grow">{quad.nome}</h3>
          <span className="tag tag-neutro">Pagamento {quad.pgto}</span>
        </div>
        {apsQuad.map(a=>{
          const futuro = a.mes > MES_ATUAL;
          return (
            <div className={'quad-mes'+(a.mes===mes?' on':'')} key={a.mes}

}
