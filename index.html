        {pendentes.length===0 && <div className="card muted">Nenhum check list aguardando aprovação no período selecionado.</div>}
        {pendentes.map(ck=>
          <div className="card row" key={ck.id}>
            <div className="grow"><b>{primeiroNome(ck.motorista)}</b><div className="muted">{dataBR(ck.data)} · {ck.placa} · {ck.respostas.filter(r=>r.resp==='NC').length} não conformidade(s)</div></div>
            <button className="btn btn-s btn-sm" onClick={()=>setVer(ck)}>Analisar</button>
          </div>)}
      </React.Fragment>}

      {sub==='bloqueados' && pode(user,'checklist.aprovacao') && <React.Fragment>
        <div className="card">
          <div className="row"><div className="grow"><h3>Veículos bloqueados temporariamente</h3><div className="muted">Bloqueios definidos após análise de checklist, sinistro ou decisão operacional.</div></div><button className="btn btn-s btn-sm" onClick={carregarBloqueados}>{carregandoBloqueados?'Atualizando...':'Atualizar'}</button></div>
        </div>
        {!carregandoBloqueados&&veiculosBloqueados.length===0&&<div className="card muted">Nenhum veículo bloqueado no momento.</div>}
        {veiculosBloqueados.map(v=><div className="card row" key={v.itemId}><div className="grow"><b>{v.placa}</b><div className="muted">{v.motivo||'Motivo não informado'}{v.bloqueadoEm?' · '+fmtDataHora(v.bloqueadoEm):''}</div></div><button className="btn btn-p btn-sm" onClick={()=>{setLiberandoVeiculo(v);setObservacaoLiberacao('');}}>Liberar veículo</button></div>)}
      </React.Fragment>}

      {sub==='perguntas' && pode(user,'checklist.perguntas') && <React.Fragment>
        <div className="card">
          <h3 style={{marginBottom:10}}>{editandoPergunta?'Editar pergunta':'Nova pergunta'}</h3>
          <div className="form-grid">
            <div style={{gridColumn:'1/-1'}}><label>Texto</label><input value={novaPerg.texto} onChange={e=>setNovaPerg({...novaPerg, texto:e.target.value})} placeholder="Ex.: Cintas e catracas de amarração em condições"/></div>
            <div><label>TipoVeículo</label>
              <select value={novaPerg.frota} onChange={e=>setNovaPerg({...novaPerg, frota:e.target.value})}>
                <option value="leve">FROTA LEVE</option>
                <option value="pesada">FROTA PESADA</option>
              </select>
            </div>
            <div><label>Grupo</label>
              <select value={novaPerg.grupo} onChange={e=>setNovaPerg({...novaPerg, grupo:e.target.value})}>
                <option value="Anomalias estéticas">Anomalias estéticas</option>
                <option value="Anomalias mecânicas">Anomalias mecânicas</option>
                <option value="Anomalias elétricas">Anomalias elétricas</option>
              </select>
            </div>
            <div><label>Frequência</label>
              <select value={novaPerg.frequencia} onChange={e=>setNovaPerg({...novaPerg, frequencia:e.target.value})}>
                <option value="Diária">Diária</option>
                <option value="Semanal">Semanal</option>
                <option value="Mensal">Mensal</option>
              </select>
            </div>
            <div><label>Ordem dentro do grupo</label><input type="number" min="0" step="1" value={novaPerg.ordem} onChange={e=>setNovaPerg({...novaPerg,ordem:e.target.value})}/></div>
            <div><label>Resposta obrigatória?</label><select value={novaPerg.obrigatoria?'s':'n'} onChange={e=>setNovaPerg({...novaPerg, obrigatoria:e.target.value==='s'})}><option value="s">Sim</option><option value="n">Não</option></select></div>
            <div><label>Foto obrigatória se NC?</label><select value={novaPerg.fotoNC?'s':'n'} onChange={e=>setNovaPerg({...novaPerg, fotoNC:e.target.value==='s'})}><option value="n">Não</option><option value="s">Sim</option></select></div>
          </div>
          <div className="row" style={{marginTop:12}}><button className="btn btn-p" onClick={salvarPergunta}>{editandoPergunta?'Salvar alterações':'Adicionar pergunta'}</button>{editandoPergunta&&<button className="btn btn-s" onClick={()=>{setEditandoPergunta(null);setNovaPerg(perguntaVazia);}}>Cancelar edição</button>}</div>
        </div>
        <div className="row" style={{flexWrap:'wrap'}}>
          <div className="subtabs grow">
            {[['pesada','Frota pesada'],['leve','Frota leve'],['todas','Todas']].map(([v,l])=>
              <button key={v} className={'subtab'+(fFrota===v?' on':'')} onClick={()=>setFFrota(v)}>{l}</button>)}
          </div>
          <button className="btn btn-s btn-sm" disabled={carregandoCatalogo} onClick={carregarCatalogo}>
            {carregandoCatalogo?'Atualizando...':'Atualizar do SharePoint'}
          </button>
        </div>
        <div className="card" style={{overflowX:'auto'}}>
          <table>
            <thead><tr><th>Pergunta</th><th>Grupo</th><th>Ordem</th><th>TipoVeículo</th><th>Frequência</th><th>Obrigatória</th><th>Foto se NC</th><th>Ativa</th><th>Ações</th></tr></thead>
            <tbody>{st.perguntas.filter(p=>fFrota==='todas'||p.frota===fFrota||p.frota==='ambas').map(p=>
              <tr key={p.id} style={{opacity:p.ativa?1:.45}}>
                <td>{p.texto}</td>
                <td className="muted">{p.grupo}</td>
                <td><b>{p.ordem}</b></td>
                <td><span className="tag tag-neutro">{p.frota==='leve'?'Frota leve':'Frota pesada'}</span></td>
                <td><span className="tag tag-neutro">{p.frequencia || 'Diária'}</span></td>
                <td>{p.obrigatoria?'Sim':'Não'}</td>
                <td>{p.fotoNC?'Sim':'Não'}</td>
                <td><span className={'tag '+(p.ativa?'tag-ok':'tag-neg')}>{p.ativa?'Ativa':'Inativa'}</span></td>
                <td><div className="row" style={{gap:6,flexWrap:'nowrap'}}><button className="btn btn-s btn-sm" onClick={()=>iniciarEdicao(p)}>Editar</button><button className={'btn btn-sm '+(p.ativa?'btn-s':'btn-p')} onClick={()=>alternarPergunta(p)}>{p.ativa?'Inativar':'Reativar'}</button></div></td>
              </tr>)}</tbody>
          </table>
        </div>
      </React.Fragment>}

      {sub==='relatorio' && pode(user,'checklist.relatorio') && <React.Fragment>
        <div className="row" style={{flexWrap:'wrap'}}>
          <div className="row" style={{gap:6,flexWrap:'nowrap'}}><input type="month" aria-label="Filtrar relatório por mês" style={{width:'auto'}} value={fMes} onChange={e=>setFMes(e.target.value)}/><button className="btn btn-g btn-sm" type="button" onClick={()=>setFMes('')}>Todos os meses</button></div>
          <select style={{width:'auto'}} value={fPlaca} onChange={e=>setFPlaca(e.target.value)}>
            <option value="todas">Todas as placas</option>
            {placas.map(p=><option key={p} value={p}>{p}</option>)}
          </select>
          <select style={{width:'auto'}} value={fMot} onChange={e=>setFMot(e.target.value)}>
            <option value="todos">Todos os motoristas</option>
            {motoristas.map(m=><option key={m} value={m}>{primeiroNome(m)}</option>)}
          </select>
          <select style={{width:'auto'}} value={fStatus} onChange={e=>setFStatus(e.target.value)}>
            <option value="todos">Todos os status</option><option value="pendente">Aguardando análise</option><option value="aprovado">Aprovados</option><option value="reprovado">Reprovados</option>
          </select>
          <button className="btn btn-g btn-sm" onClick={()=>{setFMes('');setFPlaca('todas');setFMot('todos');setFStatus('todos')}}>Limpar filtros</button>
        </div>
        <div className="totais">
          <div className="card"><div className="v num">{totaisRelatorio.total}</div><div className="l">Checklists</div></div>
          <div className="card"><div className="v num" style={{color:'var(--mata)'}}>{totaisRelatorio.aprovados}</div><div className="l">Aprovados</div></div>
          <div className="card"><div className="v num" style={{color:totaisRelatorio.reprovados?'var(--erro)':'var(--mata)'}}>{totaisRelatorio.reprovados}</div><div className="l">Reprovados</div></div>
          <div className="card"><div className="v num">{totaisRelatorio.pendentes}</div><div className="l">Aguardando</div></div>
        </div>
        {relatorio.length===0 && <div className="card muted">Nenhum checklist encontrado nos filtros selecionados.</div>}
        {relatorio.map(ck=>
          <div className="card row" key={ck.id}>
            <div className="grow"><b>{primeiroNome(ck.motorista)}</b> <span className="muted">· {dataBR(ck.data)} · {ck.placa}</span>
              <div className="muted">{ck.respostas.filter(r=>r.resp==='NC').length} NC · {ck.respostas.filter(r=>r.foto).length} foto(s)</div></div>
            <StatusTag s={ck.status}/>
            <button className="btn btn-g btn-sm" onClick={()=>setVer(ck)}>Ver</button>
          </div>)}
      </React.Fragment>}

      {ver && !reprovando &&
        <ChecklistDetalhe ck={ver} perguntas={st.perguntas} onClose={()=>setVer(null)}
          acoes={ver.status==='pendente' &&
            <div>
              <div className="card" style={{boxShadow:'none',border:'1px solid var(--linha)',marginBottom:10}}>
                <label>Bloquear o veículo após aprovar?</label>
                <select value={bloquearAoAprovar?'s':'n'} onChange={e=>setBloquearAoAprovar(e.target.value==='s')}><option value="n">Não</option><option value="s">Sim</option></select>
                {bloquearAoAprovar&&<div style={{marginTop:10}}><label>Motivo do bloqueio</label><textarea rows="2" value={motivoBloqueio} onChange={e=>setMotivoBloqueio(e.target.value)} placeholder="Ex.: pneu com avaria impeditiva; aguardar manutenção."/></div>}
              </div>
              <div className="row">
                <button className="btn btn-d grow" onClick={()=>setReprovando(ver)}>Reprovar</button>
                <button className="btn btn-p grow" onClick={()=>decidir(ver,'aprovado','',{bloquearVeiculo:bloquearAoAprovar,motivoBloqueio})}>Aprovar</button>
              </div>
            </div>}/>}
      {reprovando &&
        <Modal titulo="Reprovar check list" onClose={()=>setReprovando(null)}>
          <label>Motivo (o motorista verá e deverá refazer)</label>
          <textarea rows="3" value={motivoRep} onChange={e=>setMotivoRep(e.target.value)} placeholder="Ex.: foto do vazamento não permite identificar o local; refazer com foto mais próxima."/>
          <button className="btn btn-d" style={{width:'100%', marginTop:12}} onClick={()=>{ if(!motivoRep.trim()){toast('Informe o motivo da reprovação.'); return;} decidir(reprovando,'reprovado',motivoRep.trim()); }}>Confirmar reprovação</button>
        </Modal>}
      {liberandoVeiculo&&<Modal titulo={'Liberar veículo '+liberandoVeiculo.placa} onClose={()=>setLiberandoVeiculo(null)}>
        <div className="aviso-box">Motivo atual: {liberandoVeiculo.motivo||'Não informado'}</div>
        <label>Observação da liberação</label><textarea rows="3" value={observacaoLiberacao} onChange={e=>setObservacaoLiberacao(e.target.value)} placeholder="Ex.: manutenção concluída e veículo conferido."/>
        <button className="btn btn-p" style={{width:'100%',marginTop:12}} onClick={liberarVeiculo}>Confirmar liberação</button>
      </Modal>}
    </React.Fragment>
  );
}

/* ================= ADM: PREMIAÇÃO (metas + descontos) ================= */
function AdmPremiacao({st, setSt, toast, user}){
  const podeEditarMetas=pode(user,'metas.editar');
  const podeEditarDescontos=pode(user,'descontos.editar');
  const [sub,setSub]=useState(pode(user,'premiacao.visualizar')?'painel':pode(user,'metas.visualizar')?'metas':'desc');
  const [edit,setEdit]=useState(null);
  const [editTipo,setEditTipo]=useState(null);
  const [competencia,setCompetencia]=useState(MES_ATUAL.slice(3)+'-'+MES_ATUAL.slice(0,2));
  const [fMotorista,setFMotorista]=useState('');
  const [fTipoMeta,setFTipoMeta]=useState('');
  const [fStatusDesc,setFStatusDesc]=useState('PENDENTES');
  const [fCategoriaDesc,setFCategoriaDesc]=useState('');
  const [fSituacaoDesc,setFSituacaoDesc]=useState('');
  const [fBuscaDesc,setFBuscaDesc]=useState('');
  const [painel,setPainel]=useState({metas:[],tiposVeiculo:[],descontos:[],elegiveis:[],pendencias:{}});
  const [novoDesc,setNovoDesc]=useState({motoristaId:'',motoristaNome:'',categoria:'Multas',situacao:'Sem ocorrência',quantidade:0,valor:0,percentual:0,dataOcorrencia:'',motivo:'',exibir:true});
  const categorias=['Notificação / Advertência','Multas','Auditoria Interna'];
  const carregarMetas=async()=>{
    try{
      const r=await ApiService.admPremiacaoMetas();
      setPainel(p=>({...p,metas:r.metas||[],tiposVeiculo:r.tiposVeiculo||[],veiculosPremiacao:r.veiculosPremiacao||[]}));
      setSt(s=>({...s,metas:r.metas||s.metas}));
    }catch(e){toast('Erro ao carregar metas: '+e.message)}
  };
  const carregarDescontos=async()=>{
    try{
      const r=await ApiService.admPremiacaoDescontos(competencia);
      setPainel(p=>({...p,competencia:r.competencia,descontos:r.descontos||[],elegiveis:r.elegiveis||[],pendencias:r.pendencias||{},diagnosticoElegibilidade:r.diagnosticoElegibilidade||[]}));
    }catch(e){toast('Erro ao carregar descontos: '+e.message)}
  };
  const carregarAtual=async()=>{
    if(sub==='metas') return carregarMetas();
    if(sub==='desc') return carregarDescontos();
    await Promise.all([carregarMetas(),carregarDescontos()]);
  };
  useEffect(()=>{carregarAtual();},[sub,competencia]);
  const statusMeta=m=>{
    const hoje=HOJE;
    if(m.ativo===false)return'Inativa';
    if(m.vigIni&&hoje<m.vigIni)return'Programada';
    if(m.vigFim&&hoje>m.vigFim)return'Finalizada';
    return'Ativa';
  };
  const salvarMeta=async(e)=>{
    if(e&&e.preventDefault)e.preventDefault();
    if(!edit.tipo||!edit.vigIni||!edit.vigFim){toast('Preencha tipo de veículo e vigência.');return;}
    try{await ApiService.salvarMeta(edit);setEdit(null);await carregarMetas();toast('Meta salva no SharePoint.');}
    catch(e){toast('Erro ao salvar meta: '+e.message)}
  };
  const addDesc=async()=>{
    if(!novoDesc.motoristaId){toast('Selecione o motorista.');return;}
    if(novoDesc.motoristaId==='__TODOS__'){
      if(novoDesc.situacao!=='Sem ocorrência'){toast('O lançamento em massa é permitido somente para Sem ocorrência.');return;}
      const pendentes=((painel.pendencias||{})[novoDesc.categoria]||[]);
      if(!pendentes.length){toast('Não há motoristas pendentes nesta categoria.');return;}
      try{
        for(const motorista of pendentes){
          await ApiService.salvarDesconto({
            ...novoDesc,itemId:undefined,competencia,
            motoristaId:motorista.motoristaId,motoristaNome:motorista.nome,
            quantidade:0,valor:0,percentual:0,dataOcorrencia:'',motivo:''
          });
        }
        await carregarDescontos();
        setNovoDesc({motoristaId:'',motoristaNome:'',categoria:novoDesc.categoria,situacao:'Sem ocorrência',quantidade:0,valor:0,percentual:0,dataOcorrencia:'',motivo:'',exibir:true});
        toast(`${pendentes.length} motoristas foram lançados como Sem ocorrência.`);
      }catch(e){toast('Erro no lançamento em massa: '+e.message)}
      return;
    }
    if(novoDesc.situacao==='Com ocorrência'&&!Number(novoDesc.valor)&&!Number(novoDesc.percentual)){toast('Informe o valor ou percentual do desconto.');return;}
    try{await ApiService.salvarDesconto({...novoDesc,competencia});await carregarDescontos();setNovoDesc({motoristaId:'',motoristaNome:'',categoria:'Multas',situacao:'Sem ocorrência',quantidade:0,valor:0,percentual:0,dataOcorrencia:'',motivo:'',exibir:true});toast(novoDesc.itemId?'Lançamento atualizado no SharePoint.':'Conferência salva no SharePoint.');}
    catch(e){toast('Erro ao salvar conferência: '+e.message)}
  };
  const tiposMeta=[...new Map(
    (painel.tiposVeiculo||[]).filter(Boolean).map(tipo=>[chaveTipo(tipo),tipo])
  ).values()].sort((a,b)=>a.localeCompare(b,'pt-BR'));
  const tipoPelaChave=chave=>{
    const normalizarChave=v=>chaveTipo(v).replace(/[^A-Z0-9]/g,'');
    const prefixo=normalizarChave(String(chave||'').split('|')[0]);
    if(!prefixo)return'';
    return tiposMeta.find(t=>normalizarChave(t)===prefixo)||'';
  };
  const tipoOficial=(tipo,chave)=>tiposMeta.find(t=>chaveTipo(t)===chaveTipo(tipo))||tipo||tipoPelaChave(chave);
  const metas=(painel.metas||[])
    .map(m=>({...m,tipo:tipoOficial(m.tipo,m.chave)}))
    .filter(m=>!fTipoMeta||chaveTipo(m.tipo)===chaveTipo(fTipoMeta));
  const elegiveis=(painel.elegiveis||[]).filter(u=>!fMotorista||u.motoristaId===fMotorista);
  const acompanhamentoDescontos=(painel.elegiveis||[]).flatMap(u=>categorias.map(categoria=>{
    const registro=(painel.descontos||[]).find(d=>String(d.motoristaId)===String(u.motoristaId)&&String(d.categoria)===categoria);
    return {
      motoristaId:String(u.motoristaId),motoristaNome:u.nome,categoria,
      status:registro?'CONFERIDO':'PENDENTE',registro:registro||null,
      situacao:registro?.situacao||'',motivo:registro?.motivo||'',
      valor:Number(registro?.valor||0),dataOcorrencia:registro?.dataOcorrencia||''
    };
  })).filter(linha=>{
    const busca=normalizar(fBuscaDesc);
    const okBusca=!busca||normalizar(linha.motoristaNome).includes(busca)||normalizar(linha.categoria).includes(busca)||normalizar(linha.motivo).includes(busca);
    const okMotorista=!fMotorista||linha.motoristaId===String(fMotorista);
    const okCategoria=!fCategoriaDesc||linha.categoria===fCategoriaDesc;
    const okStatus=fStatusDesc==='TODOS'||linha.status===fStatusDesc.slice(0,-1);
    const okSituacao=!fSituacaoDesc||linha.situacao===fSituacaoDesc;
    return okBusca&&okMotorista&&okCategoria&&okStatus&&okSituacao;
  }).sort((a,b)=>a.status.localeCompare(b.status)||a.motoristaNome.localeCompare(b.motoristaNome,'pt-BR')||a.categoria.localeCompare(b.categoria,'pt-BR'));
  const selecionarCategoria=categoria=>{
    setFCategoriaDesc(categoria);setFStatusDesc('PENDENTES');setFSituacaoDesc('');
    setNovoDesc(v=>({...v,itemId:undefined,motoristaId:'',motoristaNome:'',categoria,situacao:'Sem ocorrência',quantidade:0,valor:0,percentual:0,dataOcorrencia:'',motivo:''}));
  };
  const prepararConferencia=linha=>{
    if(linha.registro){
      const d=linha.registro;
      setNovoDesc({itemId:d.itemId,motoristaId:d.motoristaId,motoristaNome:d.motoristaNome,categoria:d.categoria,situacao:d.situacao||'Sem ocorrência',quantidade:d.quantidade||0,valor:d.valor||0,percentual:d.percentual||0,dataOcorrencia:d.dataOcorrencia||'',motivo:d.motivo||'',exibir:d.exibir!==false});
    }else{
      setNovoDesc({motoristaId:linha.motoristaId,motoristaNome:linha.motoristaNome,categoria:linha.categoria,situacao:'Sem ocorrência',quantidade:0,valor:0,percentual:0,dataOcorrencia:'',motivo:'',exibir:true});
    }
    setTimeout(()=>document.getElementById('form-descontos')?.scrollIntoView({behavior:'smooth',block:'start'}),0);
  };
  return (
    <React.Fragment>
      <div className="row" style={{flexWrap:'wrap'}}>
        <h2 className="grow">Premiação</h2>
        <div className="subtabs">
          {pode(user,'premiacao.visualizar')&&<button className={'subtab'+(sub==='painel'?' on':'')} onClick={()=>setSub('painel')}>Painel</button>}
          {pode(user,'metas.visualizar')&&<button className={'subtab'+(sub==='metas'?' on':'')} onClick={()=>setSub('metas')}>Metas</button>}
          {pode(user,'descontos.visualizar')&&<button className={'subtab'+(sub==='desc'?' on':'')} onClick={()=>setSub('desc')}>Descontos</button>}
        </div>
      </div>

      {sub==='painel' && pode(user,'premiacao.visualizar') && <React.Fragment>
        <div className="form-grid" style={{marginBottom:12}}>
          <div><label>Competência</label><input type="month" value={competencia} onChange={e=>setCompetencia(e.target.value)}/></div>
        </div>
        <div className="kpis">
          <div className="kpi"><span>Metas cadastradas</span><b>{(painel.metas||[]).length}</b></div>
          <div className="kpi"><span>Motoristas elegíveis</span><b>{(painel.elegiveis||[]).length}</b></div>
          <div className="kpi"><span>Descontos lançados</span><b>{(painel.descontos||[]).filter(d=>d.competencia===competencia).length}</b></div>
        </div>
        <div className="aviso-box">Visão geral da premiação na competência selecionada. O acesso a Metas e Descontos é controlado separadamente pelo perfil.</div>
      </React.Fragment>}

      {sub==='metas' && pode(user,'metas.visualizar') && <React.Fragment>
        <div className="row" style={{marginBottom:12,flexWrap:'wrap'}}>
          <select style={{width:'auto'}} value={fTipoMeta} onChange={e=>setFTipoMeta(e.target.value)}>
            <option value="">Todos os tipos de veículo</option>
            {tiposMeta.map(tipo=><option key={tipo} value={tipo}>{tipo}</option>)}
          </select>
          <div className="grow"></div>
          {podeEditarMetas&&<button className="btn btn-p" onClick={()=>setEdit({tipo:'',start:0,meta:0,valorMeta:0,pctStart:0,pctMeta:0,teto:0,vigIni:HOJE,vigFim:HOJE.slice(0,4)+'-12-31',status:'Ativa',ativo:true,observacao:''})}>+ Incluir meta</button>}
        </div>
        <div className="card" style={{overflowX:'auto'}}>
          <table>
            <thead><tr><th>Tipo de veículo</th><th className="td-num">Start</th><th className="td-num">Meta</th><th className="td-num">Na meta</th><th className="td-num">% start→meta</th><th className="td-num">% acima meta</th><th className="td-num">Teto mensal</th><th>Vigência</th><th>Status</th><th></th></tr></thead>
            <tbody>{metas.map(m=>
              <tr key={m.itemId||m.id}>
                <td><b>{m.tipo}</b></td>
                <td className="td-num num">{brl(m.start)}</td>
                <td className="td-num num">{brl(m.meta)}</td>
                <td className="td-num num">{brl(m.valorMeta)}</td>
                <td className="td-num num">{m.pctStart}%</td>
                <td className="td-num num">{m.pctMeta}%</td>
                <td className="td-num num">{brl(m.teto)}</td>
                <td className="muted">{dataBR(m.vigIni)} — {dataBR(m.vigFim)}</td>
                <td><span className="tag tag-neutro">{statusMeta(m)}</span></td>
                <td>{podeEditarMetas&&<button className="btn btn-s btn-sm" onClick={()=>setEdit({...m})}>Editar</button>}</td>
              </tr>)}</tbody>
          </table>
        </div>
        <div className="aviso-box">As metas são gravadas por vigência. Cadastre uma nova meta para um novo período sem alterar o histórico finalizado.</div>
      </React.Fragment>}

      {sub==='desc' && pode(user,'descontos.visualizar') && <React.Fragment>
        <div className="card" style={{padding:12}}>
          <div className="filtros-operacionais">
            <div><label>Competência</label><input type="month" value={competencia} onChange={e=>setCompetencia(e.target.value)}/></div>
            <div><label>Motorista</label><select value={fMotorista} onChange={e=>setFMotorista(e.target.value)}><option value="">Todos os motoristas</option>{(painel.elegiveis||[]).map(u=><option key={u.motoristaId} value={u.motoristaId}>{u.nome}</option>)}</select></div>
            <div><label>Buscar</label><input value={fBuscaDesc} onChange={e=>setFBuscaDesc(e.target.value)} placeholder="Motorista, categoria ou motivo"/></div>
            <div><label>Status da conferência</label><select value={fStatusDesc} onChange={e=>{setFStatusDesc(e.target.value);if(e.target.value==='PENDENTES')setFSituacaoDesc('')}}><option value="PENDENTES">Somente pendentes</option><option value="CONFERIDOS">Somente conferidos</option><option value="TODOS">Todos</option></select></div>
            <div><label>Categoria</label><select value={fCategoriaDesc} onChange={e=>setFCategoriaDesc(e.target.value)}><option value="">Todas as categorias</option>{categorias.map(c=><option key={c}>{c}</option>)}</select></div>
            <div><label>Situação lançada</label><select disabled={fStatusDesc==='PENDENTES'} value={fSituacaoDesc} onChange={e=>setFSituacaoDesc(e.target.value)}><option value="">Todas</option><option>Sem ocorrência</option><option>Com ocorrência</option></select></div>
            <div><button className="btn btn-g" style={{width:'100%'}} onClick={()=>{setFMotorista('');setFBuscaDesc('');setFStatusDesc('PENDENTES');setFCategoriaDesc('');setFSituacaoDesc('')}}>Limpar filtros</button></div>
          </div>
        </div>

        <div className="totais">
          {categorias.map(c=>{
            const buscaCard=normalizar(fBuscaDesc);
            const quantidade=((painel.pendencias||{})[c]||[]).filter(u=>(!fMotorista||String(u.motoristaId)===String(fMotorista))&&(!buscaCard||normalizar(u.nome).includes(buscaCard))).length;
            return <button className={'card card-atalho'+(fCategoriaDesc===c&&fStatusDesc==='PENDENTES'?' on':'')} key={c} onClick={()=>selecionarCategoria(c)}>

            </button>;
          })}
        </div>

        {podeEditarDescontos&&<div className="card" id="form-descontos">
          <div className="row" style={{marginBottom:10,flexWrap:'wrap'}}>
            <div className="grow"><h3>{novoDesc.itemId?'Editar conferência':'Conferir desconto'}</h3><div className="muted">Para o cenário padrão, selecione todos os pendentes e grave como “Sem ocorrência”. As exceções podem ser tratadas individualmente.</div></div>
            {!novoDesc.itemId&&((painel.pendencias||{})[novoDesc.categoria]||[]).length>0&&<button className="btn btn-s btn-sm" onClick={()=>setNovoDesc({...novoDesc,motoristaId:'__TODOS__',motoristaNome:'',situacao:'Sem ocorrência',quantidade:0,valor:0,percentual:0,dataOcorrencia:'',motivo:''})}>Selecionar todos os pendentes</button>}
          </div>
          {novoDesc.itemId&&<div className="aviso-box" style={{marginBottom:12}}>Editando lançamento existente. Ao salvar, o registro será atualizado sem criar duplicidade.</div>}
          <div className="form-grid">
            <div><label>Motorista</label>
              <select value={novoDesc.motoristaId} onChange={e=>{const u=(painel.elegiveis||[]).find(x=>String(x.motoristaId)===String(e.target.value));setNovoDesc({...novoDesc,motoristaId:e.target.value,motoristaNome:u?.nome||''})}}>
                <option value="">Selecionar...</option>
                {!novoDesc.itemId&&<option value="__TODOS__">✓ Todos os motoristas pendentes</option>}
                {elegiveis.map(u=><option key={u.motoristaId} value={u.motoristaId}>{u.nome}</option>)}
              </select></div>
            <div><label>Categoria</label><select value={novoDesc.categoria} onChange={e=>setNovoDesc({...novoDesc,categoria:e.target.value})}>{categorias.map(c=><option key={c}>{c}</option>)}</select></div>
            <div><label>Situação</label><select value={novoDesc.situacao} onChange={e=>setNovoDesc({...novoDesc,situacao:e.target.value,motoristaId:e.target.value==='Com ocorrência'&&novoDesc.motoristaId==='__TODOS__'?'':novoDesc.motoristaId})}><option>Sem ocorrência</option><option>Com ocorrência</option></select></div>
            <div><label>Quantidade</label><input type="number" min="0" value={novoDesc.quantidade} onChange={e=>setNovoDesc({...novoDesc,quantidade:e.target.value})}/></div>
            {novoDesc.situacao==='Com ocorrência'&&<React.Fragment>
              <div><label>Valor do desconto (R$)</label><input type="number" min="0" value={novoDesc.valor} onChange={e=>setNovoDesc({...novoDesc,valor:e.target.value})}/></div>
              <div><label>Percentual (%)</label><input type="number" min="0" max="100" value={novoDesc.percentual} onChange={e=>setNovoDesc({...novoDesc,percentual:e.target.value})}/></div>
              <div><label>Data da ocorrência</label><input type="date" value={novoDesc.dataOcorrencia} onChange={e=>setNovoDesc({...novoDesc,dataOcorrencia:e.target.value})}/></div>
              <div style={{gridColumn:'1/-1'}}><label>Motivo</label><textarea value={novoDesc.motivo} onChange={e=>setNovoDesc({...novoDesc,motivo:e.target.value})}/></div>
            </React.Fragment>}
          </div>
          {novoDesc.motoristaId==='__TODOS__'&&<div className="aviso-box" style={{marginTop:12}}>Serão gravados como <b>Sem ocorrência</b> todos os {((painel.pendencias||{})[novoDesc.categoria]||[]).length} motoristas ainda pendentes em {novoDesc.categoria}. Quem já foi conferido não será alterado.</div>}
          <div className="row" style={{marginTop:12}}>
            <button className="btn btn-p" onClick={addDesc}>{novoDesc.itemId?'Salvar edição':'Salvar conferência'}</button>
            {(novoDesc.itemId||novoDesc.motoristaId)&&<button className="btn btn-s" onClick={()=>setNovoDesc({motoristaId:'',motoristaNome:'',categoria:novoDesc.categoria||'Multas',situacao:'Sem ocorrência',quantidade:0,valor:0,percentual:0,dataOcorrencia:'',motivo:'',exibir:true})}>Limpar lançamento</button>}
          </div>
        </div>}

        <div className="card" style={{overflowX:'auto'}}>
          <div className="row" style={{marginBottom:10,flexWrap:'wrap'}}><div className="grow"><h3>Acompanhamento da conferência</h3><div className="muted">{acompanhamentoDescontos.length} registro(s) encontrados nos filtros.</div></div></div>
          <table>
            <thead><tr><th>Motorista</th><th>Categoria</th><th>Status</th><th>Situação</th><th>Data / motivo</th><th className="td-num">Valor</th><th></th></tr></thead>
            <tbody>{acompanhamentoDescontos.map(linha=>{
              const d=linha.registro;
              return <tr key={linha.motoristaId+'|'+linha.categoria} className={linha.status==='PENDENTE'?'linha-pendente':'linha-confirmada'}>
                <td><b>{linha.motoristaNome}</b></td><td>{linha.categoria}</td>
                <td><span className={'tag '+(linha.status==='PENDENTE'?'tag-pend':'tag-ok')}>{linha.status==='PENDENTE'?'Pendente':'Conferido'}</span></td>
                <td>{linha.status==='PENDENTE'?<span className="muted">Ainda não lançado</span>:<span className={'tag '+(linha.situacao==='Com ocorrência'?'tag-neg':'tag-neutro')}>{linha.situacao||'Conferido'}</span>}</td>
                <td>{d?<React.Fragment>{d.dataOcorrencia&&<div>{dataBR(String(d.dataOcorrencia).slice(0,10))}</div>}<div className="muted">{d.motivo||'Sem motivo informado'}</div></React.Fragment>:<span className="muted">Aguardando conferência</span>}</td>
                <td className="td-num num" style={{color:linha.valor?'var(--erro)':'var(--cinza)'}}>{d?brl(-Math.abs(linha.valor||0)):'—'}</td>
                <td>{podeEditarDescontos&&<button className="btn btn-s btn-sm" onClick={()=>prepararConferencia(linha)}>{linha.status==='PENDENTE'?'Conferir':'Editar'}</button>}</td>
              </tr>;
            })}{!acompanhamentoDescontos.length&&<tr><td colSpan="7" className="muted" style={{textAlign:'center',padding:24}}>Nenhum registro encontrado para os filtros selecionados.</td></tr>}</tbody>
          </table>
        </div>
      </React.Fragment>}

      {edit &&
        <Modal titulo={edit.itemId?'Editar meta':'Incluir meta'} onClose={()=>setEdit(null)}>
          <div className="form-grid">
            <div style={{gridColumn:'1/-1'}}><label>Tipo de veículo</label>
              <select value={edit.tipo} onChange={e=>setEdit({...edit,tipo:e.target.value})}>
                <option value="">Selecionar...</option>
                {edit.tipo&&!tiposMeta.includes(edit.tipo)&&<option value={edit.tipo}>{edit.tipo}</option>}
                {tiposMeta.map(tipo=><option key={tipo} value={tipo}>{tipo}</option>)}
              </select>
              {!tiposMeta.length&&
                <div className="aviso-box" style={{marginTop:8}}>
                  Nenhum tipo foi encontrado nas placas da Frota Pesada. Cadastros consultados: {(painel.diagnosticoVeiculos||{}).totalCadastro||0}; placas pesadas identificadas: {(painel.diagnosticoVeiculos||{}).totalFrotaPesada||0}.
                </div>}
            </div>
            <div><label>Start (R$)</label><input type="number" value={edit.start} onChange={e=>setEdit({...edit, start:Number(e.target.value)})}/></div>
            <div><label>Meta (R$)</label><input type="number" value={edit.meta} onChange={e=>setEdit({...edit, meta:Number(e.target.value)})}/></div>
            <div><label>Valor na meta (R$)</label><input type="number" value={edit.valorMeta} onChange={e=>setEdit({...edit, valorMeta:Number(e.target.value)})}/></div>
            <div><label>Teto mensal (R$)</label><input type="number" value={edit.teto} onChange={e=>setEdit({...edit, teto:Number(e.target.value)})}/></div>
            <div><label>% start→meta</label><input type="number" value={edit.pctStart} onChange={e=>setEdit({...edit, pctStart:Number(e.target.value)})}/></div>
            <div><label>% acima da meta</label><input type="number" value={edit.pctMeta} onChange={e=>setEdit({...edit, pctMeta:Number(e.target.value)})}/></div>
            <div><label>Vigência início</label><input type="date" value={edit.vigIni} onChange={e=>setEdit({...edit, vigIni:e.target.value})}/></div>
            <div><label>Vigência fim</label><input type="date" value={edit.vigFim} onChange={e=>setEdit({...edit, vigFim:e.target.value})}/></div>
            <div><label>Ativa</label><select value={edit.ativo===false?'nao':'sim'} onChange={e=>setEdit({...edit,ativo:e.target.value==='sim'})}><option value="sim">Sim</option><option value="nao">Não</option></select></div>
          </div>
          <button type="button" className="btn btn-p" style={{width:'100%', marginTop:14}} onClick={salvarMeta}>Salvar meta</button>
        </Modal>}
    </React.Fragment>
  );
}

const AREAS_E_SUBTELAS = {

  ],

    ['CADASTRO_USUARIOS','Usuários'],
